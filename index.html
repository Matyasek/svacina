<script>
(() => {
"use strict";

// ===================== základ =====================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const HAND = '"Segoe Print","Bradley Hand","Chalkboard SE","Comic Sans MS",cursive';
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const rand = (a,b) => a + Math.random() * (b - a);
const hyp = Math.hypot;

const RED    = '#c33a2e';
const RED_D  = '#a92a20';
const BLUE   = '#2b47b0';
const PENCIL = '#87878f';
const INK    = '#1b2058';
const PAPER  = '#faf6ea';

let W = 0, H = 0, DPR = 1, MARGX = 70;
let paper = null;

// ===================== boiling lines =====================
let boil = 0; // 0..2, přepíná se několikrát za sekundu
function jj(seed){
  const s = Math.sin(seed * 127.1 + (boil + 1) * 311.7) * 43758.5453;
  return (s - Math.floor(s)) * 2 - 1;
}

// ===================== stav =====================
const PENCIL_CD = 5;      // cooldown kreslení falešného jablka
const GRACE = 2;          // ochranná lhůta po startu

const S = {
  mode: 'menu',           // menu | play | pause | over
  now: 0,                 // globální čas (běží pořád)
  time: 0,                // herní čas = skóre
  best: 0,
  graceUntil: 0,
  pencilReadyAt: 0,
  pencilShakeAt: -9,
  overAt: 0,
  grade: null,
  newBest: false,
  pointerKind: 'mouse'
};

const P = { x: 0, y: 0, vx: 0, vy: 0, r: 13, roll: 0, slowUntil: -9, inBlot: false };

let snake = null;
let fakes = [];   // {x,y,auto,id}
let blots = [];   // {x,y,r,shape[],drops[],id}
let qmarks = [];  // {x,y,life,id}
let pops = [];    // {text,x,y,age,color,size}
let nextId = 1;
let autoPending = -1;
let qTimer = 6;

const input = { mx: 0, my: 0, has: false, keys: Object.create(null), last: 'pointer' };
let touchStart = null;

const KEYMAP = {
  ArrowUp:[0,-1], KeyW:[0,-1], ArrowDown:[0,1], KeyS:[0,1],
  ArrowLeft:[-1,0], KeyA:[-1,0], ArrowRight:[1,0], KeyD:[1,0]
};

function loadBest(){
  try { const v = localStorage.getItem('svacina-best'); return v ? Math.max(0, parseFloat(v) || 0) : 0; }
  catch(e){ return 0; }
}
function saveBest(v){
  try { localStorage.setItem('svacina-best', String(Math.round(v))); } catch(e){}
}
S.best = loadBest();

// ===================== známkování =====================
function gradeFor(t){
  if (t < 15)  return { big:'5',  c:'Pětka. Sedni si. A ať mi sem zítra přijdou rodiče.' };
  if (t < 30)  return { big:'4',  c:'Čtyřka. Snaha byla. Svačina už bohužel není.' };
  if (t < 60)  return { big:'3',  c:'Trojka. Průměr. Přesně jako celá tahle třída.' };
  if (t < 120) return { big:'2',  c:'Dvojka. Skoro pěkné. Skoro.' };
  if (t < 210) return { big:'1',  c:'Jednička. No vida, ono to jde, když se chce.' };
  if (t < 330) return { big:'1*', c:'Jednička s hvězdičkou! Tohle si vystavím na nástěnku.' };
  return { big:'POCHVALA ŘEDITELE ŠKOLY', c:'Sborovna oněměla. O tomhle útěku se bude vyprávět.' };
}

// ===================== zvuk =====================
let AC = null;
function ensureAudio(){
  try {
    if (!AC){
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (Ctor) AC = new Ctor();
    }
    if (AC && AC.state === 'suspended') AC.resume();
  } catch(e){ AC = null; }
}
function tone(f, f2, type, d, v, when, a){
  if (!AC) return;
  try {
    const t0 = AC.currentTime + (when || 0);
    const o = AC.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(Math.max(1, f), t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t0 + d);
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(v, t0 + (a || 0.012));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0 + d + 0.06);
  } catch(e){}
}
function noiseS(d, fType, f, f2, v, q, when){
  if (!AC) return;
  try {
    const t0 = AC.currentTime + (when || 0);
    const n = Math.max(1, Math.floor(AC.sampleRate * d));
    const buf = AC.createBuffer(1, n, AC.sampleRate);
    const ch = buf.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = Math.random() * 2 - 1;
    const src = AC.createBufferSource(); src.buffer = buf;
    const fl = AC.createBiquadFilter(); fl.type = fType;
    fl.frequency.setValueAtTime(f, t0);
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t0 + d);
    fl.Q.value = q || 1;
    const g = AC.createGain();
    g.gain.setValueAtTime(v, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    src.connect(fl); fl.connect(g); g.connect(AC.destination);
    src.start(t0); src.stop(t0 + d + 0.05);
  } catch(e){}
}
const sfx = {
  pencil(){ noiseS(0.16,'bandpass',2400,1300,0.3,2.5); noiseS(0.09,'bandpass',3000,1800,0.18,3,0.07); },
  warn(){ tone(110,80,'square',0.1,0.11); tone(110,80,'square',0.1,0.11,0.14); noiseS(0.28,'bandpass',300,200,0.06,1,0); },
  crunch(){ noiseS(0.28,'lowpass',900,140,0.5,1); tone(150,55,'triangle',0.25,0.28); },
  gulp(){ tone(300,110,'sine',0.16,0.2); },
  guma(){ noiseS(0.2,'bandpass',900,2600,0.22,2); tone(500,900,'triangle',0.18,0.12,0.02); },
  bell(){ tone(1318,0,'sine',0.9,0.16); tone(1975,0,'sine',0.5,0.07); tone(659,0,'sine',0.4,0.06); },
  bryle(){ tone(520,150,'sawtooth',0.45,0.1); },
  ink(){ tone(190,55,'sine',0.35,0.24); noiseS(0.18,'lowpass',500,200,0.14); },
  start(){ tone(523,0,'triangle',0.1,0.1); tone(659,0,'triangle',0.12,0.1,0.1); },
  q(){ tone(700,900,'sine',0.1,0.05); }
};

// ===================== papír =====================
function buildPaper(){
  paper = document.createElement('canvas');
  paper.width = Math.max(1, Math.round(W * DPR));
  paper.height = Math.max(1, Math.round(H * DPR));
  const p = paper.getContext('2d');
  p.setTransform(DPR, 0, 0, DPR, 0, 0);
  p.fillStyle = PAPER;
  p.fillRect(0, 0, W, H);
  const g = 26;
  p.strokeStyle = 'rgba(122,162,200,0.32)';
  p.lineWidth = 1;
  p.beginPath();
  for (let x = g; x < W; x += g){ p.moveTo(x + 0.5, 0); p.lineTo(x + 0.5, H); }
  for (let y = g; y < H; y += g){ p.moveTo(0, y + 0.5); p.lineTo(W, y + 0.5); }
  p.stroke();
  // okraj stránky (červená linka)
  p.strokeStyle = 'rgba(214,90,84,0.5)';
  p.lineWidth = 1.6;
  p.beginPath(); p.moveTo(MARGX + 0.5, 0); p.lineTo(MARGX + 0.5, H); p.stroke();
  // lehounké ztmavení u hřbetu
  const gr = p.createLinearGradient(0, 0, 40, 0);
  gr.addColorStop(0, 'rgba(120,100,70,0.12)');
  gr.addColorStop(1, 'rgba(120,100,70,0)');
  p.fillStyle = gr;
  p.fillRect(0, 0, 40, H);
}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.max(1, Math.round(W * DPR));
  canvas.height = Math.max(1, Math.round(H * DPR));
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  MARGX = W > 560 ? 70 : 44;
  buildPaper();
  P.x = clamp(P.x, 20, W - 20); P.y = clamp(P.y, 20, H - 20);
  for (const b of blots){ b.x = clamp(b.x, 90, W - 90); b.y = clamp(b.y, 90, H - 90); }
  for (const f of fakes){ f.x = clamp(f.x, 24, W - 24); f.y = clamp(f.y, 24, H - 24); }
  for (const q of qmarks){ q.x = clamp(q.x, 40, W - 40); q.y = clamp(q.y, 40, H - 40); }
}
window.addEventListener('resize', resize);

// ===================== kaňky =====================
function isSmall(){ return Math.min(W, H) < 620; }

function makeBlot(x, y, r){
  const shape = [];
  for (let i = 0; i < 12; i++) shape.push(rand(0.72, 1.18));
  const drops = [];
  const nd = 2 + Math.floor(Math.random() * 3);
  for (let i = 0; i < nd; i++){
    const a = rand(0, TAU);
    const dd = r * rand(1.15, 1.65);
    drops.push({ x: Math.cos(a) * dd, y: Math.sin(a) * dd, r: rand(3, 7) });
  }
  return { x, y, r, shape, drops, id: nextId++ };
}

function layoutBlots(){
  blots = [];
  const n = isSmall() ? 2 : (Math.random() < 0.5 ? 4 : 5);
  let spacing = 250;
  const m = Math.max(100, Math.min(140, Math.min(W, H) * 0.18));
  let tries = 0;
  while (blots.length < n && tries < 2400){
    tries++;
    if (tries % 400 === 0) spacing = Math.max(140, spacing - 40);
    const r = rand(44, 74) * (isSmall() ? 0.75 : 1);
    const x = rand(m, W - m), y = rand(m, H - m);
    if (hyp(x - W / 2, y - H / 2) < 170 + r) continue;
    let ok = true;
    for (const b of blots) if (hyp(x - b.x, y - b.y) < spacing){ ok = false; break; }
    if (ok) blots.push(makeBlot(x, y, r));
  }
}

function addBlot(){
  const m = 110;
  for (let i = 0; i < 300; i++){
    const r = rand(40, 64) * (isSmall() ? 0.75 : 1);
    const x = rand(m, W - m), y = rand(m, H - m);
    if (hyp(x - P.x, y - P.y) < 150 + r) continue;
    let ok = true;
    for (const b of blots) if (hyp(x - b.x, y - b.y) < 180) { ok = false; break; }
    if (ok){ blots.push(makeBlot(x, y, r)); return; }
  }
  blots.push(makeBlot(rand(m, W - m), rand(m, H - m), 46));
}

// ===================== falešná jablka a otazníky =====================
function spawnAutoFake(){
  const m = 60;
  const minSnake = Math.min(300, Math.max(W, H) * 0.4);
  for (let i = 0; i < 300; i++){
    const x = rand(m, W - m), y = rand(m, H - m);
    if (snake && hyp(x - snake.x, y - snake.y) < minSnake) continue;
    if (hyp(x - P.x, y - P.y) < 110) continue;
    fakes.push({ x, y, auto: true, id: nextId++ });
    return;
  }
  fakes.push({ x: rand(m, W - m), y: rand(m, H - m), auto: true, id: nextId++ });
}

function tryDrawFake(x, y){
  if (S.time < S.pencilReadyAt){ S.pencilShakeAt = S.now; return; }
  x = clamp(x, 30, W - 30); y = clamp(y, 30, H - 30);
  fakes.push({ x, y, auto: false, id: nextId++ });
  S.pencilReadyAt = S.time + PENCIL_CD;
  sfx.pencil();
}

function spawnQ(){
  const m = 80;
  for (let i = 0; i < 200; i++){
    const x = rand(m, W - m), y = rand(m, H - m);
    if (hyp(x - P.x, y - P.y) < 150) continue;
    if (snake && hyp(x - snake.x, y - snake.y) < 200) continue;
    qmarks.push({ x, y, life: 6.5, id: nextId++ });
    sfx.q();
    return;
  }
}

function applyQ(q){
  const r = Math.random();
  if (r < 0.35){
    snake.len = Math.max(5, snake.len - 5);
    const tail = snake.segs[snake.segs.length - 1];
    if (tail) pops.push({ text: 'šmik', x: tail.x, y: tail.y - 14, age: 0, color: PENCIL, size: 15 });
    pops.push({ text: 'GUMA! Had je kratší.', x: q.x, y: q.y - 18, age: 0, color: RED, size: 19 });
    sfx.guma();
  } else if (r < 0.70){
    snake.frozenUntil = S.time + 2;
    pops.push({ text: 'ZVONEK! Přestávka.', x: q.x, y: q.y - 18, age: 0, color: RED, size: 19 });
    sfx.bell();
  } else if (r < 0.85){
    P.slowUntil = S.time + 3.5;
    pops.push({ text: 'KAŇKA NA BRÝLE!', x: q.x, y: q.y - 18, age: 0, color: INK, size: 19 });
    sfx.bryle();
  } else {
    addBlot();
    pops.push({ text: 'NOVÁ KAŇKA!', x: q.x, y: q.y - 18, age: 0, color: INK, size: 19 });
    sfx.ink();
  }
}

// ===================== had =====================
function makeSnake(){
  const corners = [[-50,-50],[W+50,-50],[-50,H+50],[W+50,H+50]];
  const c = corners[Math.floor(Math.random() * 4)];
  const ang = Math.atan2(H / 2 - c[1], W / 2 - c[0]);
  const sn = {
    x: c[0], y: c[1], ang,
    len: 8, spacing: 15, headR: 13, segR: 9.5,
    pts: [], totalLen: 0, segs: [],
    frozenUntil: -9,
    lungeT: rand(8, 12), lState: 'idle', lPhase: 0, sprintAng: 0,
    bestDist: 1e9, stuck: 0, brakeUntil: -9, tKey: -2,
    targetDist: 1e9
  };
  const needPts = Math.ceil((sn.len * sn.spacing + 60) / 4);
  for (let i = needPts; i >= 0; i--){
    const px = sn.x - Math.cos(ang) * i * 4;
    const py = sn.y - Math.sin(ang) * i * 4;
    const step = sn.pts.length ? 4 : 0;
    sn.pts.push({ x: px, y: py, step });
    sn.totalLen += step;
  }
  computeSegs(sn);
  return sn;
}

function computeSegs(sn){
  const segs = [];
  let acc = 0, target = sn.spacing;
  for (let i = sn.pts.length - 1; i > 0 && segs.length < sn.len; i--){
    acc += sn.pts[i].step;
    while (acc >= target && segs.length < sn.len){
      const over = acc - target;
      const p = sn.pts[i], pp = sn.pts[i - 1];
      const st = p.step || 1;
      const f = clamp(1 - over / st, 0, 1);
      segs.push({ x: p.x + (pp.x - p.x) * f, y: p.y + (pp.y - p.y) * f });
      target += sn.spacing;
    }
  }
  sn.segs = segs;
}

function updateSnake(dt){
  const sn = snake;
  const t = S.time;
  if (t < sn.frozenUntil){ computeSegs(sn); return; }

  const base = 105 + 0.68 * t + (t > 120 ? (t - 120) * 0.5 : 0);

  // výběr cíle: hráč, nebo bližší falešné jablko
  let tx = P.x, ty = P.y, tKey = -1;
  let bd = hyp(P.x - sn.x, P.y - sn.y);
  for (const f of fakes){
    const d = hyp(f.x - sn.x, f.y - sn.y);
    if (d < bd){ bd = d; tx = f.x; ty = f.y; tKey = f.id; }
  }
  if (tKey !== sn.tKey){ sn.tKey = tKey; sn.bestDist = bd; sn.stuck = 0; }
  sn.targetDist = bd;

  // výpady
  if (sn.lState === 'idle'){
    if (t > 3) sn.lungeT -= dt;
    if (sn.lungeT <= 0){ sn.lState = 'tele'; sn.lPhase = 0.55; sfx.warn(); }
  } else if (sn.lState === 'tele'){
    sn.lPhase -= dt;
    if (sn.lPhase <= 0){
      sn.lState = 'sprint'; sn.lPhase = 1.0;
      sn.sprintAng = Math.atan2(ty - sn.y, tx - sn.x);
    }
  } else if (sn.lState === 'sprint'){
    sn.lPhase -= dt;
    if (sn.lPhase <= 0){ sn.lState = 'idle'; sn.lungeT = rand(8, 14); }
  }

  let speed = base;
  if (sn.lState === 'tele') speed *= 0.8;

  if (sn.lState === 'sprint'){
    speed = base * 1.6 + 150;
    sn.ang = sn.sprintAng;
  } else {
    // hlídání zacyklení (obíhání kolem cíle)
    if (bd < 260){
      if (bd < sn.bestDist - 4){ sn.bestDist = bd; sn.stuck = 0; }
      else sn.stuck += dt;
      if (sn.stuck > 2.2){ sn.brakeUntil = t + 0.45; sn.stuck = 0; sn.bestDist = bd; }
    } else { sn.bestDist = bd; sn.stuck = 0; }
    if (t < sn.brakeUntil) speed *= 0.5; // poslední záchrana, krátce

    // zatáčení: konstantní poloměr — blízko cíle menší, rychlost drží
    const R = (t < sn.brakeUntil) ? 12 : (16 + 64 * clamp((bd - 30) / 220, 0, 1));
    const om = speed / R;
    const des = Math.atan2(ty - sn.y, tx - sn.x);
    let diff = des - sn.ang;
    while (diff > Math.PI) diff -= TAU;
    while (diff < -Math.PI) diff += TAU;
    const mx = om * dt;
    sn.ang += clamp(diff, -mx, mx);
  }

  // návrat, kdyby vyletěl daleko ze stránky
  if ((sn.x < -140 || sn.x > W + 140 || sn.y < -140 || sn.y > H + 140) && sn.lState !== 'sprint'){
    const des = Math.atan2(H / 2 - sn.y, W / 2 - sn.x);
    let diff = des - sn.ang;
    while (diff > Math.PI) diff -= TAU;
    while (diff < -Math.PI) diff += TAU;
    sn.ang += clamp(diff, -3 * dt, 3 * dt);
  }

  const nx = sn.x + Math.cos(sn.ang) * speed * dt;
  const ny = sn.y + Math.sin(sn.ang) * speed * dt;
  const step = hyp(nx - sn.x, ny - sn.y);
  sn.x = nx; sn.y = ny;
  if (step > 0.4){ sn.pts.push({ x: nx, y: ny, step }); sn.totalLen += step; }
  const need = sn.len * sn.spacing + 60;
  while (sn.pts.length > 2 && sn.totalLen - sn.pts[1].step > need){
    sn.pts.shift();
    sn.totalLen -= sn.pts[0].step;
    sn.pts[0].step = 0;
  }

  // žraní falešných jablek — jediný způsob růstu
  for (let i = fakes.length - 1; i >= 0; i--){
    const f = fakes[i];
    if (hyp(f.x - sn.x, f.y - sn.y) < sn.headR + 12){
      fakes.splice(i, 1);
      sn.len += 4;
      pops.push({ text: 'CHRAMST!', x: f.x, y: f.y - 18, age: 0, color: BLUE, size: 16 });
      sfx.gulp();
    }
  }

  computeSegs(sn);
}

// ===================== hráč =====================
function updatePlayer(dt){
  let ms = 330;
  if (S.time < P.slowUntil) ms *= 0.55;
  P.inBlot = false;
  for (const b of blots){
    if (hyp(P.x - b.x, P.y - b.y) < b.r * 0.95){ P.inBlot = true; break; }
  }
  if (P.inBlot) ms *= 0.42;

  let dvx = 0, dvy = 0;
  let kx = 0, ky = 0;
  for (const k in KEYMAP){
    if (input.keys[k]){ kx += KEYMAP[k][0]; ky += KEYMAP[k][1]; }
  }
  if ((kx || ky) && input.last === 'key'){
    const l = hyp(kx, ky);
    dvx = kx / l * ms; dvy = ky / l * ms;
  } else if (input.has && input.last === 'pointer'){
    const dx = input.mx - P.x, dy = input.my - P.y;
    const d = hyp(dx, dy);
    if (d > 2){
      const sp = ms * clamp(d / 70, 0, 1);
      dvx = dx / d * sp; dvy = dy / d * sp;
    }
  }

  const resp = 2.6;
  let ax = (dvx - P.vx) * resp, ay = (dvy - P.vy) * resp;
  const am = hyp(ax, ay), amax = 850;
  if (am > amax){ ax *= amax / am; ay *= amax / am; }
  P.vx += ax * dt; P.vy += ay * dt;
  if (!dvx && !dvy){ P.vx *= Math.pow(0.35, dt); P.vy *= Math.pow(0.35, dt); }
  if (P.inBlot){ P.vx *= Math.pow(0.15, dt); P.vy *= Math.pow(0.15, dt); }

  P.x += P.vx * dt; P.y += P.vy * dt;
  const r = P.r + 2;
  if (P.x < r){ P.x = r; P.vx = Math.abs(P.vx) * 0.25; }
  if (P.x > W - r){ P.x = W - r; P.vx = -Math.abs(P.vx) * 0.25; }
  if (P.y < r){ P.y = r; P.vy = Math.abs(P.vy) * 0.25; }
  if (P.y > H - r){ P.y = H - r; P.vy = -Math.abs(P.vy) * 0.25; }

  P.roll += ((P.vx + P.vy * 0.35) / P.r) * dt;
}

// ===================== zbytek světa =====================
function updateStuff(dt){
  // automatická falešná jablka — na papíře je vždy aspoň jedno
  let autoCount = 0;
  for (const f of fakes) if (f.auto) autoCount++;
  const targetAuto = S.time > 100 ? 2 : 1;
  if (autoCount < targetAuto){
    if (autoPending < 0){
      const scale = S.time > 120 ? Math.max(0.45, 1 - (S.time - 120) / 300) : 1;
      autoPending = S.time + rand(2, 3) * scale;
    } else if (S.time >= autoPending){
      autoPending = -1;
      spawnAutoFake();
      sfx.pencil();
    }
  } else autoPending = -1;

  // otazníky
  qTimer -= dt;
  if (qTimer <= 0){
    if (qmarks.length < 2) spawnQ();
    qTimer = rand(8, 13);
  }
  for (let i = qmarks.length - 1; i >= 0; i--){
    const q = qmarks[i];
    q.life -= dt;
    if (q.life <= 0){ qmarks.splice(i, 1); continue; }
    if (hyp(q.x - P.x, q.y - P.y) < P.r + 18){
      qmarks.splice(i, 1);
      applyQ(q);
    }
  }

  // texty
  for (let i = pops.length - 1; i >= 0; i--){
    pops[i].age += dt;
    if (pops[i].age > 1.6) pops.splice(i, 1);
  }

  // kolize: smrtící je celé tělo, s tolerancí ve prospěch hráče
  if (S.time > S.graceUntil){
    const tol = 0.72;
    if (hyp(P.x - snake.x, P.y - snake.y) < (P.r + snake.headR) * tol){ die(); return; }
    for (const s of snake.segs){
      if (hyp(P.x - s.x, P.y - s.y) < (P.r + snake.segR) * tol){ die(); return; }
    }
  }
}

function die(){
  S.mode = 'over';
  S.overAt = S.now;
  S.grade = gradeFor(S.time);
  S.newBest = S.time > S.best;
  if (S.newBest){ S.best = S.time; saveBest(S.time); }
  sfx.crunch();
}

function startGame(){
  S.time = 0;
  S.graceUntil = GRACE;
  S.pencilReadyAt = 0;
  S.grade = null;
  S.newBest = false;
  P.x = W / 2; P.y = H / 2; P.vx = 0; P.vy = 0; P.roll = 0; P.slowUntil = -9;
  input.mx = W / 2; input.my = H / 2; input.has = true;
  fakes = []; qmarks = []; pops = [];
  autoPending = -1;
  qTimer = rand(5, 9);
  layoutBlots();
  snake = makeSnake();
  spawnAutoFake();
  touchStart = null;
  S.mode = 'play';
  sfx.start();
}

function resumeGame(){
  S.mode = 'play';
  S.graceUntil = Math.max(S.graceUntil, S.time + 0.8);
}

// ===================== vstup =====================
function uiPress(){
  if (S.mode === 'menu') startGame();
  else if (S.mode === 'pause') resumeGame();
  else if (S.mode === 'over' && S.now - S.overAt > 0.6) startGame();
}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  ensureAudio();
  S.pointerKind = e.pointerType === 'mouse' ? 'mouse' : 'touch';
  if (S.mode !== 'play'){ uiPress(); return; }
  if (e.pointerType === 'mouse'){
    input.mx = e.clientX; input.my = e.clientY; input.has = true; input.last = 'pointer';
    tryDrawFake(e.clientX, e.clientY);
  } else {
    touchStart = { x: e.clientX, y: e.clientY, t: S.now, id: e.pointerId };
  }
}, { passive: false });

canvas.addEventListener('pointermove', e => {
  input.mx = e.clientX; input.my = e.clientY;
  input.has = true; input.last = 'pointer';
  S.pointerKind = e.pointerType === 'mouse' ? 'mouse' : 'touch';
}, { passive: true });

canvas.addEventListener('pointerup', e => {
  if (touchStart && e.pointerId === touchStart.id){
    if (S.mode === 'play' && S.now - touchStart.t < 0.3 &&
        hyp(e.clientX - touchStart.x, e.clientY - touchStart.y) < 14){
      tryDrawFake(touchStart.x, touchStart.y);
    }
    touchStart = null;
  }
});
canvas.addEventListener('pointercancel', () => { touchStart = null; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  ensureAudio();
  const isDir = !!KEYMAP[e.code];
  if (isDir){ input.keys[e.code] = 1; input.last = 'key'; e.preventDefault(); }
  if (e.code === 'Space' || e.code === 'Enter') e.preventDefault();
  if (S.mode !== 'play'){
    if (!e.repeat && (isDir || e.code === 'Space' || e.code === 'Enter')) uiPress();
    return;
  }
  if (e.code === 'Escape' || e.code === 'KeyP'){ S.mode = 'pause'; }
});

document.addEventListener('visibilitychange', () => {

});

// ===================== kreslicí pomocníci =====================
function scribbleLine(x1, y1, x2, y2, color, lw, seed, amp){
  amp = amp === undefined ? 2 : amp;
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  const n = 6;
  for (let i = 0; i <= n; i++){
    const t = i / n;
    const x = x1 + (x2 - x1) * t + jj(seed + i * 7.7) * amp;
    const y = y1 + (y2 - y1) * t + jj(seed + i * 3.1 + 9) * amp;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();
}

function scribbleCircle(x, y, r, color, lw, seed){
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  const N = 12;
  const a0 = jj(seed) * 0.7;
  for (let i = 0; i <= N; i++){
    const a = a0 + i / N * TAU * 1.04;
    const rr = r * (1 + jj(seed + i * 11.3) * 0.09);
    const px = x + Math.cos(a) * rr;
    const py = y + Math.sin(a) * rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.stroke();
}

function scribbleEllipse(x, y, rx, ry, color, lw, seed){
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  const N = 30;
  for (let i = 0; i <= N; i++){
    const a = i / N * TAU * 2.15 + jj(seed) * 0.5;
    const wob = 1 + jj(seed + i * 5.3) * 0.06;
    const px = x + Math.cos(a) * rx * wob + jj(seed + i * 2.9) * 3;
    const py = y + Math.sin(a) * ry * wob + jj(seed + i * 4.7) * 3;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.stroke();
}

function note(text, x, y, size, color, rot, align, alpha, bold){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot || 0);
  if (alpha !== undefined) ctx.globalAlpha *= alpha;
  ctx.fillStyle = color;
  ctx.font = (bold ? 'bold ' : '') + Math.round(size) + 'px ' + HAND;
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 0, 0);
  ctx.restore();
}

function wrapLines(text, size, maxW, bold){
  ctx.font = (bold ? 'bold ' : '') + Math.round(size) + 'px ' + HAND;
  const words = text.split(' ');
  const lines = [];
  let cur = '';
  for (const w of words){
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && cur){ lines.push(cur); cur = w; }
    else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}

// ===================== kreslení světa =====================
function drawBlot(b){
  ctx.save();
  ctx.fillStyle = INK;
  ctx.globalAlpha = 0.92;
  ctx.beginPath();
  const n = b.shape.length;
  for (let i = 0; i <= n; i++){
    const k = i % n;
    const a = k / n * TAU;
    const rr = b.r * b.shape[k] * (1 + jj(b.id * 3 + k) * 0.04);
    const px = b.x + Math.cos(a) * rr;
    const py = b.y + Math.sin(a) * rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
  for (const d of b.drops){
    ctx.beginPath();
    ctx.arc(b.x + d.x, b.y + d.y, d.r * (1 + jj(b.id + d.x) * 0.1), 0, TAU);
    ctx.fill();
  }
  // odlesk
  ctx.globalAlpha = 0.18;
  ctx.strokeStyle = '#8f97d8';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.35, Math.PI * 0.8, Math.PI * 1.6);
  ctx.stroke();
  ctx.restore();
}

function drawFake(f){
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.rotate(jj(f.id) * 0.06);
  ctx.globalAlpha = 0.9;
  scribbleCircle(0, 0, 11, PENCIL, 1.8, f.id * 7);
  ctx.globalAlpha = 0.55;
  scribbleCircle(0.8, 0.6, 10.2, PENCIL, 1.2, f.id * 7 + 3);
  scribbleLine(-5, -2, 3, 6, PENCIL, 1.2, f.id * 7 + 5, 1);
  scribbleLine(-2, -5, 5, 2, PENCIL, 1.2, f.id * 7 + 6, 1);
  ctx.globalAlpha = 0.9;
  scribbleLine(0, -10, 3, -17, PENCIL, 1.8, f.id * 7 + 7, 1);
  ctx.restore();
}

function drawQ(q){
  ctx.save();
  let a = 1;
  if (q.life < 1.5) a = 0.35 + 0.65 * Math.abs(Math.sin(q.life * 8));
  note('?', q.x + jj(q.id) * 2, q.y + jj(q.id + 5) * 2, 46, BLUE, jj(q.id + 9) * 0.12, 'center', a, true);
  ctx.restore();
}

function drawSnake(){
  const sn = snake;
  if (!sn) return;
  ctx.save();
  if (S.time < S.graceUntil) ctx.globalAlpha = 0.55;

  // tělo — čára skrz články
  let hx = sn.x, hy = sn.y;
  if (sn.lState === 'tele'){
    const wig = Math.sin(S.now * 45) * 3;
    hx += -Math.sin(sn.ang) * wig;
    hy += Math.cos(sn.ang) * wig;
  }
  const chain = [{ x: hx, y: hy }].concat(sn.segs);
  ctx.strokeStyle = BLUE; ctx.lineWidth = 3;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  for (let i = 0; i < chain.length; i++){
    const p = chain[i];
    const x = p.x + jj(100 + i * 7.13) * 1.4;
    const y = p.y + jj(140 + i * 3.77) * 1.4;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();

  // články
  for (let i = 0; i < sn.segs.length; i++){
    const s = sn.segs[i];
    const r = Math.max(5.5, sn.segR * (1 - i / Math.max(1, sn.segs.length) * 0.3));
    scribbleCircle(s.x, s.y, r, BLUE, 1.8, 200 + i * 13);
  }

  // hlava
  scribbleCircle(hx, hy, sn.headR, BLUE, 2.6, 90);
  scribbleCircle(hx, hy, sn.headR - 3.5, BLUE, 1.2, 91);
  const ex = Math.cos(sn.ang), ey = Math.sin(sn.ang);
  const px = -ey, py = ex;
  ctx.fillStyle = BLUE;
  ctx.beginPath(); ctx.arc(hx + ex * 5 + px * 5, hy + ey * 5 + py * 5, 2.1, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(hx + ex * 5 - px * 5, hy + ey * 5 - py * 5, 2.1, 0, TAU); ctx.fill();

  // jazyk, když je kořist blízko nebo sprintuje
  if (sn.targetDist < 150 || sn.lState === 'sprint'){
    ctx.strokeStyle = RED; ctx.lineWidth = 1.6;
    ctx.beginPath();
    let lx = hx + ex * sn.headR, ly = hy + ey * sn.headR;
    ctx.moveTo(lx, ly);
    for (let i = 1; i <= 3; i++){
      lx += ex * 4 + px * (i % 2 ? 3 : -3);
      ly += ey * 4 + py * (i % 2 ? 3 : -3);
      ctx.lineTo(lx, ly);
    }
    ctx.stroke();
  }

  if (sn.lState === 'tele'){
    note('!', hx + px * 0 - ey * 0, hy - 26, 26, RED, jj(7) * 0.2, 'center', 0.9, true);
  }
  if (S.time < sn.frozenUntil){
    note('zzz', hx + 18, hy - 20, 18, PENCIL, -0.2, 'center', 0.9);
  }
  ctx.restore();
}

function drawPlayer(){
  ctx.save();
  ctx.translate(P.x, P.y);
  ctx.save();
  ctx.rotate(P.roll);
  scribbleCircle(0, 0, P.r, RED, 2.4, 31);
  ctx.globalAlpha = 0.45;
  scribbleLine(-6, -2, 2, 7, RED, 1.4, 32, 1);
  scribbleLine(-3, -6, 5, 4, RED, 1.4, 33, 1);
  ctx.globalAlpha = 1;
  scribbleLine(0, -P.r + 2, 3, -P.r - 6, RED, 2, 34, 1);
  scribbleCircle(7, -P.r - 3, 4, RED, 1.5, 35);
  ctx.restore();

  if (S.time < S.graceUntil && S.mode === 'play'){
    ctx.globalAlpha = 0.5 + 0.3 * Math.sin(S.now * 8);
    ctx.setLineDash([6, 6]);
    ctx.strokeStyle = RED; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 24, S.now * 2, S.now * 2 + TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }
  if (S.time < P.slowUntil){
    ctx.globalAlpha = 0.85;
    scribbleCircle(-6, -3, 5, PENCIL, 1.6, 36);
    scribbleCircle(6, -3, 5, PENCIL, 1.6, 37);
    scribbleLine(-1.5, -3, 1.5, -3, PENCIL, 1.4, 38, 0.7);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawPop(p){
  const a = clamp(1 - p.age / 1.6, 0, 1);
  note(p.text, p.x, p.y - p.age * 28, p.size, p.color, jj(p.x) * 0.05, 'center', a, true);
}

// ===================== dekorace okrajů =====================
function drawHeart(x, y, s){
  ctx.strokeStyle = RED; ctx.lineWidth = 1.6;
  ctx.beginPath();
  const N = 16;
  for (let i = 0; i <= N; i++){
    const t = i / N * TAU;
    const hx = 16 * Math.pow(Math.sin(t), 3);
    const hyv = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    const px = x + hx * s / 16 + jj(500 + i) * 0.8;
    const py = y - hyv * s / 16 + jj(520 + i) * 0.8;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.stroke();
}

function drawTTT(x, y){
  const c = 18;
  scribbleLine(x + c, y, x + c, y + 3 * c, PENCIL, 1.4, 601, 1.2);
  scribbleLine(x + 2 * c, y, x + 2 * c, y + 3 * c, PENCIL, 1.4, 602, 1.2);
  scribbleLine(x, y + c, x + 3 * c, y + c, PENCIL, 1.4, 603, 1.2);
  scribbleLine(x, y + 2 * c, x + 3 * c, y + 2 * c, PENCIL, 1.4, 604, 1.2);
  const X = (cx, cy, sd) => {
    scribbleLine(cx - 5, cy - 5, cx + 5, cy + 5, BLUE, 1.4, sd, 1);
    scribbleLine(cx + 5, cy - 5, cx - 5, cy + 5, BLUE, 1.4, sd + 1, 1);
  };
  const O = (cx, cy, sd) => scribbleCircle(cx, cy, 6, RED, 1.4, sd);
  X(x + c * 0.5, y + c * 0.5, 610);
  X(x + c * 1.5, y + c * 1.5, 612);
  O(x + c * 2.5, y + c * 0.5, 614);
  O(x + c * 0.5, y + c * 1.5, 616);
  X(x + c * 2.5, y + c * 2.5, 618);
}

function drawWords(x, y){
  for (let w = 0; w < 3; w++){
    const wy = y + w * 14;
    const len = 40 + jj(700 + w * 31) * 8 + w * 8;
    ctx.strokeStyle = BLUE; ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let i = 0; i <= 12; i++){
      const t = i / 12;
      const px = x + t * len;
      const py = wy + Math.sin(t * 22 + w * 3) * 3 + jj(710 + w * 17 + i) * 1;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.stroke();
    if (w < 2) scribbleLine(x - 2, wy, x + len + 2, wy, RED, 1.3, 720 + w * 9, 1.4);
  }
}

function drawMiniBlot(x, y){
  ctx.fillStyle = INK;
  ctx.beginPath();
  for (let i = 0; i <= 8; i++){
    const a = i / 8 * TAU;
    const rr = 7 * (1 + jj(800 + i) * 0.25);
    const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 11, y + 6, 2.4, 0, TAU); ctx.fill();
}

function drawDoodles(){
  ctx.save();
  ctx.globalAlpha = 0.42;
  drawHeart(W - 54, 56, 9);
  if (H > 500) drawTTT(MARGX + 12, H - 122);
  if (W > 420) drawWords(MARGX + 10, 24);
  drawMiniBlot(W - 116, H - 132);
  ctx.restore();
}

// ===================== HUD a obrazovky =====================
function drawPencilIcon(){
  const cx = W - 52, cy = H - 52;
  const remain = Math.max(0, S.pencilReadyAt - S.time);
  const ready = remain <= 0;
  const frac = ready ? 1 : 1 - remain / PENCIL_CD;
  ctx.save();
  let sx = 0;
  if (S.now - S.pencilShakeAt < 0.3) sx = Math.sin(S.now * 60) * 3;
  ctx.translate(cx + sx, cy);
  // podklad
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = PAPER;
  ctx.beginPath(); ctx.arc(0, 0, 30, 0, TAU); ctx.fill();
  ctx.globalAlpha = 0.25;
  ctx.strokeStyle = PENCIL; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(0, 0, 26, 0, TAU); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = ready ? RED : PENCIL;
  ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, 0, 26, -Math.PI / 2, -Math.PI / 2 + TAU * frac); ctx.stroke();
  if (ready){
    ctx.globalAlpha = 0.35 + 0.25 * Math.sin(S.now * 6);
    ctx.beginPath(); ctx.arc(0, 0, 30, 0, TAU); ctx.strokeStyle = RED; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // tužka
  ctx.save();
  ctx.rotate(-Math.PI / 4 + jj(90) * 0.05);
  ctx.strokeStyle = '#5c5c63'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-11, 0); ctx.lineTo(5, 0); ctx.stroke();
  ctx.fillStyle = '#d8c9a5';
  ctx.beginPath(); ctx.moveTo(5, -3); ctx.lineTo(12, 0); ctx.lineTo(5, 3); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#3a3a40';
  ctx.beginPath(); ctx.arc(12, 0, 1.4, 0, TAU); ctx.fill();
  ctx.restore();
  if (!ready) note(Math.ceil(remain) + '', 0, 40, 15, PENCIL, 0);
  else note('tužka', 0, 42, 13, PENCIL, -0.04);
  ctx.restore();
}

function drawHUD(){
  note('Čas: ' + Math.floor(S.time) + ' s', W / 2, 28, 24, RED, -0.03 + jj(1) * 0.008, 'center', 1, true);
  if (S.best > 0) note('rekord: ' + Math.floor(S.best) + ' s', W - 16, 24, 14, PENCIL, 0.02, 'right', 0.9);
  drawPencilIcon();
  if (S.time < 7 && S.mode === 'play'){
    const a = S.time > 5.5 ? (7 - S.time) / 1.5 : 1;
    const msg = S.pointerKind === 'touch'
      ? 'Táhni prstem = koulíš se. Ťukni = falešné jablko.'
      : 'Myší se koulíš. Kliknutím nakreslíš falešné jablko.';
    note(msg, W / 2, H - 22, Math.min(16, W / 26), PENCIL, 0, 'center', a * 0.9);
  }
}

function drawTahak(cx, cy, pw){
  const size = Math.max(12, Math.min(15, pw / 30));
  const maxW = pw - 36;
  const bullets = [
    'klik / ťuk = nakreslíš tužkou falešné jablko. Had se chytí a vyroste.',
    '? = guma (smaže hadovi články), zvonek (had stojí), kaňka na brýle (zpomalí tě), nová kaňka.',
    'inkoustové kaňky brzdí jen tebe. Had po nich klouže.',
    'kouše celé tělo hada, ne jen hlava. Nesahat ani na ocas!',
    'známky: 15 s → 5 | 30 s → 4 | 60 s → 3 | 120 s → 2 | 210 s → 1 | 330 s → pochvala ředitele'
  ];
  const lineH = size * 1.3;
  let totalLines = 0;
  const wrapped = bullets.map(b => {
    const ls = wrapLines(b, size, maxW);
    totalLines += ls.length;
    return ls;
  });
  const ph = 46 + totalLines * lineH + bullets.length * 5;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-0.02 + jj(50) * 0.004);
  // papírek
  ctx.fillStyle = '#fffdf4';
  ctx.strokeStyle = 'rgba(120,120,130,0.6)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.rect(-pw / 2, -ph / 2, pw, ph);
  ctx.fill(); ctx.stroke();
  // ohnutý růžek
  ctx.fillStyle = '#efe9d5';
  ctx.beginPath();
  ctx.moveTo(pw / 2 - 16, ph / 2);
  ctx.lineTo(pw / 2, ph / 2 - 16);
  ctx.lineTo(pw / 2, ph / 2);
  ctx.closePath(); ctx.fill();

  note('TAHÁK (před učitelem schovat!)', 0, -ph / 2 + 18, size + 2, PENCIL, 0, 'center', 1, true);
  let yy = -ph / 2 + 40;
  for (let i = 0; i < wrapped.length; i++){
    ctx.save();
    ctx.font = Math.round(size) + 'px ' + HAND;
    ctx.fillStyle = i === 4 ? RED : '#4a4a52';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    for (let l = 0; l < wrapped[i].length; l++){
      const prefix = l === 0 ? '• ' : '  ';
      ctx.fillText(prefix + wrapped[i][l], -pw / 2 + 16, yy + jj(60 + i * 7 + l) * 0.6);
      yy += lineH;
    }
    ctx.restore();
    yy += 5;
  }
  ctx.restore();
  return ph;
}

function drawMenu(){
  const sc = clamp(W / 800, 0.62, 1.1);
  const titleY = H * 0.14;
  note('SVAČINA', W / 2, titleY, 78 * sc, RED, jj(2) * 0.012 - 0.01, 'center', 1, true);
  scribbleLine(W / 2 - 150 * sc, titleY + 44 * sc, W / 2 + 150 * sc, titleY + 44 * sc, RED, 3, 11, 3);
  note('Jsi svačina. Uteč hadovi.', W / 2, titleY + 78 * sc, 26 * sc, '#3d3d46', jj(3) * 0.008, 'center', 1);

  // dekorace: jablíčko a hadí hlava
  ctx.save();
  ctx.translate(W / 2 - 205 * sc, titleY + 2);
  ctx.rotate(S.now * 0.8);
  scribbleCircle(0, 0, 15 * sc, RED, 2.2, 41);
  scribbleLine(0, -14 * sc, 3, -21 * sc, RED, 1.8, 42, 1);
  ctx.restore();
  ctx.save();
  ctx.translate(W / 2 + 205 * sc, titleY + 4);
  scribbleCircle(0, 0, 14 * sc, BLUE, 2.2, 43);
  ctx.fillStyle = BLUE;
  ctx.beginPath(); ctx.arc(-4 * sc, -4 * sc, 2, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(4 * sc, -4 * sc, 2, 0, TAU); ctx.fill();
  ctx.strokeStyle = RED; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, 12 * sc); ctx.lineTo(-2, 18 * sc); ctx.lineTo(2, 22 * sc); ctx.stroke();
  ctx.restore();

  const pw = Math.min(W - 24, 470);
  const ph = drawTahak(W / 2, H * 0.52, pw);

  const a = 0.65 + 0.35 * Math.sin(S.now * 3);
  const startMsg = S.pointerKind === 'touch' ? 'Ťukni a utíkej!' : 'Klikni nebo zmáčkni mezerník — a utíkej!';
  note(startMsg, W / 2, H * 0.52 + ph / 2 + 34, 21 * sc, RED, 0.008, 'center', a, true);
  if (S.best > 0){
    note('Nejlepší čas: ' + Math.floor(S.best) + ' s', W / 2, H * 0.52 + ph / 2 + 62, 16 * sc, PENCIL, -0.01);
  }
}

function drawPause(){
  ctx.save();
  ctx.fillStyle = 'rgba(250,246,234,0.78)';
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
  const sc = clamp(W / 800, 0.62, 1.1);
  note('PŘESTÁVKA', W / 2, H * 0.4, 52 * sc, RED, jj(4) * 0.01, 'center', 1, true);
  note('Zvonek. Hra počká, než se vrátíš do lavice.', W / 2, H * 0.4 + 48 * sc, 20 * sc, '#3d3d46');
  const a = 0.65 + 0.35 * Math.sin(S.now * 3);
  note('Klikni nebo zmáčkni mezerník — pokračujeme.', W / 2, H * 0.4 + 84 * sc, 18 * sc, RED, 0, 'center', a);
}

function drawOver(){
  ctx.save();
  ctx.fillStyle = 'rgba(250,246,234,0.85)';
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
  const sc = clamp(W / 800, 0.62, 1.1);
  const g = S.grade || gradeFor(S.time);
  note('KŘUP. Konec svačiny.', W / 2, H * 0.16, 34 * sc, '#3d3d46', jj(5) * 0.008, 'center', 1, true);

  // známka v červeném kroužku
  const isPochvala = g.big.length > 3;
  const gy = H * 0.36;
  if (isPochvala){
    const fs = Math.min(34 * sc, W / 14);
    const lines = wrapLines(g.big, fs, W * 0.7, true);
    lines.forEach((ln, i) => note(ln, W / 2, gy + (i - (lines.length - 1) / 2) * fs * 1.2, fs, RED, jj(6) * 0.01, 'center', 1, true));
    scribbleEllipse(W / 2, gy, Math.min(W * 0.42, 300), fs * lines.length * 0.95 + 22, RED, 3, 12);
  } else {
    note(g.big, W / 2, gy, 96 * sc, RED, jj(6) * 0.02, 'center', 1, true);
    scribbleEllipse(W / 2, gy, 76 * sc, 62 * sc, RED, 3.2, 12);
  }

  const cy = gy + (isPochvala ? 90 : 96 * sc);
  const cls = wrapLines(g.c, 20 * sc, Math.min(W - 60, 560));
  cls.forEach((ln, i) => note(ln, W / 2, cy + i * 26 * sc, 20 * sc, '#3d3d46', -0.005));

  let yy = cy + cls.length * 26 * sc + 22 * sc;
  note('Přežil jsi ' + Math.floor(S.time) + ' s.', W / 2, yy, 22 * sc, RED, 0.006, 'center', 1, true);
  yy += 30 * sc;
  if (S.newBest){
    note('NOVÝ REKORD!', W / 2, yy, 20 * sc, RED, -0.01, 'center', 0.8 + 0.2 * Math.sin(S.now * 5), true);
  } else if (S.best > 0){
    note('Rekord: ' + Math.floor(S.best) + ' s', W / 2, yy, 17 * sc, PENCIL, 0.005);
  }
  yy += 40 * sc;
  if (S.now - S.overAt > 0.6){
    const a = 0.65 + 0.35 * Math.sin(S.now * 3);
    const msg = S.pointerKind === 'touch' ? 'Ťukni — oprava známky!' : 'Klikni nebo zmáčkni mezerník — oprava známky!';
    note(msg, W / 2, Math.min(yy, H - 30), 19 * sc, RED, 0, 'center', a);
  }
}

// ===================== render =====================
function render(){
  ctx.drawImage(paper, 0, 0, W, H);
  drawDoodles();
  if (S.mode === 'menu'){ drawMenu(); return; }
  for (const b of blots) drawBlot(b);
  for (const f of fakes) drawFake(f);
  for (const q of qmarks) drawQ(q);
  drawSnake();
  drawPlayer();
  for (const p of pops) drawPop(p);
  drawHUD();
  if (S.mode === 'pause') drawPause();
  if (S.mode === 'over') drawOver();
}

// ===================== smyčka =====================
let lastTs = 0;
function frame(ts){
  requestAnimationFrame(frame);
  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  S.now += dt;
  boil = Math.floor(S.now * 7) % 3;
  if (S.mode === 'play'){
    S.time += dt;
    updatePlayer(dt);
    updateSnake(dt);
    updateStuff(dt);
  }
  render();
}

resize();
requestAnimationFrame(frame);

// ladicí háček (neškodný, pomáhá testům)
window.__svacina = {
  get S(){ return S; }, get P(){ return P; }, get snake(){ return snake; },
  get fakes(){ return fakes; }, get blots(){ return blots; }, get qmarks(){ return qmarks; },
  startGame, input
};

})();
</script>
