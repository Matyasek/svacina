<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SVAČINA — Jsi svačina. Uteč hadovi.</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #f6f2e7;
    overscroll-behavior: none;
  }
  #hra {
    display: block; width: 100%; height: 100%;
    touch-action: none; cursor: crosshair;
    -webkit-user-select: none; user-select: none;
  }
</style>
</head>
<body>
<canvas id="hra"></canvas>
<script>
(function () {
'use strict';

/* =========================================================
   SVAČINA — Snake naruby. Hráč je jablko, had ho honí.
   Vše v jednom souboru, čistá API prohlížeče.
   ========================================================= */

var canvas = document.getElementById('hra');
var ctx = canvas.getContext('2d');

var W = 0, H = 0, DPR = 1;

var FONT = '"Segoe Print","Comic Sans MS","Chalkboard SE","Bradley Hand",cursive';

/* ---------- barvy sešitu ---------- */
var COL = {
  papir: '#f8f5ea',
  mrizka: 'rgba(120,160,200,0.28)',
  okraj: 'rgba(220,90,90,0.5)',
  cervena: '#c92a2a',
  modra: '#274b9f',
  modraSvetla: 'rgba(39,75,159,0.55)',
  tuzka: '#8a8a8a',
  tuzkaSvetla: 'rgba(120,120,120,0.5)',
  inkoust: '#1a2340'
};

/* ---------- stav hry ---------- */
var S = {
  mode: 'menu',            // menu | play | pause | dead
  t: 0,                    // herní čas kola (s)
  best: 0,
  bestOk: false,
  frame: 0,
  boil: 0,                 // fáze boiling lines 0..2
  boilAcc: 0,
  shake: 0,
  pauseFrom: 'play',
  deadInfo: null,
  newBest: false
};

/* nejlepší čas z localStorage — výhradně v try/catch */
try {
  var v = window.localStorage.getItem('svacina_best');
  if (v !== null) { S.best = parseFloat(v) || 0; }
  S.bestOk = true;
} catch (e) { S.bestOk = false; }

function ulozBest() {
  if (!S.bestOk) return;
  try { window.localStorage.setItem('svacina_best', String(S.best)); } catch (e) {}
}

/* ---------- vstup ---------- */
var input = {
  mx: 0, my: 0,          // cíl (CSS px)
  hasPointer: false,
  keys: {},
  touchId: null,
  touchStart: null       // {x,y,t} pro rozlišení ťuknutí
};

/* ---------- hráč: jablko ---------- */
var player = {
  x: 0, y: 0, vx: 0, vy: 0,
  r: 12,
  roll: 0,
  maxSpeed: 265,
  graceUntil: 0
};

/* ---------- had ---------- */
var snake = {
  x: 0, y: 0, ang: 0,
  speed: 150,
  segs: 8,               // počet článků těla (bez hlavy)
  spacing: 15,
  hist: [],              // historie pozic hlavy [{x,y}]
  histLen: 0,            // délka (px) uložené cesty
  frozenUntil: 0,        // zvonek
  stunnedUntil: 0,       // bomba
  lunge: { state: 'idle', t: 0, ang: 0, nextAt: 10 },
  bestDist: 1e9,
  noProgress: 0,
  slowUntil: 0,
  targetKey: ''
};

/* ---------- objekty ---------- */
var fakes = [];          // {x,y,auto,bomb,born}
var qmarks = [];         // {x,y,born,life}
var blots = [];          // {x,y,r,seed}
var floats = [];         // plovoucí nápisy {text,x,y,ttl,max,col,size}
var autoRespawnAt = -1;
var qNextAt = 0;
var pencilCd = 0;        // zbývající cooldown kreslení (s)
var PENCIL_CD = 4;
var bombStock = 0;

/* ---------- dekorace okrajů (generují se jednou na velikost) ---------- */
var decor = [];

/* =========================================================
   Pomůcky
   ========================================================= */
function rnd(a, b) { return a + Math.random() * (b - a); }
function dist(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); }
function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
function lerp(a, b, k) { return a + (b - a) * k; }
function angDiff(a, b) {
  var d = a - b;
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;
  return d;
}

/* deterministický šum pro boiling lines */
function jrand(seed) {
  var x = Math.sin(seed * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}
function jit(i, amp) {
  return (jrand(i * 7.13 + S.boil * 91.7) - 0.5) * 2 * amp;
}

/* hranice stránky (uvnitř okraje sešitu) */
function bounds() {
  return { x0: 14, y0: 14, x1: W - 14, y1: H - 14 };
}

/* =========================================================
   Zvuk — Web Audio, syntetický, až po interakci
   ========================================================= */
var AC = null;
function ensureAudio() {
  if (AC) {
    if (AC.state === 'suspended') { AC.resume().catch(function () {}); }
    return;
  }
  try {
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (Ctor) AC = new Ctor();
  } catch (e) { AC = null; }
}
function beep(freq, dur, type, vol, slideTo, delay) {
  if (!AC) return;
  try {
    var t0 = AC.currentTime + (delay || 0);
    var o = AC.createOscillator();
    var g = AC.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  } catch (e) {}
}
function noiseBurst(dur, filterFreq, vol, delay) {
  if (!AC) return;
  try {
    var t0 = AC.currentTime + (delay || 0);
    var len = Math.max(1, Math.floor(AC.sampleRate * dur));
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = AC.createBufferSource(); src.buffer = buf;
    var f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = filterFreq; f.Q.value = 0.8;
    var g = AC.createGain(); g.gain.value = vol || 0.15;
    src.connect(f); f.connect(g); g.connect(AC.destination);
    src.start(t0);
  } catch (e) {}
}
var SFX = {
  tuzka: function () { noiseBurst(0.16, 2600, 0.2); noiseBurst(0.1, 1800, 0.12, 0.07); },
  vypad: function () { beep(160, 0.1, 'square', 0.09); beep(120, 0.12, 'square', 0.09, null, 0.11); beep(160, 0.1, 'square', 0.09, null, 0.23); },
  guma: function () { noiseBurst(0.25, 900, 0.22); noiseBurst(0.2, 700, 0.15, 0.12); },
  zvonek: function () { beep(1320, 0.4, 'sine', 0.14); beep(1760, 0.5, 'sine', 0.1, null, 0.12); },
  bomba: function () { beep(90, 0.35, 'sawtooth', 0.14, 40); beep(440, 0.08, 'triangle', 0.1, null, 0.02); },
  kanka: function () { beep(300, 0.25, 'sine', 0.13, 90); },
  otaznik: function () { beep(660, 0.09, 'triangle', 0.1, 880); },
  vybuch: function () { noiseBurst(0.35, 300, 0.3); beep(70, 0.4, 'sawtooth', 0.18, 30); },
  snez: function () { noiseBurst(0.12, 1200, 0.14); beep(220, 0.1, 'triangle', 0.08, 140); },
  konec: function () { noiseBurst(0.3, 500, 0.3); beep(180, 0.5, 'sawtooth', 0.16, 50); },
  klik: function () { beep(520, 0.06, 'triangle', 0.08); }
};

/* =========================================================
   Rozměry, resize
   ========================================================= */
function resize() {
  DPR = window.devicePixelRatio || 1;
  W = Math.max(280, window.innerWidth);
  H = Math.max(280, window.innerHeight);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  var b = bounds();
  /* objekty do nových mezí, nic se nesmí rozbít */
  player.x = clamp(player.x, b.x0 + 20, b.x1 - 20);
  player.y = clamp(player.y, b.y0 + 20, b.y1 - 20);
  snake.x = clamp(snake.x, b.x0, b.x1);
  snake.y = clamp(snake.y, b.y0, b.y1);
  var i;
  for (i = 0; i < fakes.length; i++) { fakes[i].x = clamp(fakes[i].x, b.x0 + 20, b.x1 - 20); fakes[i].y = clamp(fakes[i].y, b.y0 + 20, b.y1 - 20); }
  for (i = 0; i < qmarks.length; i++) { qmarks[i].x = clamp(qmarks[i].x, b.x0 + 30, b.x1 - 30); qmarks[i].y = clamp(qmarks[i].y, b.y0 + 30, b.y1 - 30); }
  for (i = 0; i < blots.length; i++) { blots[i].x = clamp(blots[i].x, b.x0 + blots[i].r, b.x1 - blots[i].r); blots[i].y = clamp(blots[i].y, b.y0 + blots[i].r, b.y1 - blots[i].r); }
  makeDecor();
}

function makeDecor() {
  decor = [];
  var b = bounds();
  /* piškvorky vpravo nahoře */
  decor.push({ type: 'tictac', x: b.x1 - 64, y: b.y0 + 26, s: 40 });
  /* srdíčko vlevo dole */
  decor.push({ type: 'heart', x: b.x0 + 34, y: b.y1 - 44, s: 16 });
  /* škrtaná slovíčka vlevo nahoře pod okrajem */
  decor.push({ type: 'slova', x: b.x0 + 8, y: b.y0 + 60 });
  if (H > 520) decor.push({ type: 'slova2', x: b.x0 + 8, y: b.y1 - 130 });
}

/* =========================================================
   Start kola
   ========================================================= */
function novaKanka(extra) {
  var b = bounds();
  var margin = 90;
  var r = rnd(46, 70);
  if (Math.min(W, H) < 520) r = rnd(38, 52);
  for (var pokus = 0; pokus < 60; pokus++) {
    var x = rnd(b.x0 + margin, b.x1 - margin);
    var y = rnd(b.y0 + margin, b.y1 - margin);
    var ok = true;
    for (var i = 0; i < blots.length; i++) {
      if (dist(x, y, blots[i].x, blots[i].y) < blots[i].r + r + 130) { ok = false; break; }
    }
    if (ok && extra && dist(x, y, player.x, player.y) < r + 120) ok = false;
    if (ok || pokus === 59) {
      blots.push({ x: x, y: y, r: r, seed: Math.random() * 1000 });
      return;
    }
  }
}

function spawnAutoFake() {
  var b = bounds();
  for (var pokus = 0; pokus < 80; pokus++) {
    var x = rnd(b.x0 + 60, b.x1 - 60);
    var y = rnd(b.y0 + 60, b.y1 - 60);
    var vKance = false;
    for (var i = 0; i < blots.length; i++) {
      if (dist(x, y, blots[i].x, blots[i].y) < blots[i].r + 20) { vKance = true; break; }
    }
    if ((!vKance && dist(x, y, snake.x, snake.y) > Math.min(300, W * 0.4)) || pokus > 70) {
      fakes.push({ x: x, y: y, auto: true, bomb: false, born: S.t });
      return;
    }
  }
}

function spawnQmark() {
  var b = bounds();
  for (var pokus = 0; pokus < 60; pokus++) {
    var x = rnd(b.x0 + 50, b.x1 - 50);
    var y = rnd(b.y0 + 60, b.y1 - 60);
    if (dist(x, y, snake.x, snake.y) > 140 || pokus > 40) {
      qmarks.push({ x: x, y: y, born: S.t, life: rnd(8, 10) });
      return;
    }
  }
}

function startHra() {
  var b = bounds();
  S.mode = 'play';
  S.t = 0;
  S.newBest = false;
  player.x = W * 0.5; player.y = H * 0.55;
  player.vx = 0; player.vy = 0; player.roll = 0;
  player.graceUntil = 2;
  input.mx = player.x; input.my = player.y;
  input.hasPointer = false;

  snake.x = b.x0 + 50; snake.y = b.y0 + 50;
  snake.ang = Math.atan2(player.y - snake.y, player.x - snake.x);
  snake.speed = 150;
  snake.segs = 8;
  snake.hist = [{ x: snake.x, y: snake.y }];
  snake.frozenUntil = 0; snake.stunnedUntil = 0;
  snake.lunge = { state: 'idle', t: 0, ang: 0, nextAt: rnd(8, 14) };
  snake.bestDist = 1e9; snake.noProgress = 0; snake.slowUntil = 0; snake.targetKey = '';

  fakes = []; qmarks = []; blots = []; floats = [];
  bombStock = 0; pencilCd = 0;
  autoRespawnAt = -1;
  qNextAt = rnd(6, 10);

  var pocetKanek = (Math.min(W, H) < 600 || W * H < 420000) ? 2 : (4 + (Math.random() < 0.5 ? 1 : 0));
  for (var i = 0; i < pocetKanek; i++) novaKanka(false);
  spawnAutoFake();
}

/* =========================================================
   Známkování
   ========================================================= */
function znamka(t) {
  if (t < 15) return { z: '5', kom: 'Sedni si. A přines mi žákovskou. Tohle si přečte i tvoje babička.' };
  if (t < 30) return { z: '4', kom: 'Dostatečně. Had se u tebe ani nezadýchal, jen si dal svačinu.' };
  if (t < 60) return { z: '3', kom: 'Dobře. Přesně průměr — jako tvoje docházka na tělocvik.' };
  if (t < 120) return { z: '2', kom: 'Chvalitebně. Had si tě zapsal do sešitu jako nepřítele číslo jedna.' };
  if (t < 210) return { z: '1', kom: 'Výborně! Takový úhyb jsem neviděl od inspekce v roce 1998.' };
  return { z: 'POCHVALA ŘEDITELE', kom: 'Legenda sborovny. Had podal výpověď a odešel učit na jinou školu.' };
}

/* =========================================================
   Herní logika
   ========================================================= */
function konecHry() {
  S.mode = 'dead';
  S.shake = 0.5;
  var t = S.t;
  S.newBest = t > S.best;
  if (S.newBest) { S.best = t; ulozBest(); }
  S.deadInfo = znamka(t);
  SFX.konec();
}

function nakresliFalesne(x, y) {
  if (S.mode !== 'play' || pencilCd > 0) return;
  var b = bounds();
  x = clamp(x, b.x0 + 18, b.x1 - 18);
  y = clamp(y, b.y0 + 18, b.y1 - 18);
  var bomb = bombStock > 0;
  if (bomb) bombStock = 0;
  fakes.push({ x: x, y: y, auto: false, bomb: bomb, born: S.t });
  pencilCd = PENCIL_CD;
  SFX.tuzka();
  floats.push({ text: bomb ? 'BUM za chvíli…' : 'návnada!', x: x, y: y - 24, ttl: 1.1, max: 1.1, col: bomb ? COL.cervena : COL.tuzka, size: 15 });
}

function sebranOtaznik(q) {
  var roll = Math.random();
  var akce;
  if (roll < 0.26) akce = 'guma';
  else if (roll < 0.52) akce = 'zvonek';
  else if (roll < 0.78) akce = (bombStock > 0 ? (Math.random() < 0.5 ? 'guma' : 'zvonek') : 'bomba');
  else akce = 'kanka';

  if (akce === 'guma') {
    var ubrat = Math.min(5, Math.max(0, snake.segs - 4));
    snake.segs -= ubrat;
    floats.push({ text: 'GUMA! −' + ubrat + ' článků', x: q.x, y: q.y - 20, ttl: 1.6, max: 1.6, col: COL.cervena, size: 19 });
    SFX.guma();
  } else if (akce === 'zvonek') {
    snake.frozenUntil = S.t + 2;
    floats.push({ text: 'ZVONEK! Přestávka!', x: q.x, y: q.y - 20, ttl: 1.6, max: 1.6, col: COL.cervena, size: 19 });
    SFX.zvonek();
  } else if (akce === 'bomba') {
    bombStock = 1;
    floats.push({ text: 'BOMBOVÉ JABLKO v zásobě!', x: q.x, y: q.y - 20, ttl: 1.8, max: 1.8, col: COL.cervena, size: 19 });
    SFX.bomba();
  } else {
    novaKanka(true);
    floats.push({ text: 'NOVÁ KAŇKA! Pozor pod nohy.', x: q.x, y: q.y - 20, ttl: 1.6, max: 1.6, col: COL.inkoust, size: 19 });
    SFX.kanka();
  }
}

function updatePlayer(dt) {
  /* klávesnice drží směr zrychlování */
  var kx = 0, ky = 0;
  if (input.keys.ArrowLeft || input.keys.a) kx -= 1;
  if (input.keys.ArrowRight || input.keys.d) kx += 1;
  if (input.keys.ArrowUp || input.keys.w) ky -= 1;
  if (input.keys.ArrowDown || input.keys.s) ky += 1;

  var vBlotu = false;
  for (var i = 0; i < blots.length; i++) {
    if (dist(player.x, player.y, blots[i].x, blots[i].y) < blots[i].r * 0.92) { vBlotu = true; break; }
  }
  var maxS = player.maxSpeed * (vBlotu ? 0.42 : 1);
  var resp = vBlotu ? 3.2 : 5.5;

  var dvx, dvy;
  if (kx !== 0 || ky !== 0) {
    var kl = Math.sqrt(kx * kx + ky * ky);
    dvx = (kx / kl) * maxS; dvy = (ky / kl) * maxS;
    /* cíl myši táhneme s sebou, ať se to nepere */
    input.mx = player.x + (kx / kl) * 120;
    input.my = player.y + (ky / kl) * 120;
  } else {
    /* arrive: jablko se dokutálí přesně pod kurzor */
    var dx = input.mx - player.x, dy = input.my - player.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    var want = Math.min(maxS, d * 4.2);
    if (d > 0.001) { dvx = (dx / d) * want; dvy = (dy / d) * want; }
    else { dvx = 0; dvy = 0; }
  }
  player.vx += (dvx - player.vx) * Math.min(1, resp * dt);
  player.vy += (dvy - player.vy) * Math.min(1, resp * dt);

  player.x += player.vx * dt;
  player.y += player.vy * dt;

  var b = bounds();
  var m = player.r + 3;
  if (player.x < b.x0 + m) { player.x = b.x0 + m; player.vx = Math.max(0, player.vx); }
  if (player.x > b.x1 - m) { player.x = b.x1 - m; player.vx = Math.min(0, player.vx); }
  if (player.y < b.y0 + m) { player.y = b.y0 + m; player.vy = Math.max(0, player.vy); }
  if (player.y > b.y1 - m) { player.y = b.y1 - m; player.vy = Math.min(0, player.vy); }

  player.roll += (Math.sqrt(player.vx * player.vx + player.vy * player.vy) / player.r) * dt * (player.vx >= 0 ? 1 : -1);
}

function snakeTargetPoint() {
  /* nejbližší lákadlo: hráč, nebo falešné jablko */
  var tx = player.x, ty = player.y, key = 'p';
  var dbest = dist(snake.x, snake.y, player.x, player.y);
  for (var i = 0; i < fakes.length; i++) {
    var d = dist(snake.x, snake.y, fakes[i].x, fakes[i].y);
    if (d < dbest) { dbest = d; tx = fakes[i].x; ty = fakes[i].y; key = 'f' + i; }
  }
  /* od 60 s si had na hráče nadbíhá */
  if (key === 'p' && S.t > 55) {
    var lead = clamp((S.t - 55) / 30, 0, 1) * 0.45;
    tx += player.vx * lead;
    ty += player.vy * lead;
    var b = bounds();
    tx = clamp(tx, b.x0 + 20, b.x1 - 20);
    ty = clamp(ty, b.y0 + 20, b.y1 - 20);
  }
  return { x: tx, y: ty, key: key, d: dbest };
}

function updateSnake(dt) {
  /* rychlost roste; od ~60 s je trvale mírně rychlejší než jablko */
  var base;
  if (S.t < 60) base = lerp(138, 278, S.t / 60);
  else base = 278 + Math.min(70, (S.t - 60) * 0.42);
  snake.speed = base;

  var frozen = S.t < snake.frozenUntil || S.t < snake.stunnedUntil;

  var tgt = snakeTargetPoint();

  /* výpady */
  var L = snake.lunge;
  if (!frozen) {
    if (L.state === 'idle') {
      if (S.t >= L.nextAt && S.t > player.graceUntil + 1) {
        L.state = 'tele'; L.t = 0.5;
        SFX.vypad();
      }
    } else if (L.state === 'tele') {
      L.t -= dt;
      if (L.t <= 0) {
        L.state = 'go';
        L.t = 0.9;
        L.ang = Math.atan2(tgt.y - snake.y, tgt.x - snake.x);
      }
    } else if (L.state === 'go') {
      L.t -= dt;
      if (L.t <= 0) {
        L.state = 'idle';
        var k = clamp(S.t / 180, 0, 1);
        L.nextAt = S.t + lerp(rnd(8, 14), rnd(2.6, 4.5), k);
      }
    }
  }

  var speed = snake.speed;
  var moving = !frozen;

  if (L.state === 'tele') speed *= 0.35;
  if (L.state === 'go') {
    var lm = 1.7 + clamp(S.t / 240, 0, 1) * 0.4;
    speed = snake.speed * lm;
  }

  /* anti-orbit hlídač */
  if (tgt.key !== snake.targetKey) { snake.targetKey = tgt.key; snake.bestDist = tgt.d; snake.noProgress = 0; }
  if (tgt.d < snake.bestDist - 6) { snake.bestDist = tgt.d; snake.noProgress = 0; }
  else if (tgt.d < 380) snake.noProgress += dt;
  else snake.noProgress = 0;
  if (snake.noProgress > 2.2 && L.state !== 'go') {
    snake.slowUntil = S.t + 0.45;
    snake.noProgress = 0;
    snake.bestDist = tgt.d;
  }
  var emergency = S.t < snake.slowUntil;
  if (emergency) speed *= 0.55;   /* krátké přibrzdění — jen poslední záchrana */

  if (moving) {
    if (L.state === 'go') {
      snake.ang = L.ang;
    } else {
      var want = Math.atan2(tgt.y - snake.y, tgt.x - snake.x);
      /* poloměr zatáčky roste s rychlostí; blízko cíle zatáčí ostřeji */
      var R = 58 * Math.pow(speed / 180, 1.25);
      var closeK = clamp(tgt.d / 160, 0.3, 1);
      R *= closeK;
      if (emergency) R *= 0.35;
      var om = speed / Math.max(18, R);
      var d = angDiff(want, snake.ang);
      var step = clamp(d, -om * dt, om * dt);
      snake.ang += step;
    }
    snake.x += Math.cos(snake.ang) * speed * dt;
    snake.y += Math.sin(snake.ang) * speed * dt;

    var b = bounds();
    if (snake.x < b.x0) { snake.x = b.x0; }
    if (snake.x > b.x1) { snake.x = b.x1; }
    if (snake.y < b.y0) { snake.y = b.y0; }
    if (snake.y > b.y1) { snake.y = b.y1; }

    /* historie pro tělo */
    var h = snake.hist;
    var last = h[0];
    var dd = dist(snake.x, snake.y, last.x, last.y);
    if (dd > 2) h.unshift({ x: snake.x, y: snake.y });
    var need = (snake.segs + 3) * snake.spacing + 40;
    var acc = 0;
    for (var i = 1; i < h.length; i++) {
      acc += dist(h[i].x, h[i].y, h[i - 1].x, h[i - 1].y);
      if (acc > need) { h.length = i + 1; break; }
    }
  }

  /* žraní falešných jablek */
  for (var fi = fakes.length - 1; fi >= 0; fi--) {
    var f = fakes[fi];
    if (dist(snake.x, snake.y, f.x, f.y) < 18) {
      if (f.bomb) {
        snake.stunnedUntil = S.t + 2.5;
        SFX.vybuch();
        floats.push({ text: 'BUM! Had je omráčený!', x: f.x, y: f.y - 22, ttl: 1.8, max: 1.8, col: COL.cervena, size: 20 });
        S.shake = 0.35;
      } else {
        snake.segs += 4;
        SFX.snez();
        floats.push({ text: 'chramst… +4 články', x: f.x, y: f.y - 20, ttl: 1.3, max: 1.3, col: COL.modra, size: 15 });
      }
      var byloAuto = f.auto;
      fakes.splice(fi, 1);
      if (byloAuto) autoRespawnAt = S.t + rnd(2, 3);
    }
  }
}

/* pozice článků těla podle historie */
function segPositions() {
  var out = [];
  var h = snake.hist;
  if (h.length < 2) {
    for (var s = 0; s < snake.segs; s++) out.push({ x: snake.x, y: snake.y });
    return out;
  }
  var target = snake.spacing;
  var acc = 0, idx = 1, count = 0;
  var px = h[0].x, py = h[0].y;
  while (count < snake.segs && idx < h.length) {
    var seg = dist(px, py, h[idx].x, h[idx].y);
    if (acc + seg >= target) {
      var k = (target - acc) / seg;
      var nx = px + (h[idx].x - px) * k;
      var ny = py + (h[idx].y - py) * k;
      out.push({ x: nx, y: ny });
      px = nx; py = ny;
      acc = 0;
      count++;
      target = snake.spacing;
    } else {
      acc += seg;
      px = h[idx].x; py = h[idx].y;
      idx++;
    }
  }
  while (out.length < snake.segs) out.push({ x: px, y: py });
  return out;
}

function updateWorld(dt) {
  S.t += dt;
  if (pencilCd > 0) pencilCd = Math.max(0, pencilCd - dt);

  updatePlayer(dt);
  updateSnake(dt);

  /* automatická falešná jablka: aspoň jedno na papíře */
  var autoCount = 0;
  for (var i = 0; i < fakes.length; i++) if (fakes[i].auto) autoCount++;
  if (autoCount === 0) {
    if (autoRespawnAt < 0) autoRespawnAt = S.t + rnd(2, 3);
    else if (S.t >= autoRespawnAt) { spawnAutoFake(); autoRespawnAt = -1; }
  } else if (autoCount < 2 && autoRespawnAt > 0 && S.t >= autoRespawnAt) {
    spawnAutoFake(); autoRespawnAt = -1;
  }

  /* otazníky */
  var interval = S.t > 120 ? rnd(6, 9) : rnd(8, 12);
  if (S.t >= qNextAt) {
    if (qmarks.length < 2) spawnQmark();
    qNextAt = S.t + interval;
  }
  for (var qi = qmarks.length - 1; qi >= 0; qi--) {
    var q = qmarks[qi];
    if (S.t - q.born > q.life) { qmarks.splice(qi, 1); continue; }
    if (dist(player.x, player.y, q.x, q.y) < player.r + 24) {
      SFX.otaznik();
      qmarks.splice(qi, 1);
      sebranOtaznik(q);
    }
  }

  /* plovoucí texty */
  for (var ti = floats.length - 1; ti >= 0; ti--) {
    floats[ti].ttl -= dt;
    floats[ti].y -= 14 * dt;
    if (floats[ti].ttl <= 0) floats.splice(ti, 1);
  }

  /* kolize — smrtící je celé tělo; kruhy s tolerancí pro hráče */
  if (S.t > player.graceUntil) {
    var hitHead = dist(player.x, player.y, snake.x, snake.y) < player.r + 10 - 5;
    if (hitHead) { konecHry(); return; }
    var segs = segPositions();
    for (var si = 0; si < segs.length; si++) {
      if (dist(player.x, player.y, segs[si].x, segs[si].y) < player.r + 8 - 6) {
        konecHry(); return;
      }
    }
  }

  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt);
}

/* =========================================================
   Kreslení — školní sešit
   ========================================================= */
function drawPaper() {
  ctx.fillStyle = COL.papir;
  ctx.fillRect(0, 0, W, H);
  /* čtverečky */
  var g = 26;
  ctx.strokeStyle = COL.mrizka;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (var x = g; x < W; x += g) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (var y = g; y < H; y += g) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  /* okraj stránky */
  ctx.strokeStyle = COL.okraj;
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(58 + jit(1, 0.6), 0);
  ctx.lineTo(58 + jit(2, 0.6), H);
  ctx.stroke();
  /* lehké ohmatání rohů */
  ctx.fillStyle = 'rgba(150,130,90,0.07)';
  ctx.beginPath(); ctx.arc(W, H, 90, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, 60, 0, 7); ctx.fill();

  drawDecor();
}

function drawDecor() {
  ctx.save();
  ctx.strokeStyle = COL.tuzkaSvetla;
  ctx.fillStyle = COL.tuzkaSvetla;
  ctx.lineWidth = 1.3;
  for (var i = 0; i < decor.length; i++) {
    var d = decor[i];
    if (d.type === 'tictac') {
      var s = d.s, c = s / 3;
      ctx.beginPath();
      ctx.moveTo(d.x + c + jit(i * 9 + 1, 1), d.y); ctx.lineTo(d.x + c + jit(i * 9 + 2, 1), d.y + s);
      ctx.moveTo(d.x + 2 * c, d.y + jit(i * 9 + 3, 1)); ctx.lineTo(d.x + 2 * c + jit(i * 9 + 4, 1), d.y + s);
      ctx.moveTo(d.x, d.y + c + jit(i * 9 + 5, 1)); ctx.lineTo(d.x + s, d.y + c);
      ctx.moveTo(d.x + jit(i * 9 + 6, 1), d.y + 2 * c); ctx.lineTo(d.x + s, d.y + 2 * c + jit(i * 9 + 7, 1));
      ctx.stroke();
      /* pár tahů */
      ctx.beginPath(); ctx.arc(d.x + c / 2 + 2, d.y + c / 2 + 2, 5, 0.3, 6); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(d.x + c + 4, d.y + c + 4); ctx.lineTo(d.x + 2 * c - 4, d.y + 2 * c - 4);
      ctx.moveTo(d.x + 2 * c - 4, d.y + c + 4); ctx.lineTo(d.x + c + 4, d.y + 2 * c - 4);
      ctx.stroke();
    } else if (d.type === 'heart') {
      var t = d.s;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y + t * 0.3);
      ctx.bezierCurveTo(d.x - t, d.y - t * 0.7, d.x - t * 2, d.y + t * 0.5, d.x, d.y + t * 1.4);
      ctx.bezierCurveTo(d.x + t * 2, d.y + t * 0.5, d.x + t, d.y - t * 0.7, d.x, d.y + t * 0.3);
      ctx.stroke();
      ctx.font = '10px ' + FONT;
      ctx.fillText('M + ?', d.x - 14, d.y + t * 2.2);
    } else if (d.type === 'slova' || d.type === 'slova2') {
      ctx.font = '11px ' + FONT;
      ctx.save();
      ctx.translate(d.x, d.y);
      ctx.rotate(-1.5708);
      var slova = d.type === 'slova' ? ['die Schlange', 'der Apfel'] : ['test ÚT!!', 'nezapomenout'];
      for (var j = 0; j < slova.length; j++) {
        ctx.fillText(slova[j], -40, j * 16);
        if (j === 0) {
          ctx.beginPath();
          ctx.moveTo(-42, -3 + jit(i * 3 + j, 1)); ctx.lineTo(-42 + ctx.measureText(slova[j]).width + 4, -4);
          ctx.stroke();
        }
      }
      ctx.restore();
    }
  }
  ctx.restore();
}

/* roztřesená čára (boiling) */
function scribbleCircle(x, y, r, seed, col, width, fill) {
  ctx.save();
  ctx.strokeStyle = col;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  var n = 12;
  for (var pass = 0; pass < 2; pass++) {
    ctx.beginPath();
    for (var i = 0; i <= n; i++) {
      var a = (i / n) * Math.PI * 2 + seed;
      var rr = r + jit(seed * 13 + i + pass * 57, r * 0.09);
      var px = x + Math.cos(a) * rr;
      var py = y + Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    if (fill && pass === 0) { ctx.fillStyle = fill; ctx.fill(); }
    ctx.stroke();
  }
  ctx.restore();
}

function drawBlot(bl) {
  /* kaňka — klidná, jen nepatrné chvění okraje */
  ctx.save();
  ctx.fillStyle = COL.inkoust;
  ctx.globalAlpha = 0.9;
  ctx.beginPath();
  var n = 16;
  var wob = Math.sin(S.frame * 0.02 + bl.seed) * 0.8;
  for (var i = 0; i <= n; i++) {
    var a = (i / n) * Math.PI * 2;
    var rr = bl.r * (0.82 + 0.18 * jrand(bl.seed + i * 3.7)) + wob * Math.sin(a * 3 + bl.seed);
    var px = bl.x + Math.cos(a) * rr;
    var py = bl.y + Math.sin(a) * rr * 0.9;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
  /* kapičky okolo */
  for (var k = 0; k < 4; k++) {
    var aa = jrand(bl.seed + 40 + k) * Math.PI * 2;
    var dd = bl.r * (1.1 + 0.3 * jrand(bl.seed + 50 + k));
    ctx.beginPath();
    ctx.arc(bl.x + Math.cos(aa) * dd, bl.y + Math.sin(aa) * dd * 0.9, 2.5 + 3 * jrand(bl.seed + 60 + k), 0, 7);
    ctx.fill();
  }
  /* odlesk */
  ctx.globalAlpha = 0.18;
  ctx.fillStyle = '#8fa3d8';
  ctx.beginPath();
  ctx.ellipse(bl.x - bl.r * 0.25, bl.y - bl.r * 0.3, bl.r * 0.3, bl.r * 0.16, -0.5, 0, 7);
  ctx.fill();
  ctx.restore();
}

function drawApple(x, y, r, col, roll, pencil, bomb) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(roll || 0);
  var lw = pencil ? 1.6 : 2.2;
  /* tělo jablka — dvě lehce jiné kružnice */
  scribbleCircle(0, 0, r, pencil ? 5.2 : 1.7, col, lw, pencil ? 'rgba(160,160,160,0.12)' : 'rgba(201,42,42,0.10)');
  /* důlek + stopka + lístek */
  ctx.strokeStyle = col;
  ctx.lineWidth = lw;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(jit(11, 1), -r + 2);
  ctx.quadraticCurveTo(2 + jit(12, 1), -r - 6, 1, -r - 8 + jit(13, 1));
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(2, -r - 5);
  ctx.quadraticCurveTo(9 + jit(14, 1.5), -r - 10, 12, -r - 4 + jit(15, 1));
  ctx.quadraticCurveTo(7, -r - 2, 2, -r - 5);
  ctx.stroke();
  if (pencil) {
    /* šrafování tužkou */
    ctx.globalAlpha = 0.5;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var i = -2; i <= 2; i++) {
      ctx.moveTo(-r * 0.7, i * r * 0.3 + jit(20 + i, 1.4));
      ctx.lineTo(r * 0.7, i * r * 0.3 - r * 0.25 + jit(25 + i, 1.4));
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  if (bomb) {
    /* zapálená šňůrka */
    ctx.strokeStyle = COL.cervena;
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(1, -r - 8);
    ctx.quadraticCurveTo(10, -r - 16, 16 + jit(31, 2), -r - 13 + jit(32, 2));
    ctx.stroke();
    var fx = 17 + jit(33, 2), fy = -r - 13 + jit(34, 2);
    ctx.fillStyle = '#e8a020';
    ctx.beginPath(); ctx.arc(fx, fy, 3.5 + jit(35, 1.2), 0, 7); ctx.fill();
    ctx.fillStyle = COL.cervena;
    ctx.beginPath(); ctx.arc(fx, fy, 1.6, 0, 7); ctx.fill();
  }
  ctx.restore();
}

function drawSnake() {
  var segs = segPositions();
  var frozen = S.t < snake.frozenUntil;
  var stunned = S.t < snake.stunnedUntil;
  var col = COL.modra;
  ctx.save();
  if (frozen || stunned) ctx.globalAlpha = 0.75;

  /* páteř — spojitá roztřesená čára od hlavy k ocasu */
  if (segs.length > 1) {
    ctx.strokeStyle = COL.modraSvetla;
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(snake.x + jit(200, 1.2), snake.y + jit(201, 1.2));
    for (var si = 0; si < segs.length; si++) {
      ctx.lineTo(segs[si].x + jit(202 + si, 1.5), segs[si].y + jit(230 + si, 1.5));
    }
    ctx.stroke();
  }

  /* tělo od ocasu */
  for (var i = segs.length - 1; i >= 0; i--) {
    var p = segs[i];
    var r = 8 - (i / Math.max(1, segs.length)) * 3;
    scribbleCircle(p.x, p.y, r, i * 3.1, i % 2 ? col : COL.modraSvetla, 1.8, 'rgba(39,75,159,0.08)');
  }

  /* hlava */
  var hx = snake.x, hy = snake.y;
  var wob = 0;
  if (snake.lunge.state === 'tele') {
    wob = Math.sin(S.frame * 0.9) * 4;
    hx += Math.cos(snake.ang + Math.PI / 2) * wob;
    hy += Math.sin(snake.ang + Math.PI / 2) * wob;
  }
  ctx.save();
  ctx.translate(hx, hy);
  ctx.rotate(snake.ang);
  scribbleCircle(0, 0, 11, 99, col, 2.4, 'rgba(39,75,159,0.13)');
  /* oči */
  ctx.fillStyle = col;
  if (stunned) {
    ctx.strokeStyle = col; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(1, -7); ctx.lineTo(7, -2); ctx.moveTo(7, -7); ctx.lineTo(1, -2);
    ctx.moveTo(1, 2); ctx.lineTo(7, 7); ctx.moveTo(7, 2); ctx.lineTo(1, 7);
    ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(4, -4.5, 2.1, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(4, 4.5, 2.1, 0, 7); ctx.fill();
  }
  /* jazyk */
  if (!frozen && !stunned && (S.frame % 60 < 26 || snake.lunge.state !== 'idle')) {
    ctx.strokeStyle = COL.cervena;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(11, 0);
    ctx.lineTo(19 + jit(41, 1.5), jit(42, 2));
    ctx.moveTo(19 + jit(41, 1.5), jit(42, 2));
    ctx.lineTo(23, -3 + jit(43, 1));
    ctx.moveTo(19 + jit(41, 1.5), jit(42, 2));
    ctx.lineTo(23, 3 + jit(44, 1));
    ctx.stroke();
  }
  ctx.restore();

  /* telegraf výpadu — vykřičník */
  if (snake.lunge.state === 'tele') {
    ctx.fillStyle = COL.cervena;
    ctx.font = 'bold 22px ' + FONT;
    ctx.textAlign = 'center';
    ctx.fillText('!!', hx + jit(45, 2), hy - 22 + jit(46, 2));
    ctx.textAlign = 'left';
  }
  if (frozen) {
    ctx.fillStyle = COL.cervena;
    ctx.font = '15px ' + FONT;
    ctx.textAlign = 'center';
    ctx.fillText('přestávka…', hx, hy - 22);
    ctx.textAlign = 'left';
  }
  if (stunned) {
    ctx.fillStyle = COL.modra;
    ctx.font = '15px ' + FONT;
    ctx.textAlign = 'center';
    ctx.fillText('☆ ☆ ☆', hx, hy - 22 + jit(47, 1.5));
    ctx.textAlign = 'left';
  }
  ctx.restore();
}

function drawQmark(q) {
  var age = S.t - q.born;
  var left = q.life - age;
  ctx.save();
  if (left < 2) ctx.globalAlpha = clamp(left / 2, 0.15, 1);
  ctx.translate(q.x, q.y);
  ctx.rotate(jit(q.born * 10 + 3, 0.09));
  ctx.fillStyle = COL.modra;
  ctx.font = 'bold ' + (42 + jit(q.born * 10 + 4, 2)) + 'px ' + FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('?', 0, 0);
  ctx.restore();
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

function drawGrace() {
  if (S.t > player.graceUntil) return;
  var frac = 1 - S.t / player.graceUntil;
  ctx.save();
  ctx.strokeStyle = COL.cervena;
  ctx.globalAlpha = 0.7;
  ctx.lineWidth = 1.6;
  ctx.setLineDash([6, 5]);
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r + 12, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = '13px ' + FONT;
  ctx.fillStyle = COL.cervena;
  ctx.textAlign = 'center';
  ctx.fillText('ochranná lhůta', player.x, player.y - player.r - 20);
  ctx.textAlign = 'left';
  ctx.restore();
}

/* HUD: čas + tužka s cooldownem + bomba */
function drawHUD() {
  ctx.save();
  /* čas — červená poznámka učitele */
  ctx.fillStyle = COL.cervena;
  ctx.font = 'bold 26px ' + FONT;
  ctx.textAlign = 'right';
  ctx.fillText(Math.floor(S.t) + ' s', W - 20, 40 + jit(51, 0.8));
  ctx.font = '13px ' + FONT;
  if (S.best > 0) ctx.fillText('rekord: ' + Math.floor(S.best) + ' s', W - 20, 60);
  ctx.textAlign = 'left';

  /* tužka s kroužkem průběhu — vždy viditelná */
  var ix = W - 46, iy = H - 46, ir = 24;
  ctx.strokeStyle = COL.tuzka;
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.35;
  ctx.beginPath(); ctx.arc(ix, iy, ir, 0, 7); ctx.stroke();
  ctx.globalAlpha = 1;
  var ready = pencilCd <= 0;
  ctx.strokeStyle = ready ? COL.cervena : COL.tuzka;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(ix, iy, ir, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - pencilCd / PENCIL_CD));
  ctx.stroke();
  /* tužtička */
  ctx.save();
  ctx.translate(ix, iy);
  ctx.rotate(-0.7 + jit(53, 0.04));
  ctx.strokeStyle = ready ? '#333' : '#999';
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.moveTo(-9, 9); ctx.lineTo(7, -7);
  ctx.stroke();
  ctx.fillStyle = ready ? '#333' : '#999';
  ctx.beginPath();
  ctx.moveTo(-9, 9); ctx.lineTo(-12, 12); ctx.lineTo(-6, 12); ctx.closePath();
  ctx.fill();
  ctx.restore();
  if (!ready) {
    ctx.fillStyle = COL.tuzka;
    ctx.font = '12px ' + FONT;
    ctx.textAlign = 'center';
    ctx.fillText(pencilCd.toFixed(1), ix, iy + ir + 14);
    ctx.textAlign = 'left';
  }

  /* zásoba bomby */
  if (bombStock > 0) {
    drawApple(ix - 62, iy + 4, 10, COL.cervena, 0, false, true);
    ctx.fillStyle = COL.cervena;
    ctx.font = '11px ' + FONT;
    ctx.textAlign = 'center';
    ctx.fillText('bomba', ix - 62, iy + 30);
    ctx.textAlign = 'left';
  }
  ctx.restore();
}

function drawFloats() {
  ctx.save();
  ctx.textAlign = 'center';
  for (var i = 0; i < floats.length; i++) {
    var f = floats[i];
    ctx.globalAlpha = clamp(f.ttl / f.max, 0, 1);
    ctx.fillStyle = f.col;
    ctx.font = 'bold ' + f.size + 'px ' + FONT;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.restore();
  ctx.textAlign = 'left';
}

/* červeně zakroužkovaný text */
function circleText(x, y, text, size) {
  ctx.save();
  ctx.fillStyle = COL.cervena;
  ctx.font = 'bold ' + size + 'px ' + FONT;
  ctx.textAlign = 'center';
  ctx.fillText(text, x, y);
  var w = ctx.measureText(text).width;
  ctx.strokeStyle = COL.cervena;
  ctx.lineWidth = 3;
  ctx.beginPath();
  var rx = w / 2 + size * 0.5, ry = size * 0.75;
  for (var i = 0; i <= 14; i++) {
    var a = (i / 14) * Math.PI * 2.15 - 0.4;
    var px = x + Math.cos(a) * (rx + jit(70 + i, 3));
    var py = y - size * 0.33 + Math.sin(a) * (ry + jit(80 + i, 3));
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.restore();
}

/* tlačítka na obrazovkách */
var buttons = [];
function drawButton(id, x, y, w, h, text) {
  buttons.push({ id: id, x: x, y: y, w: w, h: h });
  ctx.save();
  ctx.strokeStyle = COL.modra;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + jit(90, 2), y + jit(91, 2));
  ctx.lineTo(x + w + jit(92, 2), y + jit(93, 2));
  ctx.lineTo(x + w + jit(94, 2), y + h + jit(95, 2));
  ctx.lineTo(x + jit(96, 2), y + h + jit(97, 2));
  ctx.closePath();
  ctx.stroke();
  ctx.fillStyle = COL.modra;
  ctx.font = 'bold 17px ' + FONT;
  ctx.textAlign = 'center';
  ctx.fillText(text, x + w / 2, y + h / 2 + 6);
  ctx.restore();
  ctx.textAlign = 'left';
}
function hitButton(x, y) {
  for (var i = 0; i < buttons.length; i++) {
    var b = buttons[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
  }
  return null;
}

function drawMenu() {
  buttons = [];
  var cx = W / 2;
  var maly = W < 620 || H < 560;

  ctx.fillStyle = COL.cervena;
  ctx.textAlign = 'center';
  ctx.font = 'bold ' + (maly ? 44 : 64) + 'px ' + FONT;
  ctx.save();
  ctx.translate(cx, maly ? 70 : 110);
  ctx.rotate(jit(100, 0.012) - 0.02);
  ctx.fillText('SVAČINA', 0, 0);
  ctx.restore();
  circleText(cx + (maly ? 90 : 150), maly ? 40 : 62, 'sněz mě!', maly ? 12 : 15);

  ctx.fillStyle = COL.modra;
  ctx.font = (maly ? 17 : 21) + 'px ' + FONT;
  ctx.fillText('Jsi svačina. Uteč hadovi.', cx, maly ? 102 : 155);

  /* tahák — školní papírek */
  var tw = Math.min(W - 40, 460), th = maly ? 202 : 212;
  var tx = cx - tw / 2, ty = maly ? 120 : 180;
  ctx.save();
  ctx.translate(tx + tw / 2, ty + th / 2);
  ctx.rotate(-0.015 + jit(101, 0.006));
  ctx.translate(-tw / 2, -th / 2);
  ctx.fillStyle = 'rgba(255,252,240,0.94)';
  ctx.strokeStyle = COL.tuzka;
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(jit(102, 2), jit(103, 2));
  ctx.lineTo(tw + jit(104, 2), jit(105, 2));
  ctx.lineTo(tw + jit(106, 2), th + jit(107, 2));
  ctx.lineTo(jit(108, 2), th + jit(109, 2));
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = COL.tuzka;
  ctx.font = 'bold 14px ' + FONT;
  ctx.textAlign = 'left';
  var fs = maly ? 12 : 13;
  ctx.fillText('TAHÁK (neukazovat učiteli):', 14, 24);
  ctx.font = fs + 'px ' + FONT;
  var lines = [
    '✎ klik/ťuk = nakreslíš falešné jablko, had na něj skočí',
    '? otazník = GUMA smaže hadovi ocas / ZVONEK ho zastaví',
    '   / BOMBOVÉ JABLKO do zásoby / nová KAŇKA (smůla)',
    '● kaňky brzdí JEN tebe — had po nich klouže',
    '! když se had zavrtí, uhni — přijde výpad',
    'Známky: 15 s = 5 · 30 s = 4 · 60 s = 3 · 120 s = 2 · 210 s = 1',
    'Pochvalu ředitele prý ještě nikdo živý nedostal.'
  ];
  for (var i = 0; i < lines.length; i++) ctx.fillText(lines[i], 14, 48 + i * (fs + 9));
  ctx.restore();

  ctx.textAlign = 'center';
  ctx.fillStyle = COL.cervena;
  ctx.font = 'bold ' + (maly ? 16 : 19) + 'px ' + FONT;
  var blik = (S.frame % 80) < 55;
  if (blik) ctx.fillText('Klikni nebo zmáčkni MEZERNÍK — zvoní!', cx, ty + th + (maly ? 34 : 46));
  if (S.best > 0) {
    ctx.fillStyle = COL.modra;
    ctx.font = '14px ' + FONT;
    ctx.fillText('Tvůj rekord: ' + Math.floor(S.best) + ' s', cx, ty + th + (maly ? 58 : 74));
  }
  ctx.textAlign = 'left';
}

function drawPause() {
  buttons = [];
  ctx.fillStyle = 'rgba(248,245,234,0.82)';
  ctx.fillRect(0, 0, W, H);
  var cx = W / 2, cy = H / 2;
  ctx.fillStyle = COL.cervena;
  ctx.font = 'bold 40px ' + FONT;
  ctx.textAlign = 'center';
  ctx.fillText('PŘESTÁVKA', cx, cy - 70);
  ctx.fillStyle = COL.modra;
  ctx.font = '16px ' + FONT;
  ctx.fillText('Had čeká na chodbě. Nikam neutekl, bohužel.', cx, cy - 38);
  ctx.textAlign = 'left';
  drawButton('resume', cx - 110, cy - 8, 220, 46, 'Pokračovat (P)');
  drawButton('menu', cx - 110, cy + 52, 220, 46, 'Hlavní menu (M)');
}

function drawDead() {
  buttons = [];
  var cx = W / 2;
  var maly = H < 560;
  ctx.fillStyle = 'rgba(248,245,234,0.88)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = COL.modra;
  ctx.font = 'bold ' + (maly ? 26 : 34) + 'px ' + FONT;
  ctx.fillText('CHRAMST. Svačina snědena.', cx, maly ? 54 : 90);

  ctx.fillStyle = COL.cervena;
  ctx.font = (maly ? 16 : 19) + 'px ' + FONT;
  ctx.fillText('Přežil(a) jsi ' + S.t.toFixed(1) + ' s', cx, maly ? 84 : 130);

  var zn = S.deadInfo || znamka(S.t);
  var jePochvala = zn.z.length > 2;
  circleText(cx, maly ? 140 : 210, zn.z, jePochvala ? (maly ? 22 : 30) : (maly ? 52 : 68));

  ctx.fillStyle = COL.cervena;
  ctx.font = (maly ? 13 : 16) + 'px ' + FONT;
  /* komentář učitele — zalamovat */
  var words = zn.kom.split(' ');
  var line = '', lines = [];
  var maxW = Math.min(W - 60, 520);
  for (var i = 0; i < words.length; i++) {
    var test = line ? line + ' ' + words[i] : words[i];
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = words[i]; }
    else line = test;
  }
  if (line) lines.push(line);
  for (var li = 0; li < lines.length; li++) {
    ctx.fillText(lines[li], cx, (maly ? 178 : 258) + li * (maly ? 18 : 22));
  }

  ctx.fillStyle = COL.modra;
  ctx.font = '14px ' + FONT;
  var bs = S.newBest ? 'NOVÝ REKORD! ' + Math.floor(S.best) + ' s — podpis rodičů netřeba.'
                     : (S.best > 0 ? 'Rekord třídy: ' + Math.floor(S.best) + ' s' : '');
  if (bs) ctx.fillText(bs, cx, (maly ? 220 : 320));
  ctx.textAlign = 'left';

  var by = maly ? H - 120 : H / 2 + 110;
  drawButton('again', cx - 110, by, 220, 46, 'Ještě jednou (R)');
  drawButton('menu', cx - 110, by + 58, 220, 44, 'Hlavní menu (M)');
}

function drawWorld() {
  var i;
  for (i = 0; i < blots.length; i++) drawBlot(blots[i]);
  for (i = 0; i < qmarks.length; i++) drawQmark(qmarks[i]);
  for (i = 0; i < fakes.length; i++) {
    drawApple(fakes[i].x, fakes[i].y, 11, fakes[i].bomb ? COL.cervena : COL.tuzka, jit(fakes[i].born * 7, 0.06), !fakes[i].bomb, fakes[i].bomb);
  }
  drawSnake();
  drawApple(player.x, player.y, player.r, COL.cervena, player.roll, false, false);
  drawGrace();
  drawFloats();
  drawHUD();
}

/* =========================================================
   Hlavní smyčka
   ========================================================= */
var lastT = 0;
function frame(ts) {
  var dt = Math.min(0.05, (ts - lastT) / 1000 || 0.016);
  lastT = ts;
  S.frame++;
  S.boilAcc += dt;
  if (S.boilAcc > 0.14) { S.boilAcc = 0; S.boil = (S.boil + 1) % 3; }

  if (S.mode === 'play') updateWorld(dt);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (S.shake > 0) {
    ctx.translate(jit(120, S.shake * 8), jit(121, S.shake * 8));
  }
  drawPaper();

  if (S.mode === 'menu') {
    drawMenu();
  } else if (S.mode === 'play') {
    drawWorld();
  } else if (S.mode === 'pause') {
    drawWorld();
    drawPause();
  } else if (S.mode === 'dead') {
    drawWorld();
    drawDead();
  }

  window.requestAnimationFrame(frame);
}

/* =========================================================
   Ovládání
   ========================================================= */
function canvasPos(clientX, clientY) {
  var r = canvas.getBoundingClientRect();
  return { x: clientX - r.left, y: clientY - r.top };
}

function pauzni(from) {
  if (S.mode !== 'play') return;
  S.pauseFrom = from || 'play';
  S.mode = 'pause';
}
function pokracuj() {
  if (S.mode !== 'pause') return;
  S.mode = 'play';
}
function doMenu() {
  S.mode = 'menu';
}

function primaryAction(x, y) {
  /* klik/ťuk podle stavu */
  ensureAudio();
  if (S.mode === 'menu') { SFX.klik(); startHra(); return; }
  if (S.mode === 'pause') {
    var id = hitButton(x, y);
    if (id === 'resume') { SFX.klik(); pokracuj(); }
    else if (id === 'menu') { SFX.klik(); doMenu(); }
    return;
  }
  if (S.mode === 'dead') {
    var id2 = hitButton(x, y);
    if (id2 === 'menu') { SFX.klik(); doMenu(); }
    else { SFX.klik(); startHra(); }
    return;
  }
  if (S.mode === 'play') {
    nakresliFalesne(x, y);
  }
}

canvas.addEventListener('mousemove', function (e) {
  var p = canvasPos(e.clientX, e.clientY);
  input.mx = p.x; input.my = p.y;
  input.hasPointer = true;
});
canvas.addEventListener('mousedown', function (e) {
  if (e.button !== 0) return;
  var p = canvasPos(e.clientX, e.clientY);
  input.mx = p.x; input.my = p.y;
  primaryAction(p.x, p.y);
});

canvas.addEventListener('touchstart', function (e) {
  e.preventDefault();
  ensureAudio();
  var t = e.changedTouches[0];
  var p = canvasPos(t.clientX, t.clientY);
  if (S.mode !== 'play') { primaryAction(p.x, p.y); return; }
  input.touchId = t.identifier;
  input.touchStart = { x: p.x, y: p.y, t: performance.now() };
  input.mx = p.x; input.my = p.y;
}, { passive: false });
canvas.addEventListener('touchmove', function (e) {
  e.preventDefault();
  for (var i = 0; i < e.changedTouches.length; i++) {
    var t = e.changedTouches[i];
    if (input.touchId === null || t.identifier === input.touchId) {
      var p = canvasPos(t.clientX, t.clientY);
      input.mx = p.x; input.my = p.y;
    }
  }
}, { passive: false });
canvas.addEventListener('touchend', function (e) {
  e.preventDefault();
  if (S.mode !== 'play') return;
  for (var i = 0; i < e.changedTouches.length; i++) {
    var t = e.changedTouches[i];
    if (input.touchId !== null && t.identifier === input.touchId && input.touchStart) {
      var p = canvasPos(t.clientX, t.clientY);
      var dt = performance.now() - input.touchStart.t;
      var dd = dist(p.x, p.y, input.touchStart.x, input.touchStart.y);
      if (dt < 260 && dd < 16) nakresliFalesne(p.x, p.y);
      input.touchId = null; input.touchStart = null;
    }
  }
}, { passive: false });

window.addEventListener('keydown', function (e) {
  var k = e.key;
  ensureAudio();
  if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown' || k === ' ') e.preventDefault();
  if (k === ' ' || k === 'Enter') {
    if (S.mode === 'menu') { startHra(); return; }
    if (S.mode === 'dead') { startHra(); return; }
    if (S.mode === 'pause') { pokracuj(); return; }
  }
  if (k === 'p' || k === 'P') {
    if (S.mode === 'play') pauzni('key');
    else if (S.mode === 'pause') pokracuj();
    return;
  }
  if ((k === 'm' || k === 'M') && (S.mode === 'pause' || S.mode === 'dead')) { doMenu(); return; }
  if ((k === 'r' || k === 'R') && S.mode === 'dead') { startHra(); return; }
  if (k === 'ArrowLeft') input.keys.ArrowLeft = true;
  if (k === 'ArrowRight') input.keys.ArrowRight = true;
  if (k === 'ArrowUp') input.keys.ArrowUp = true;
  if (k === 'ArrowDown') input.keys.ArrowDown = true;
  if (k === 'a' || k === 'A') input.keys.a = true;
  if (k === 'd' || k === 'D') input.keys.d = true;
  if (k === 'w' || k === 'W') input.keys.w = true;
  if (k === 's' || k === 'S') input.keys.s = true;
});
window.addEventListener('keyup', function (e) {
  var k = e.key;
  if (k === 'ArrowLeft') input.keys.ArrowLeft = false;
  if (k === 'ArrowRight') input.keys.ArrowRight = false;
  if (k === 'ArrowUp') input.keys.ArrowUp = false;
  if (k === 'ArrowDown') input.keys.ArrowDown = false;
  if (k === 'a' || k === 'A') input.keys.a = false;
  if (k === 'd' || k === 'D') input.keys.d = false;
  if (k === 'w' || k === 'W') input.keys.w = false;
  if (k === 's' || k === 'S') input.keys.s = false;
});

/* ztráta fokusu = pauza */
window.addEventListener('blur', function () { pauzni('blur'); });
document.addEventListener('visibilitychange', function () {
  if (document.hidden) pauzni('hidden');
});

window.addEventListener('resize', resize);

/* testovací háček (neškodný, bez logů) */
window.__SVACINA = {
  S: S, player: player, snake: snake, input: input,
  get fakes() { return fakes; },
  get qmarks() { return qmarks; },
  get blots() { return blots; },
  get bombStock() { return bombStock; },
  get pencilCd() { return pencilCd; },
  start: startHra
};

resize();
window.requestAnimationFrame(frame);
})();
</script>
</body>
</html>
