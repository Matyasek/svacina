<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SVAČINA</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#e9e5d8}
  canvas{display:block;touch-action:none;cursor:crosshair;-webkit-user-select:none;user-select:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
(function(){
const TAU = Math.PI*2;
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');

let W=0, H=0, S=1, DPR=1;
let paper = null;           // offscreen předrenderovaný papír
let nowMs = 0;              // čas pro boil fáze
let bp = 0;                 // boil phase 0..2

// ------------------------------------------------------------------
// Pomůcky
// ------------------------------------------------------------------
function rand(a,b){ return a + Math.random()*(b-a); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function dist(x1,y1,x2,y2){ const dx=x2-x1, dy=y2-y1; return Math.hypot(dx,dy); }
function lerp(a,b,t){ return a+(b-a)*t; }
function angNorm(a){ while(a>Math.PI)a-=TAU; while(a<-Math.PI)a+=TAU; return a; }

// deterministický "šum" pro boiling lines — mění se s bp
function jr(n){
  const x = Math.sin(n*12.9898 + bp*78.233) * 43758.5453;
  return x - Math.floor(x);
}

function loadBest(){
  try{ const v = parseFloat(localStorage.getItem('svacina_best')); return isFinite(v)&&v>0 ? v : 0; }
  catch(e){ return 0; }
}
function saveBest(v){
  try{ localStorage.setItem('svacina_best', String(v)); }catch(e){}
}

// ------------------------------------------------------------------
// Zvuk (Web Audio, jen syntetický, aktivace až po interakci)
// ------------------------------------------------------------------
let AC = null;
function ensureAudio(){
  if(!AC){
    try{
      const C = window.AudioContext || window.webkitAudioContext;
      if(C) AC = new C();
    }catch(e){ AC = null; }
  }
  if(AC && AC.state === 'suspended'){ AC.resume().catch(function(){}); }
}
function tone(freq, dur, type, vol, slide, delay){
  if(!AC) return;
  try{
    const t0 = AC.currentTime + (delay||0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type||'sine'; o.frequency.setValueAtTime(freq, t0);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,freq+slide), t0+dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol||0.15, t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0+dur+0.03);
  }catch(e){}
}
function noiseBurst(dur, vol, freq, type, delay){
  if(!AC) return;
  try{
    const t0 = AC.currentTime + (delay||0);
    const len = Math.max(1, Math.floor(AC.sampleRate*dur));
    const buf = AC.createBuffer(1, len, AC.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1-i/len);
    const src = AC.createBufferSource(); src.buffer = buf;
    const f = AC.createBiquadFilter(); f.type = type||'lowpass'; f.frequency.value = freq||800; f.Q.value = 1;
    const g = AC.createGain();
    g.gain.setValueAtTime(vol||0.2, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    src.connect(f); f.connect(g); g.connect(AC.destination);
    src.start(t0);
  }catch(e){}
}
const sfx = {
  scratch(){ noiseBurst(0.14, 0.22, 1700, 'bandpass'); noiseBurst(0.10, 0.12, 2600, 'bandpass', 0.05); },
  eatFake(){ noiseBurst(0.09, 0.2, 700); tone(160, 0.1, 'square', 0.08, -80); },
  warn(){ for(let i=0;i<5;i++) tone(1050+i*60, 0.03, 'square', 0.06, 0, i*0.055); },
  crunch(){ noiseBurst(0.3, 0.5, 450); tone(85, 0.35, 'sawtooth', 0.2, -50); },
  bell(){ tone(1244, 0.6, 'triangle', 0.18); tone(1865, 0.5, 'triangle', 0.1, 0, 0.02); },
  eraser(){ noiseBurst(0.22, 0.25, 900, 'highpass'); noiseBurst(0.18, 0.2, 1200, 'highpass', 0.12); },
  bombGet(){ tone(150, 0.16, 'square', 0.14, -60); tone(300, 0.12, 'square', 0.1, 60, 0.14); },
  boom(){ noiseBurst(0.4, 0.55, 300); tone(55, 0.45, 'sine', 0.35, -25); },
  blot(){ tone(75, 0.22, 'sine', 0.28, -30); noiseBurst(0.14, 0.2, 260); },
  qPick(){ tone(660, 0.07, 'triangle', 0.14); tone(880, 0.09, 'triangle', 0.14, 0, 0.07); },
  start(){ tone(440, 0.08, 'triangle', 0.1); tone(660, 0.1, 'triangle', 0.1, 0, 0.09); }
};

// ------------------------------------------------------------------
// Stav hry
// ------------------------------------------------------------------
const G = {
  state: 'menu',      // menu | play | pause | over
  t: 0,               // herní čas (s)
  best: loadBest(),
  newBest: false,
  diedAt: 0,          // nowMs při smrti (kvůli prodlevě před restartem)
  graceT: 0,
  player: { x:0, y:0, vx:0, vy:0, rot:0, r:16 },
  target: { x:0, y:0 },
  keys: {},
  usingKeys: false,
  snake: null,
  apples: [],
  autoRespawnAt: -1,
  drawCd: 0,
  bombStock: false,
  blots: [],
  qmark: null,
  qNextAt: 0,
  labels: [],
  shakePencil: 0
};

function pMaxSpeed(){ return 268*S; }

function snakeSpeed(t){
  const pm = pMaxSpeed();
  let v = pm*(0.66 + 0.36*Math.min(t,60)/60);       // 0.66 → 1.02 × hráč
  if(t>60) v += pm*0.00048*(t-60);                   // pak jen pozvolna
  return Math.min(v, pm*1.22);
}
function lungeInterval(t){
  const f = clamp(1 - t/260, 0.26, 1);
  return (8 + Math.random()*6)*f;
}

function makeSnake(){
  const hx = W*0.88, hy = H*0.14;
  const ang = Math.atan2(H*0.5-hy, W*0.5-hx);
  const segR = 13*S;
  const pts = [];
  for(let i=0;i<12;i++){
    pts.push({ x: hx - Math.cos(ang)*i*segR*1.6, y: hy - Math.sin(ang)*i*segR*1.6 });
  }
  return {
    pts, ang, segR,
    grow: 0, growAcc: 0,
    haltT: 0, freezeKind: '',
    lunge: 'none', lungeT: 0, ldx: 0, ldy: 0,
    nextLungeAt: rand(8,14),
    minDist: 1e9, lastGainT: 0, lureX: 0, lureY: 0, lureKind: '',
    brakeT: 0,
    tongue: 0
  };
}

function makeBlots(){
  const small = Math.min(W,H) < 620 || W < 720;
  const n = small ? 2 : (4 + (Math.random()<0.5?1:0));
  const blots = [];
  const margin = Math.min(W,H)*0.16 + 40;
  for(let k=0;k<n;k++){
    let ok=false, x=0, y=0, r=0, tries=0;
    while(!ok && tries<220){
      tries++;
      r = rand(58,92)*S;
      x = rand(margin, W-margin);
      y = rand(margin, H-margin);
      ok = dist(x,y,W/2,H*0.6) > r+150*S;                     // start hráče volný
      if(ok) for(const b of blots){ if(dist(x,y,b.x,b.y) < (r+b.r)+110*S){ ok=false; break; } }
    }
    const base = [];
    const np = 11;
    for(let i=0;i<np;i++) base.push(rand(0.72,1.28));
    const drops = [];
    const nd = 2+Math.floor(Math.random()*2);
    for(let i=0;i<nd;i++){
      const a = rand(0,TAU);
      drops.push({ dx: Math.cos(a)*r*rand(1.15,1.5), dy: Math.sin(a)*r*rand(1.15,1.5), r: r*rand(0.1,0.22) });
    }
    blots.push({x,y,r,base,drops,ph:rand(0,TAU)});
  }
  return blots;
}

function spawnAutoApple(){
  const head = G.snake.pts[0];
  let x=0,y=0,tries=0;
  do{
    x = rand(70, W-70); y = rand(70, H-70); tries++;
  }while(tries<200 && dist(x,y,head.x,head.y) < 230*S);
  G.apples.push({x,y,auto:true,bomb:false,tilt:rand(-0.3,0.3),born:G.t});
}

function autoCount(){ let n=0; for(const a of G.apples) if(a.auto) n++; return n; }
function playerAppleCount(){ let n=0; for(const a of G.apples) if(!a.auto) n++; return n; }

function startGame(){
  G.state = 'play';
  G.t = 0;
  G.graceT = 2;
  G.newBest = false;
  const p = G.player;
  p.r = 16*S;
  p.x = W/2; p.y = H*0.6; p.vx = 0; p.vy = 0; p.rot = 0;
  G.target.x = p.x; G.target.y = p.y;
  G.usingKeys = false;
  G.snake = makeSnake();
  G.blots = makeBlots();
  G.apples = [];
  spawnAutoApple();
  G.autoRespawnAt = -1;
  G.drawCd = 0;
  G.bombStock = false;
  G.qmark = null;
  G.qNextAt = rand(6,10);
  G.labels = [];
  sfx.start();
}

function addLabel(x,y,txt,color,big){
  G.labels.push({x, y, txt, color: color||'#c1121f', t: 1.6, big: !!big});
}

// ------------------------------------------------------------------
// Kreslené jablko hráče
// ------------------------------------------------------------------
function tryDrawApple(x,y){
  if(G.state !== 'play') return;
  if(G.drawCd > 0){ G.shakePencil = 0.4; return; }
  x = clamp(x, 40, W-40); y = clamp(y, 40, H-40);
  const bomb = G.bombStock;
  if(bomb) G.bombStock = false;
  if(playerAppleCount() >= 6){
    for(let i=0;i<G.apples.length;i++){
      if(!G.apples[i].auto){ G.apples.splice(i,1); break; }
    }
  }
  G.apples.push({x,y,auto:false,bomb,tilt:rand(-0.35,0.35),born:G.t});
  G.drawCd = 4;
  sfx.scratch();
  if(bomb) addLabel(x, y-30*S, 'BOMBA NASTRAŽENA!', '#c1121f');
}

// ------------------------------------------------------------------
// Otazník
// ------------------------------------------------------------------
function spawnQmark(){
  const head = G.snake.pts[0];
  let x=0,y=0,tries=0;
  do{
    x = rand(90, W-90); y = rand(90, H-90); tries++;
  }while(tries<200 && (dist(x,y,head.x,head.y) < 190*S || dist(x,y,G.player.x,G.player.y) < 90*S));
  G.qmark = {x, y, life: 6.5, age: 0};
}
function applyQEffect(){
  let r = Math.random();
  // bomba max 1 v zásobě — když už ji máme, rozděl mezi ostatní
  if(G.bombStock && r>=0.52 && r<0.78) r = r<0.65 ? 0.2 : 0.9;
  const p = G.player;
  if(r < 0.26){
    // GUMA
    const sn = G.snake;
    const cut = Math.min(6, Math.max(0, sn.pts.length-5));
    if(cut>0) sn.pts.length -= cut;
    sn.grow = 0; sn.growAcc = 0;
    addLabel(p.x, p.y-40*S, 'GUMA!', '#c1121f', true);
    sfx.eraser();
  }else if(r < 0.52){
    // ZVONEK
    G.snake.haltT = Math.max(G.snake.haltT, 2);
    G.snake.freezeKind = 'bell';
    G.snake.lunge = 'none';
    addLabel(p.x, p.y-40*S, 'ZVONEK! Přestávka!', '#c1121f', true);
    sfx.bell();
  }else if(r < 0.78){
    // BOMBOVÉ JABLKO do zásoby
    G.bombStock = true;
    addLabel(p.x, p.y-40*S, 'BOMBOVÉ JABLKO!', '#c1121f', true);
    sfx.bombGet();
  }else{
    // NOVÁ KAŇKA
    let x=0,y=0,tries=0;
    const head = G.snake.pts[0];
    const margin = Math.min(W,H)*0.14+40;
    do{
      x = rand(margin, W-margin); y = rand(margin, H-margin); tries++;
    }while(tries<200 && (dist(x,y,p.x,p.y)<160*S || dist(x,y,head.x,head.y)<160*S));
    const r2 = rand(58,88)*S;
    const base = []; for(let i=0;i<11;i++) base.push(rand(0.72,1.28));
    G.blots.push({x,y,r:r2,base,drops:[],ph:rand(0,TAU)});
    addLabel(p.x, p.y-40*S, 'KAŇKA!', '#10163a', true);
    sfx.blot();
  }
}

// ------------------------------------------------------------------
// Update
// ------------------------------------------------------------------
function inBlot(x,y){
  for(const b of G.blots){ if(dist(x,y,b.x,b.y) < b.r*0.95) return true; }
  return false;
}

function updatePlayer(dt){
  const p = G.player;
  let maxV = pMaxSpeed();
  let A = 1050*S;
  if(inBlot(p.x,p.y)){ maxV *= 0.42; A *= 0.6; }

  let desx=0, desy=0;
  let kx=0, ky=0;
  if(G.keys.left) kx-=1; if(G.keys.right) kx+=1;
  if(G.keys.up) ky-=1; if(G.keys.down) ky+=1;
  if(kx||ky){
    G.usingKeys = true;
    const l = Math.hypot(kx,ky);
    desx = kx/l*maxV; desy = ky/l*maxV;
  }else if(!G.usingKeys){
    const dx = G.target.x-p.x, dy = G.target.y-p.y;
    const d = Math.hypot(dx,dy);
    if(d > 2){
      const sp = Math.min(maxV, d*5);
      desx = dx/d*sp; desy = dy/d*sp;
    }
  } // usingKeys && žádná klávesa → dojezd (des=0)

  let dvx = desx-p.vx, dvy = desy-p.vy;
  const dl = Math.hypot(dvx,dvy);
  const cap = A*dt;
  if(dl > cap){ dvx *= cap/dl; dvy *= cap/dl; }
  p.vx += dvx; p.vy += dvy;

  p.x += p.vx*dt; p.y += p.vy*dt;
  const pad = p.r+6;
  if(p.x<pad){p.x=pad; p.vx=Math.max(0,p.vx);}
  if(p.x>W-pad){p.x=W-pad; p.vx=Math.min(0,p.vx);}
  if(p.y<pad){p.y=pad; p.vy=Math.max(0,p.vy);}
  if(p.y>H-pad){p.y=H-pad; p.vy=Math.min(0,p.vy);}

  // koulení — rotace podle pohybu
  p.rot += (p.vx*0.85 + p.vy*0.45)/p.r*dt;
}

function updateSnake(dt){
  const sn = G.snake;
  const head = sn.pts[0];
  const p = G.player;

  sn.tongue += dt;

  if(sn.haltT > 0){
    sn.haltT -= dt;
    // segmenty stojí; jen dorovnat řetěz
    followSegments(sn);
    return;
  }
  sn.freezeKind = '';

  // ---- výběr lákadla: nejbližší z {hráč, jablka} ----
  let lx = p.x, ly = p.y, lkind = 'player', ld = dist(head.x,head.y,p.x,p.y);
  for(const a of G.apples){
    const d = dist(head.x,head.y,a.x,a.y);
    if(d < ld){ ld = d; lx = a.x; ly = a.y; lkind = 'apple'; }
  }
  // predikce po 60 s — jen na hráče
  if(lkind === 'player' && G.t > 60){
    const tau = 0.35*clamp((G.t-60)/30, 0, 1);
    lx += p.vx*tau; ly += p.vy*tau;
    lx = clamp(lx, 30, W-30); ly = clamp(ly, 30, H-30);
  }

  // ---- výpady ----
  let speed = snakeSpeed(G.t);
  let steering = true;

  if(sn.lunge === 'none'){
    if(G.t >= sn.nextLungeAt && G.graceT <= 0){
      sn.lunge = 'tele'; sn.lungeT = 0.5;
      sfx.warn();
    }
  }
  if(sn.lunge === 'tele'){
    sn.lungeT -= dt;
    speed *= 0.85;
    if(sn.lungeT <= 0){
      const dx = lx-head.x, dy = ly-head.y;
      const d = Math.hypot(dx,dy)||1;
      sn.ldx = dx/d; sn.ldy = dy/d;
      sn.lunge = 'sprint'; sn.lungeT = 0.95;
      sn.ang = Math.atan2(sn.ldy, sn.ldx);
    }
  }
  if(sn.lunge === 'sprint'){
    sn.lungeT -= dt;
    speed *= 1.85 + Math.min(G.t,300)*0.001;
    steering = false;
    if(sn.lungeT <= 0){
      sn.lunge = 'none';
      sn.nextLungeAt = G.t + lungeInterval(G.t);
    }
  }

  // ---- anti-zacyklení: sleduj pokrok k lákadlu ----
  if(lkind !== sn.lureKind || dist(lx,ly,sn.lureX,sn.lureY) > 60*S){
    sn.lureKind = lkind; sn.lureX = lx; sn.lureY = ly;
    sn.minDist = ld; sn.lastGainT = G.t;
  }else if(ld < sn.minDist - 10){
    sn.minDist = ld; sn.lastGainT = G.t;
    sn.lureX = lx; sn.lureY = ly;
  }else if(G.t - sn.lastGainT > 2.5 && sn.lunge !== 'sprint'){
    sn.brakeT = 0.55;                 // poslední záchrana
    sn.lastGainT = G.t;
  }
  if(sn.brakeT > 0){ sn.brakeT -= dt; speed *= 0.55; }

  // ---- zatáčení ----
  if(steering){
    const want = Math.atan2(ly-head.y, lx-head.x);
    let omega = 2.2 + Math.min(G.t,240)*0.005;
    const d = Math.max(ld, 26);
    if(ld < 200*S){
      // ostřejší zatáčka u cíle — naplno jen proti stojícímu/pomalému lákadlu,
      // rychle kličkující hráč hada vyhodí z dráhy
      const lureSp = lkind==='player' ? Math.hypot(p.vx,p.vy) : 0;
      const slow = clamp(1 - lureSp/(pMaxSpeed()*0.5), 0, 1);
      const capO = 4.2 + 6.0*slow;
      omega = Math.max(omega, Math.min(2.35*speed/d, capO));
    }
    if(sn.brakeT > 0) omega = Math.max(omega, 8.5);
    const diff = angNorm(want - sn.ang);
    const maxTurn = omega*dt;
    sn.ang += clamp(diff, -maxTurn, maxTurn);
  }

  // ---- pohyb hlavy ----
  head.x += Math.cos(sn.ang)*speed*dt;
  head.y += Math.sin(sn.ang)*speed*dt;
  const pad = sn.segR;
  if(head.x < pad || head.x > W-pad || head.y < pad || head.y > H-pad){
    head.x = clamp(head.x, pad, W-pad);
    head.y = clamp(head.y, pad, H-pad);
    // u zdi se stoč do hřiště
    const want = Math.atan2(H/2-head.y, W/2-head.x);
    const diff = angNorm(want - sn.ang);
    sn.ang += clamp(diff, -6*dt, 6*dt);
  }

  // ---- růst ----
  if(sn.grow > 0){
    sn.growAcc += dt;
    while(sn.growAcc > 0.07 && sn.grow > 0){
      sn.growAcc -= 0.07;
      sn.grow--;
      if(sn.pts.length < 70){
        const last = sn.pts[sn.pts.length-1];
        sn.pts.push({x:last.x, y:last.y});
      }
    }
  }

  followSegments(sn);

  // ---- žraní jablek ----
  for(let i=G.apples.length-1;i>=0;i--){
    const a = G.apples[i];
    if(dist(head.x,head.y,a.x,a.y) < sn.segR + 15*S){
      G.apples.splice(i,1);
      if(a.bomb){
        sn.haltT = 2.5;
        sn.freezeKind = 'boom';
        sn.lunge = 'none';
        addLabel(a.x, a.y-24*S, 'BUM! Had je grogy.', '#c1121f', true);
        sfx.boom();
      }else{
        sn.grow += 4;
        addLabel(a.x, a.y-20*S, 'CHŇAP', '#5b6bd6');
        sfx.eatFake();
      }
      if(a.auto){
        const late = G.t > 120;
        G.autoRespawnAt = G.t + (late ? rand(1.2,2) : rand(2,3));
      }
    }
  }
}

function followSegments(sn){
  const spacing = sn.segR*1.6;
  for(let i=1;i<sn.pts.length;i++){
    const a = sn.pts[i-1], b = sn.pts[i];
    let dx = b.x-a.x, dy = b.y-a.y;
    let d = Math.hypot(dx,dy);
    if(d < 0.0001){ dx = 1; dy = 0; d = 1; }
    b.x = a.x + dx/d*spacing;
    b.y = a.y + dy/d*spacing;
  }
}

function updateApplesAndQ(dt){
  // automatická jablka: aspoň jedno, později dvě
  const need = G.t > 100 ? 2 : 1;
  const have = autoCount();
  if(have < need){
    if(G.autoRespawnAt < 0) G.autoRespawnAt = G.t + rand(2,3);
    if(G.t >= G.autoRespawnAt){
      spawnAutoApple();
      G.autoRespawnAt = autoCount() < need ? G.t + rand(2,3) : -1;
    }
  }else{
    G.autoRespawnAt = -1;
  }

  if(G.drawCd > 0) G.drawCd = Math.max(0, G.drawCd - dt);
  if(G.shakePencil > 0) G.shakePencil -= dt;

  // otazník
  if(G.qmark){
    G.qmark.age += dt;
    G.qmark.life -= dt;
    if(G.qmark.life <= 0){
      G.qmark = null;
      G.qNextAt = G.t + rand(8,13);
    }else{
      const q = G.qmark;
      if(dist(q.x,q.y,G.player.x,G.player.y) < G.player.r + 26*S){
        G.qmark = null;
        G.qNextAt = G.t + rand(8,13);
        sfx.qPick();
        applyQEffect();
      }
    }
  }else if(G.t >= G.qNextAt){
    spawnQmark();
  }

  for(let i=G.labels.length-1;i>=0;i--){
    const l = G.labels[i];
    l.t -= dt; l.y -= 26*S*dt;
    if(l.t<=0) G.labels.splice(i,1);
  }
}

function checkDeath(){
  if(G.graceT > 0) return;
  const p = G.player, sn = G.snake;
  for(let i=0;i<sn.pts.length;i++){
    const s = sn.pts[i];
    const rr = (p.r + sn.segR*(i===0?1.15:1)) * 0.72;   // tolerance ve prospěch hráče
    if(dist(p.x,p.y,s.x,s.y) < rr){
      die();
      return;
    }
  }
}

function die(){
  G.state = 'over';
  G.diedAt = nowMs;
  sfx.crunch();
  if(G.t > G.best){
    G.best = G.t;
    G.newBest = true;
    saveBest(G.best);
  }
}

function update(dt){
  if(G.state !== 'play') return;
  G.t += dt;
  if(G.graceT > 0) G.graceT -= dt;
  updatePlayer(dt);
  updateSnake(dt);
  updateApplesAndQ(dt);
  checkDeath();
}

function jitterCircle(c,cx,cy,r,seed,amp){
  const n = 12;
  c.beginPath();
  for(let i=0;i<n;i++){
    const a = i/n*TAU;
    const rr = r + (jr(seed + i*7.31) - 0.5)*amp;
    const x = cx + Math.cos(a)*rr, y = cy + Math.sin(a)*rr;
    if(i) c.lineTo(x,y); else c.moveTo(x,y);
  }
  c.closePath();
}

function drawApple(c,x,y,r,rot,kind,seed,extra){
  // kind: 'pen' (hráč) | 'pencil' (falešné) | 'bomb'
  c.save();
  c.translate(x,y);
  c.rotate(rot);
  const amp = r*0.22;
  if(kind === 'pen'){
    c.strokeStyle = '#c1121f';
    c.fillStyle = 'rgba(193,18,31,0.13)';
    c.lineWidth = 2.2;
    jitterCircle(c,0,r*0.05,r,seed,amp);
    c.fill(); c.stroke();
    jitterCircle(c,0,r*0.05,r*0.82,seed+40,amp*0.8);
    c.globalAlpha = 0.35; c.lineWidth = 1.2; c.stroke(); c.globalAlpha = 1;
  }else{
    c.strokeStyle = kind==='bomb' ? '#77777f' : '#8b8b93';
    c.lineWidth = 1.6;
    jitterCircle(c,0,r*0.05,r,seed,amp);
    c.stroke();
    c.globalAlpha = 0.5;
    jitterCircle(c,r*0.06,r*0.1,r*0.94,seed+21,amp);
    c.stroke();
    // šrafy
    c.globalAlpha = 0.3;
    c.beginPath();
    for(let i=-2;i<=2;i++){
      c.moveTo(i*r*0.3 - r*0.4, -r*0.35);
      c.lineTo(i*r*0.3, r*0.55);
    }
    c.lineWidth = 1;
    c.stroke();
    c.globalAlpha = 1;
  }
  // stopka + lístek
  c.lineWidth = kind==='pen' ? 2.2 : 1.6;
  c.beginPath();
  c.moveTo(0,-r*0.85);
  c.quadraticCurveTo(r*0.15 + (jr(seed+3)-0.5)*3, -r*1.25, r*0.3, -r*1.45);
  c.stroke();
  c.beginPath();
  c.ellipse(r*0.55, -r*1.2, r*0.34, r*0.16, -0.5 + (jr(seed+5)-0.5)*0.2, 0, TAU);
  c.stroke();
  if(kind === 'bomb'){
    // šňůrka + jiskra červeně
    c.strokeStyle = '#c1121f';
    c.lineWidth = 1.8;
    c.beginPath();
    c.moveTo(r*0.3,-r*1.45);
    c.quadraticCurveTo(r*0.8,-r*1.8, r*1.05,-r*1.6);
    c.stroke();
    const sx = r*1.05, sy = -r*1.6;
    c.beginPath();
    for(let i=0;i<5;i++){
      const a = i/5*TAU + bp;
      const rr = r*(0.16 + jr(seed+90+i)*0.22);
      c.moveTo(sx,sy);
      c.lineTo(sx+Math.cos(a)*rr, sy+Math.sin(a)*rr);
    }
    c.stroke();
  }
  c.restore();
}

function drawBlots(c){
  const t = nowMs*0.001;
  for(const b of G.blots){
    c.beginPath();
    const n = b.base.length;
    for(let i=0;i<n;i++){
      const a = i/n*TAU;
      // klidná kaňka — jen nepatrné chvění
      const rr = b.r*b.base[i]*(1 + 0.013*Math.sin(t*0.8 + b.ph + i*2.1));
      const x = b.x + Math.cos(a)*rr, y = b.y + Math.sin(a)*rr;
      if(i) c.lineTo(x,y); else c.moveTo(x,y);
    }
    c.closePath();
    c.fillStyle = '#141a3f';
    c.fill();
    c.strokeStyle = 'rgba(8,10,34,0.8)';
    c.lineWidth = 2;
    c.stroke();
    for(const d of b.drops){
      c.beginPath();
      c.arc(b.x+d.dx, b.y+d.dy, d.r, 0, TAU);
      c.fill();
    }
    // matný odlesk
    c.fillStyle = 'rgba(255,255,255,0.05)';
    c.beginPath();
    c.ellipse(b.x-b.r*0.25, b.y-b.r*0.3, b.r*0.35, b.r*0.18, -0.6, 0, TAU);
    c.fill();
  }
}

function drawSnake(c){
  const sn = G.snake;
  if(!sn) return;
  const pts = sn.pts;
  const stunned = sn.haltT > 0;
  // telegraf — zavrtění hlavy
  let wx = 0, wy = 0;
  if(sn.lunge === 'tele'){
    const w = Math.sin(nowMs*0.045)*3.5*S;
    wx = Math.cos(sn.ang+Math.PI/2)*w;
    wy = Math.sin(sn.ang+Math.PI/2)*w;
  }
  // podklad těla
  c.save();
  c.lineJoin = 'round'; c.lineCap = 'round';
  c.strokeStyle = 'rgba(45,73,184,0.13)';
  c.lineWidth = sn.segR*1.9;
  c.beginPath();
  for(let i=0;i<pts.length;i++){
    const px = pts[i].x + (i===0?wx:0), py = pts[i].y + (i===0?wy:0);
    if(i) c.lineTo(px,py); else c.moveTo(px,py);
  }
  c.stroke();
  // články — roztřesené kroužky
  c.strokeStyle = stunned && sn.freezeKind==='boom' ? '#6a79c9' : '#2d49b8';
  c.lineWidth = 1.7;
  const L = pts.length;
  for(let i=L-1;i>=1;i--){
    const taper = i > L-6 ? (L-i)/6 + 0.25 : 1;
    jitterCircle(c, pts[i].x, pts[i].y, sn.segR*0.92*Math.min(taper,1), i*13.7, sn.segR*0.3);
    c.stroke();
  }
  // hlava
  const hx = pts[0].x+wx, hy = pts[0].y+wy;
  c.fillStyle = 'rgba(45,73,184,0.15)';
  jitterCircle(c, hx, hy, sn.segR*1.25, 999, sn.segR*0.32);
  c.fill(); c.stroke();
  // oči
  const ex = Math.cos(sn.ang), ey = Math.sin(sn.ang);
  const px2 = -ey, py2 = ex;
  const eo = sn.segR*0.55, ef = sn.segR*0.45;
  for(const s of [-1,1]){
    const ox = hx + ex*ef + px2*eo*s, oy = hy + ey*ef + py2*eo*s;
    c.beginPath(); c.arc(ox, oy, sn.segR*0.3, 0, TAU);
    c.fillStyle = '#fdfbf1'; c.fill();
    c.strokeStyle = '#2d49b8'; c.stroke();
    c.beginPath();
    if(stunned){
      // omráčené oči — křížky
      const rr = sn.segR*0.16;
      c.moveTo(ox-rr,oy-rr); c.lineTo(ox+rr,oy+rr);
      c.moveTo(ox+rr,oy-rr); c.lineTo(ox-rr,oy+rr);
      c.stroke();
    }else{
      c.arc(ox + ex*sn.segR*0.1, oy + ey*sn.segR*0.1, sn.segR*0.12, 0, TAU);
      c.fillStyle = '#12235e'; c.fill();
    }
  }
  // jazyk
  if(!stunned && (sn.lunge!=='none' || Math.sin(sn.tongue*3)>0.55)){
    const tl = sn.segR*(sn.lunge==='sprint'?1.9:1.3);
    const tx = hx + ex*sn.segR*1.3, ty = hy + ey*sn.segR*1.3;
    c.strokeStyle = '#c1121f'; c.lineWidth = 1.6;
    c.beginPath();
    c.moveTo(tx,ty);
    c.lineTo(tx+ex*tl, ty+ey*tl);
    c.lineTo(tx+ex*tl+(ex*0.5+px2*0.5)*5*S, ty+ey*tl+(ey*0.5+py2*0.5)*5*S);
    c.moveTo(tx+ex*tl, ty+ey*tl);
    c.lineTo(tx+ex*tl+(ex*0.5-px2*0.5)*5*S, ty+ey*tl+(ey*0.5-py2*0.5)*5*S);
    c.stroke();
  }
  // vykřičník při telegrafu
  if(sn.lunge === 'tele'){
    c.fillStyle = '#c1121f';
    c.font = 'bold '+Math.round(22*S)+'px "Chalkboard SE","Comic Sans MS",cursive';
    c.fillText('!', hx + (jr(1)-0.5)*3 - 3*S, hy - sn.segR*2.1);
  }
  // zzz při zvonku
  if(stunned && sn.freezeKind==='bell'){
    c.fillStyle = '#2d49b8';
    c.font = Math.round(15*S)+'px "Chalkboard SE","Comic Sans MS",cursive';
    c.fillText('zzz', hx + sn.segR, hy - sn.segR*1.8);
  }
  c.restore();
}

function drawPlayer(c){

function drawQmark(c){
  const q = G.qmark;
  if(!q) return;
  let alpha = 1;
  if(q.age < 0.4) alpha = q.age/0.4;

function squiggleUnderline(c,x1,x2,y,seed){
  c.beginPath();
  const n = Math.max(3, Math.floor((x2-x1)/14));
  for(let i=0;i<=n;i++){
    const x = lerp(x1,x2,i/n);
    const yy = y + (jr(seed+i*3.1)-0.5)*4;
    if(i) c.lineTo(x,yy); else c.moveTo(x,yy);
  }
  c.stroke();
}

function drawPencilIcon(c,x,y,r,cd,cdMax){
  c.save();
  // kroužek průběhu
  c.strokeStyle = 'rgba(139,139,147,0.4)';
  c.lineWidth = 3;
  c.beginPath(); c.arc(x,y,r,0,TAU); c.stroke();
  const ready = cd<=0;
  if(!ready){
    c.strokeStyle = '#c1121f';
    c.beginPath();
    c.arc(x,y,r,-Math.PI/2, -Math.PI/2 + TAU*(1-cd/cdMax));
    c.stroke();
  }else{
    c.strokeStyle = '#c1121f';
    c.beginPath(); c.arc(x,y,r,0,TAU); c.stroke();
  }
  // tužka
  const sh = G.shakePencil>0 ? Math.sin(nowMs*0.08)*2 : 0;
  c.translate(x+sh, y);
  c.rotate(-0.7);
  c.globalAlpha = ready ? 1 : 0.45;
  c.strokeStyle = '#55555c';
  c.lineWidth = 2;
  const L2 = r*0.95;
  c.strokeRect(-L2*0.35, -L2, L2*0.7, L2*1.4);
  c.beginPath();
  c.moveTo(-L2*0.35, L2*0.4);
  c.lineTo(0, L2);
  c.lineTo(L2*0.35, L2*0.4);
  c.stroke();
  c.beginPath();
  c.moveTo(-L2*0.12, L2*0.7); c.lineTo(0, L2); c.lineTo(L2*0.12, L2*0.7);
  c.closePath();
  c.fillStyle = '#55555c';
  c.fill();
  c.restore();
}

function drawHud(c){
  c.save();

  c.strokeStyle = '#c1121f';
  c.textAlign = 'right';

function drawLabels(c){

function gradeFor(t){
  if(t < 15)  return ['5', 'Sedni si. Pět. A řekni rodičům, ať se zítra staví.'];
  if(t < 30)  return ['4', 'Čtyřka. Hadovi jsi aspoň zvedl sebevědomí.'];
  if(t < 60)  return ['3', 'Trojka. Průměr. Jako celá tahle třída.'];
  if(t < 120) return ['2', 'Dvojka. No vida, ono to jde, když se chce.'];
  if(t < 210) return ['1', 'Jednička. Kdo ti napovídal? Přiznej se.'];
  if(t < 330) return ['1★', 'Jednička s hvězdičkou! Tohle si vystavím na nástěnku.'];
  return ['POCHVALA ŘEDITELE', 'Sborovna oněměla. Ředitel pláče do třídnice. Legendo.'];
}

  c.fillStyle = '#55555c';
  c.font = fontHand(fs2+2, true);
  c.fillText('TAHÁK (neukazovat učiteli!)', lx, ly);
  c.font = fontHand(fs2);
  ly += fs2*1.7;
  c.fillText('✎ Klik/ťuk = nakreslíš falešné jablko. Had mu skočí na špek.', lx, ly);
  ly += fs2*1.5;
  c.fillText('? = náhodná trefa: GUMA smaže hada, ZVONEK ho zastaví,', lx, ly);
  ly += fs2*1.5;
  c.fillText('    BOMBA nabije tvé příští jablko, KAŇKA přidá louži.', lx, ly);
  ly += fs2*1.5;
  c.fillText('Kaňky brzdí JEN tebe. Had po nich klouže dál.', lx, ly);
  ly += fs2*1.7;
  c.fillStyle = '#c1121f';
  c.fillText('Známky: 15 s → 5 | 30 s → 4 | 60 s → 3 | 120 s → 2', lx, ly);
  ly += fs2*1.5;
  c.fillText('210 s → 1 | 330 s → 1★ | víc → POCHVALA ŘEDITELE', lx, ly);
  ly += fs2*1.6;
  c.fillStyle = '#55555c';
  c.font = 'italic '+fontHand(fs2);
  c.fillText('„Pochvalu ředitele prý ještě nikdo živý nedostal."', lx, ly);
  c.restore();

  // start
  c.textAlign = 'center';
  c.fillStyle = '#c1121f';
  c.globalAlpha = 0.6 + 0.4*Math.sin(nowMs*0.004);
  c.font = fontHand(clamp(22*S,16,26), true);
  c.fillText('Klikni, ťukni nebo zmáčkni MEZERNÍK', cx, tyc + th/2 + 40);
  c.globalAlpha = 1;

  if(G.best > 0){
    c.fillStyle = '#2d49b8';
    c.font = fontHand(clamp(17*S,13,19));
    c.fillText('Rekord: '+Math.floor(G.best)+' s', cx, tyc + th/2 + 70);
  }
  c.restore();
}

function drawOver(c){
  const cx = W/2;
  c.save();
  // ztlumit hřiště
  c.fillStyle = 'rgba(253,251,241,0.75)';
  c.fillRect(0,0,W,H);
  c.textAlign = 'center';

  const [g, comment] = gradeFor(G.t);
  const long = g.length > 3;

  c.fillStyle = '#55555c';
  c.font = fontHand(clamp(24*S,17,28));
  c.fillText('CHRAMST! Had tě dostal.', cx, H*0.2);

  const gy = H*0.42;
  c.fillStyle = '#c1121f';
  c.font = fontHand(long ? clamp(Math.min(W/14, 42), 22, 42) : clamp(110*S, 70, 120), true);
  const jgx = (jr(700)-0.5)*4;
  c.fillText(g, cx+jgx, gy);
  // červený kroužek kolem známky
  const gw = c.measureText(g).width;
  c.strokeStyle = '#c1121f';
  c.lineWidth = 3;
  c.beginPath();
  const rx = Math.max(gw*0.72, 60), ry = long ? 46 : clamp(78*S,55,85);
  for(let i=0;i<=22;i++){
    const a = i/22*TAU;
    const rr = 1 + (jr(710+i*3.7)-0.5)*0.09;
    const x = cx + Math.cos(a)*rx*rr;
    const y = gy - (long?14:30) + Math.sin(a)*ry*rr;
    if(i) c.lineTo(x,y); else c.moveTo(x,y);
  }
  c.stroke();

  c.fillStyle = '#c1121f';
  c.font = 'italic '+fontHand(clamp(19*S,14,22));
  wrapText(c, comment, cx, gy + (long?70:clamp(95*S,70,105)), Math.min(W-60, 620), clamp(24*S,19,27));

  c.fillStyle = '#2d49b8';
  c.font = fontHand(clamp(20*S,15,23));
  c.fillText('Přežil jsi '+G.t.toFixed(1)+' s', cx, H*0.76);
  if(G.newBest){
    c.fillStyle = '#c1121f';
    c.font = fontHand(clamp(20*S,15,23), true);
    c.globalAlpha = 0.6 + 0.4*Math.sin(nowMs*0.008);
    c.fillText('NOVÝ REKORD!', cx, H*0.76 + 30);
    c.globalAlpha = 1;
  }else if(G.best > 0){
    c.fillStyle = '#55555c';
    c.font = fontHand(clamp(16*S,12,18));
    c.fillText('Rekord: '+Math.floor(G.best)+' s', cx, H*0.76 + 28);
  }

  if(nowMs - G.diedAt > 600){
    c.fillStyle = '#c1121f';
    c.globalAlpha = 0.6 + 0.4*Math.sin(nowMs*0.004);
    c.font = fontHand(clamp(19*S,14,22), true);
    c.fillText('Klikni nebo zmáčkni MEZERNÍK — oprava známky', cx, H*0.9);
    c.globalAlpha = 1;
  }
  c.restore();
}

function wrapText(c, text, x, y, maxW, lh){
  const words = text.split(' ');
  let line = '';
  for(const w of words){
    const test = line ? line+' '+w : w;
    if(c.measureText(test).width > maxW && line){
      c.fillText(line, x, y);
      y += lh;
      line = w;
    }else line = test;
  }
  if(line) c.fillText(line, x, y);
}

function drawPause(c){
  c.save();
  c.fillStyle = 'rgba(253,251,241,0.82)';
  c.fillRect(0,0,W,H);
  c.textAlign = 'center';
  c.fillStyle = '#c1121f';
  c.font = fontHand(clamp(46*S,30,52), true);
  c.fillText('PŘESTÁVKA', W/2, H*0.42);
  c.fillStyle = '#55555c';
  c.font = fontHand(clamp(19*S,14,22));
  c.fillText('Sešit se zavřel (okno ztratilo pozornost).', W/2, H*0.42+40);
  c.fillStyle = '#c1121f';
  c.globalAlpha = 0.6 + 0.4*Math.sin(nowMs*0.004);
  c.font = fontHand(clamp(20*S,15,24), true);
  c.fillText('Klikni nebo zmáčkni MEZERNÍK pro pokračování', W/2, H*0.42+86);
  c.restore();
}

// ------------------------------------------------------------------
// Hlavní render
// ------------------------------------------------------------------
function render(){
  if(paper) ctx.drawImage(paper, 0, 0, W, H);
  else { ctx.fillStyle = '#fdfbf1'; ctx.fillRect(0,0,W,H); }

  if(G.state === 'menu'){
    drawMenu(ctx);
    return;
  }

  drawBlots(ctx);
  for(const a of G.apples){
    drawApple(ctx, a.x, a.y, 15*S, a.tilt, a.bomb?'bomb':'pencil', 11 + a.x*0.13 + a.y*0.07);
  }
  drawQmark(ctx);
  drawSnake(ctx);
  drawPlayer(ctx);
  drawLabels(ctx);
  drawHud(ctx);

  if(G.state === 'pause') drawPause(ctx);
  if(G.state === 'over') drawOver(ctx);
}

// ------------------------------------------------------------------
// Smyčka
// ------------------------------------------------------------------
let lastT = 0;
function frame(ts){
  nowMs = ts;
  bp = Math.floor(ts/130)%3;
  let dt = (ts - lastT)/1000;
  lastT = ts;
  if(dt > 0.05) dt = 0.05;
  if(dt > 0) update(dt);
  render();
  requestAnimationFrame(frame);
}

// ------------------------------------------------------------------
// Vstup
// ------------------------------------------------------------------
function primaryAction(x,y){
  ensureAudio();
  if(G.state === 'menu'){ startGame(); return; }
  if(G.state === 'pause'){ G.state = 'play'; return; }
  if(G.state === 'over'){
    if(nowMs - G.diedAt > 600) startGame();
    return;
  }
  if(G.state === 'play' && x !== undefined) tryDrawApple(x,y);
}

cvs.addEventListener('mousemove', function(e){
  G.target.x = e.clientX; G.target.y = e.clientY;
  G.usingKeys = false;
});
cvs.addEventListener('mousedown', function(e){
  e.preventDefault();
  G.target.x = e.clientX; G.target.y = e.clientY;
  primaryAction(e.clientX, e.clientY);
});

let touchStart = null;
cvs.addEventListener('touchstart', function(e){
  e.preventDefault();
  ensureAudio();
  const t = e.changedTouches[0];
  touchStart = {x:t.clientX, y:t.clientY, t:performance.now()};
  if(G.state !== 'play'){ primaryAction(); return; }
  G.target.x = t.clientX; G.target.y = t.clientY;
  G.usingKeys = false;
}, {passive:false});
cvs.addEventListener('touchmove', function(e){
  e.preventDefault();
  const t = e.changedTouches[0];
  if(G.state === 'play'){
    G.target.x = t.clientX; G.target.y = t.clientY;
    G.usingKeys = false;
  }
  if(touchStart && dist(t.clientX,t.clientY,touchStart.x,touchStart.y) > 16) touchStart = null;
}, {passive:false});
cvs.addEventListener('touchend', function(e){
  e.preventDefault();
  if(touchStart && G.state === 'play'){
    const t = e.changedTouches[0];
    if(performance.now() - touchStart.t < 260 && dist(t.clientX,t.clientY,touchStart.x,touchStart.y) < 16){
      tryDrawApple(t.clientX, t.clientY);
    }
  }
  touchStart = null;
}, {passive:false});

const KEYMAP = {
  ArrowLeft:'left', KeyA:'left',
  ArrowRight:'right', KeyD:'right',
  ArrowUp:'up', KeyW:'up',
  ArrowDown:'down', KeyS:'down'
};
window.addEventListener('keydown', function(e){
  if(e.code === 'Space' || e.code === 'Enter'){
    e.preventDefault();
    ensureAudio();
    if(G.state !== 'play') primaryAction();
    return;
  }
  const k = KEYMAP[e.code];
  if(k){
    e.preventDefault();
    ensureAudio();
    G.keys[k] = true;
    G.usingKeys = true;
  }
});
window.addEventListener('keyup', function(e){
  const k = KEYMAP[e.code];
  if(k) G.keys[k] = false;
});

function pauseGame(){
  if(G.state === 'play'){
    G.state = 'pause';
    G.keys = {};
  }
}
window.addEventListener('blur', pauseGame);
document.addEventListener('visibilitychange', function(){
  if(document.hidden) pauseGame();
});

// ------------------------------------------------------------------
// Velikost okna
// ------------------------------------------------------------------
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = Math.max(320, window.innerWidth);
  H = Math.max(320, window.innerHeight);
  cvs.width = Math.floor(W*DPR);
  cvs.height = Math.floor(H*DPR);
  cvs.style.width = W+'px';
  cvs.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const oldS = S;
  S = clamp(Math.min(W,H)/780, 0.62, 1.35);
  renderPaper();
  // udrž objekty ve hřišti
  const p = G.player;
  p.r = 16*S;
  p.x = clamp(p.x, 30, W-30);
  p.y = clamp(p.y, 30, H-30);
  G.target.x = clamp(G.target.x, 0, W);
  G.target.y = clamp(G.target.y, 0, H);
  if(G.snake){
    G.snake.segR = 13*S;
    for(const s of G.snake.pts){
      s.x = clamp(s.x, 10, W-10);
      s.y = clamp(s.y, 10, H-10);
    }
  }
  for(const a of G.apples){ a.x = clamp(a.x, 40, W-40); a.y = clamp(a.y, 40, H-40); }
  for(const b of G.blots){ b.x = clamp(b.x, b.r, W-b.r); b.y = clamp(b.y, b.r, H-b.r); }
  if(G.qmark){ G.qmark.x = clamp(G.qmark.x, 60, W-60); G.qmark.y = clamp(G.qmark.y, 60, H-60); }
  void oldS;
}
window.addEventListener('resize', resize);

// ladicí háček (neškodný, pomáhá testům)
window.__svacina = {
  G,
  start: startGame,
  warp: function(s){ if(G.state==='play'){ G.t += s; G.snake.nextLungeAt = Math.min(G.snake.nextLungeAt, G.t + 2); G.qNextAt = Math.min(G.qNextAt, G.t+2); } },
  step: function(dt, n){ n = n||1; for(let i=0;i<n && G.state==='play';i++) update(dt); },
  size: function(){ return {W:W, H:H, S:S}; },
  draw: tryDrawApple
};

resize();
requestAnimationFrame(frame);
})();
</script>
