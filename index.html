<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>SVAČINA</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#fbf7ec;}
  canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:crosshair;
    -webkit-user-select:none;user-select:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
"use strict";

// ===================== základ =====================
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const TAU = Math.PI * 2;
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp = (a,b,t) => a + (b-a) * t;
const rnd = (a,b) => a + Math.random() * (b-a);
const hyp = Math.hypot;
function angDiff(a,b){ let d = (b-a) % TAU; if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU; return d; }
function jit(seed,i,ph,amp){ const s = Math.sin(seed*127.1 + i*269.5 + ph*97.73) * 43758.5453; return (s - Math.floor(s) - 0.5) * 2 * amp; }

const FONT = '"Segoe Print","Bradley Hand","Chalkboard SE","Comic Sans MS",cursive';
const RED = '#c02828', BLUE = '#2843ae', PENCIL = '#82889a', INK = '#1c2152', PAPER = '#fbf7ec';

let W = 0, H = 0, DPR = 1, SCL = 1, boil = 0, now = 0;

const C = {
  pR: 13, headR: 12.5, segR: 9.5, segSp: 13,
  pAcc: 820, pDrag: 3.4,      // max rychlost jablka ~241*SCL px/s
  grace: 2,
  fakeR: 11, qR: 24,
};

// ===================== zvuk =====================
const AU = {
  ctx: null, nbuf: null,
  init(){
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(()=>{}); return; }
    try {
      const A = window.AudioContext || window.webkitAudioContext;
      if (!A) return;
      this.ctx = new A();
      const len = this.ctx.sampleRate | 0;
      this.nbuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.nbuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      if (this.ctx.state === 'suspended') this.ctx.resume().catch(()=>{});
    } catch (e) { this.ctx = null; }
  },
  beep(f0,f1,dur,type,vol,at){
    if (!this.ctx) return;
    try {
      const t0 = this.ctx.currentTime + (at || 0);
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(Math.max(f0,1), t0);
      if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(f1,1), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(vol || 0.15, t0 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(t0); o.stop(t0 + dur + 0.05);
    } catch (e) {}
  },
  noise(dur,freq,q,vol,slideTo,at){
    if (!this.ctx || !this.nbuf) return;
    try {
      const t0 = this.ctx.currentTime + (at || 0);
      const src = this.ctx.createBufferSource(); src.buffer = this.nbuf; src.loop = true;
      const f = this.ctx.createBiquadFilter(); f.type = 'bandpass';
      f.frequency.setValueAtTime(freq, t0);
      if (slideTo) f.frequency.exponentialRampToValueAtTime(Math.max(slideTo,1), t0 + dur);
      f.Q.value = q || 1;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(vol || 0.2, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(f); f.connect(g); g.connect(this.ctx.destination);
      src.start(t0, Math.random() * 0.5); src.stop(t0 + dur + 0.05);
    } catch (e) {}
  }
};
const sfxPencil = () => { AU.noise(0.20, 2400, 2.5, 0.22, 800); };
const sfxChomp  = () => { AU.beep(180, 65, 0.13, 'square', 0.14); AU.noise(0.08, 900, 1, 0.12); };
const sfxGuma   = () => { AU.noise(0.38, 750, 1.4, 0.26, 260); };
const sfxBell   = () => { AU.beep(1568, 1560, 0.9, 'sine', 0.13); AU.beep(2093, 2080, 0.7, 'sine', 0.08, 0.03); };
const sfxBombGet= () => { AU.beep(320, 680, 0.16, 'triangle', 0.14); AU.noise(0.28, 3600, 3, 0.09, 0, 0.05); };
const sfxBoom   = () => { AU.beep(130, 34, 0.5, 'sawtooth', 0.24); AU.noise(0.42, 260, 0.7, 0.28, 70); };
const sfxBlot   = () => { AU.beep(290, 85, 0.28, 'sine', 0.17); };
const sfxWarn   = () => { for (let i = 0; i < 5; i++) AU.beep(210 + (i%2)*75, 0, 0.05, 'square', 0.06, i*0.07); };
const sfxCrunch = () => { AU.noise(0.32, 950, 0.8, 0.3, 140); AU.beep(150, 55, 0.26, 'triangle', 0.2); };
const sfxStart  = () => { AU.beep(520, 940, 0.14, 'triangle', 0.1); };
const sfxQ      = () => { AU.beep(720, 1050, 0.1, 'sine', 0.09); };

// ===================== stav hry =====================
function loadBest(){ try { const v = parseFloat(localStorage.getItem('svacina_best')); return isFinite(v) && v > 0 ? v : 0; } catch (e) { return 0; } }
function saveBest(v){ try { localStorage.setItem('svacina_best', String(v)); } catch (e) {} }

const G = {
  state: 'menu',       // menu | play | pause | dying | over
  time: 0, grace: 0, dieT: 0, overT: 0,
  cool: 0, coolMax: 4.5, coolShake: 0,
  bomb: 0, best: loadBest(), newBest: false,
  qTimer: 0, fakeTimer: -1, hintT: 0, round: 0,
};
const P = { x: 0, y: 0, vx: 0, vy: 0, rot: 0, r: 13, slow: false };
const S = {
  x: 0, y: 0, heading: 0, count: 9, path: [], segs: [],
  mode: 'idle', modeT: 0, lungeT: 10, stun: 0, stunKind: '',
  orbit: 0, brake: 0, shake: 0, seed: 5,
};
const fakes = [];      // {x,y,auto,bomb,seed,born}
const questions = [];  // {x,y,age,life,seed}
const blots = [];      // {x,y,r,pr[],drops[],seed}
const parts = [];      // {x,y,vx,vy,age,life,color,r}
const texts = [];      // {x,y,txt,age,life,color,size}
const M = { x: 0, y: 0 };
const keys = new Set();

// ===================== papír (pozadí) =====================
let paper = null;
function buildPaper(){
  paper = document.createElement('canvas');
  paper.width = Math.max(1, Math.round(W * DPR));
  paper.height = Math.max(1, Math.round(H * DPR));
  const p = paper.getContext('2d');
  p.scale(DPR, DPR);
  p.fillStyle = PAPER; p.fillRect(0, 0, W, H);
  const g = 30;
  p.strokeStyle = 'rgba(115,155,200,0.30)'; p.lineWidth = 1;
  p.beginPath();
  for (let x = g; x < W; x += g) { p.moveTo(x + .5, 0); p.lineTo(x + .5, H); }
  for (let y = g; y < H; y += g) { p.moveTo(0, y + .5); p.lineTo(W, y + .5); }
  p.stroke();
  // okraj stránky
  const mx = Math.min(64, Math.round(W * 0.085));
  p.strokeStyle = 'rgba(214,80,80,0.5)'; p.lineWidth = 1.6;
  p.beginPath(); p.moveTo(mx + .5, 0); p.lineTo(mx + .5, H); p.stroke();
  // ohmataná hrana + kávové kolečko
  p.fillStyle = 'rgba(120,100,60,0.05)';
  p.fillRect(W - 9, 0, 9, H); p.fillRect(0, H - 7, W, 7);
  p.strokeStyle = 'rgba(150,110,60,0.10)'; p.lineWidth = 7;
  p.beginPath(); p.arc(W - 88, H - 76, 33, 0, TAU); p.stroke();
}

// dekorace okrajů — kreslené každý frame (boiling)
function drawDecor(){
  const ph = boil;
  ctx.save();
  ctx.globalAlpha = 0.55;
  if (W > 660) { // piškvorky vpravo nahoře
    const bx = W - 128, by = 20, s = 26;
    ctx.strokeStyle = PENCIL; ctx.lineWidth = 1.4;
    ctx.beginPath();
    for (let i = 1; i < 3; i++) {
      ctx.moveTo(bx + i*s + jit(31,i,ph,1.2), by); ctx.lineTo(bx + i*s + jit(32,i,ph,1.2), by + 3*s);
      ctx.moveTo(bx, by + i*s + jit(33,i,ph,1.2)); ctx.lineTo(bx + 3*s, by + i*s + jit(34,i,ph,1.2));
    }
    ctx.stroke();
    ctx.font = `bold 19px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const marks = [['x',0,0],['o',1,1],['x',2,2],['o',0,2],['x',2,0],['o',1,0]];
    for (let i = 0; i < marks.length; i++) {
      const m = marks[i];
      ctx.fillStyle = m[0] === 'x' ? PENCIL : 'rgba(40,67,174,0.6)';
      ctx.fillText(m[0], bx + m[1]*s + s/2 + jit(35,i,ph,1), by + m[2]*s + s/2 + jit(36,i,ph,1));
    }
  }
  if (H > 560) { // srdíčko vlevo dole
    const hx0 = 26, hy0 = H - 64;
    ctx.strokeStyle = 'rgba(192,40,40,0.6)'; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(hx0 + jit(41,0,ph,1), hy0 + 6);
    ctx.bezierCurveTo(hx0 - 12, hy0 - 8, hx0 - 2 + jit(42,1,ph,1), hy0 - 16, hx0, hy0 - 6);
    ctx.bezierCurveTo(hx0 + 2, hy0 - 16, hx0 + 12 + jit(43,2,ph,1), hy0 - 8, hx0, hy0 + 6);
    ctx.stroke();
    ctx.fillStyle = 'rgba(192,40,40,0.55)'; ctx.font = `13px ${FONT}`;
    ctx.textAlign = 'left';
    ctx.fillText('M + ?', hx0 + 18, hy0 - 6 + jit(44,3,ph,0.8));
  }
  if (W > 520) { // škrtnuté slovíčko vpravo dole
    const wx = W - 165, wy = H - 40;
    ctx.fillStyle = PENCIL; ctx.font = `14px ${FONT}`; ctx.textAlign = 'left';
    ctx.fillText('die Schlange', wx, wy + jit(45,1,ph,0.7));
    ctx.strokeStyle = PENCIL; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(wx - 3, wy + jit(46,2,ph,1)); ctx.lineTo(wx + 92, wy - 2 + jit(47,3,ph,1)); ctx.stroke();
    ctx.fillStyle = 'rgba(192,40,40,0.7)';
    ctx.fillText('HAD!!!', wx + 100, wy + jit(48,4,ph,0.8));
  }
  ctx.restore();
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

// ===================== čmárací pomocníci =====================
function wob(cx,cy,r,seed,amp,pts){
  pts = pts || 12;
  ctx.beginPath();
  for (let i = 0; i <= pts; i++) {
    const k = i % pts, a = i / pts * TAU;
    const rr = r + jit(seed, k, boil, amp);
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
  }
  ctx.closePath();
}
function wobEllipse(cx,cy,rx,ry,seed,amp,pts){
  pts = pts || 18;
  ctx.beginPath();
  for (let i = 0; i <= pts; i++) {
    const k = i % pts, a = i / pts * TAU;
    const jx = jit(seed, k, boil, amp), jy = jit(seed + 3, k, boil, amp);
    const x = cx + Math.cos(a) * (rx + jx), y = cy + Math.sin(a) * (ry + jy);
    if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
  }
  ctx.closePath();
}
function wavyLine(x0,y0,x1,y1,seed,amp,segs){
  segs = segs || 8;
  ctx.beginPath();
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const x = lerp(x0,x1,t) + (i && i < segs ? jit(seed,i,boil,amp) : 0);
    const y = lerp(y0,y1,t) + (i && i < segs ? jit(seed+9,i,boil,amp) : 0);
    if (i) ctx.lineTo(x,y); else ctx.moveTo(x,y);
  }
}

// ===================== rozměry =====================
function resize(){
  W = Math.max(1, window.innerWidth);
  H = Math.max(1, window.innerHeight);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  SCL = clamp(Math.min(W, H) / 760, 0.72, 1.1);
  P.r = C.pR * SCL;
  buildPaper();
  // po změně velikosti zarovnej objekty zpět do plochy
  P.x = clamp(P.x, P.r, W - P.r); P.y = clamp(P.y, P.r, H - P.r);
  S.x = clamp(S.x, 16, W - 16); S.y = clamp(S.y, 16, H - 16);
  for (const f of fakes) { f.x = clamp(f.x, 20, W - 20); f.y = clamp(f.y, 20, H - 20); }
  for (const q of questions) { q.x = clamp(q.x, 40, W - 40); q.y = clamp(q.y, 40, H - 40); }
  for (const b of blots) { b.x = clamp(b.x, b.r + 20, W - b.r - 20); b.y = clamp(b.y, b.r + 20, H - b.r - 20); }
  if (M.x === 0 && M.y === 0) { M.x = W/2; M.y = H/2; }
}

// ===================== kaňky =====================
function makeBlot(x,y,r){
  const pr = [], n = 18;
  for (let i = 0; i < n; i++) pr.push(rnd(0.82, 1.14));
  const drops = [];
  const dn = 2 + (Math.random() * 2 | 0);
  for (let i = 0; i < dn; i++) {
    const a = rnd(0, TAU), d = r * rnd(1.1, 1.45);
    drops.push({ dx: Math.cos(a)*d, dy: Math.sin(a)*d, r: rnd(2.5, 6) * SCL });
  }
  return { x, y, r, pr, drops, seed: rnd(1, 999) };
}
function placeBlot(marginMul, protectCenter){
  for (let t = 0; t < 260; t++) {
    const r = rnd(42, 64) * SCL;
    const m = 105 * SCL * marginMul + r;
    if (W - 2*m < 40 || H - 2*m < 40) continue;
    const x = rnd(m, W - m), y = rnd(m, H - m);
    if (protectCenter && hyp(x - W/2, y - H/2) < 190 * SCL) continue;   // spawn hráče
    if (hyp(x - S.x, y - S.y) < 170 * SCL) continue;                     // u hada ne
    if (hyp(x - P.x, y - P.y) < 170 * SCL) continue;
    let ok = true;
    for (const b of blots) if (hyp(x - b.x, y - b.y) < b.r + r + 165 * SCL) { ok = false; break; }
    if (ok) return makeBlot(x, y, r);
  }
  return null;
}
function makeBlots(){
  blots.length = 0;
  const small = Math.min(W, H) < 560 || W * H < 430000;
  const n = small ? 2 : (Math.random() < 0.45 ? 5 : 4);
  for (let i = 0; i < n; i++) {
    const b = placeBlot(1, true);
    if (b) blots.push(b);
  }
}
function addBlot(){
  const b = placeBlot(0.7, false);
  if (b) blots.push(b);
  return !!b;
}
function inBlot(x,y){
  for (const b of blots) if (hyp(x - b.x, y - b.y) < b.r * 0.95) return true;
  return false;
}

// ===================== falešná jablka a otazníky =====================
function spawnAutoFake(){
  for (let t = 0; t < 200; t++) {
    const x = rnd(50, W - 50), y = rnd(50, H - 50);
    if (hyp(x - S.x, y - S.y) < 260 * SCL) continue;
    if (hyp(x - P.x, y - P.y) < 90 * SCL) continue;
    fakes.push({ x, y, auto: true, bomb: false, seed: rnd(1, 999), born: now });
    sfxPencil();
    return;
  }
  fakes.push({ x: rnd(60, W - 60), y: rnd(60, H - 60), auto: true, bomb: false, seed: rnd(1, 999), born: now });
}
function tryDrawFake(x,y){
  if (G.cool > 0) { G.coolShake = 0.35; return; }
  const f = { x: clamp(x, 22, W - 22), y: clamp(y, 22, H - 22), auto: false, bomb: G.bomb > 0, seed: rnd(1, 999), born: now };
  if (f.bomb) G.bomb = 0;
  fakes.push(f);
  G.cool = G.coolMax;
  sfxPencil();
  for (let i = 0; i < 6; i++) parts.push({ x: f.x, y: f.y, vx: rnd(-40, 40), vy: rnd(-50, 10), age: 0, life: 0.5, color: PENCIL, r: rnd(1, 2.4) });
}
function spawnQuestion(){
  for (let t = 0; t < 200; t++) {
    const x = rnd(70, W - 70), y = rnd(70, H - 70);
    if (hyp(x - S.x, y - S.y) < 210 * SCL) continue;
    if (hyp(x - P.x, y - P.y) < 110 * SCL) continue;
    questions.push({ x, y, age: 0, life: 9, seed: rnd(1, 999) });
    sfxQ();
    return;
  }
}
function addText(x,y,txt,color,size){
  texts.push({ x, y, txt, age: 0, life: 1.5, color: color || RED, size: size || 21 });
}
function applyQuestion(q){
  let r = Math.random(), eff;
  if (r < 0.26) eff = 'guma';
  else if (r < 0.52) eff = 'zvonek';
  else if (r < 0.78) eff = 'bomba';
  else eff = 'kanka';
  if (eff === 'bomba' && G.bomb > 0) eff = Math.random() < 0.5 ? 'guma' : 'zvonek';
  if (eff === 'kanka' && !addBlot()) eff = 'guma';
  switch (eff) {
    case 'guma': {
      const tail = S.segs[S.segs.length - 1] || S;
      S.count = Math.max(5, S.count - 5);
      for (let i = 0; i < 10; i++) parts.push({ x: tail.x, y: tail.y, vx: rnd(-60, 60), vy: rnd(-60, 60), age: 0, life: 0.6, color: '#b9bdc9', r: rnd(1.5, 3.5) });
      addText(q.x, q.y - 26 * SCL, 'GUMA!'); sfxGuma(); break;
    }
    case 'zvonek':
      S.stun = Math.max(S.stun, 2); S.stunKind = 'bell'; S.mode = 'idle'; S.shake = 0;
      addText(q.x, q.y - 26 * SCL, 'PŘESTÁVKA!'); sfxBell(); break;
    case 'bomba':
      G.bomb = 1;
      addText(q.x, q.y - 26 * SCL, 'BOMBOVÉ JABLKO!'); sfxBombGet(); break;
    case 'kanka':
      addText(q.x, q.y - 26 * SCL, 'NOVÁ KAŇKA!'); sfxBlot(); break;
  }
}

// ===================== kolo =====================
function startRound(){
  G.state = 'play'; G.time = 0; G.grace = C.grace; G.dieT = 0; G.overT = 0;
  G.cool = 0; G.coolShake = 0; G.bomb = 0; G.newBest = false;
  G.qTimer = rnd(4.5, 7); G.fakeTimer = -1;
  G.round++;
  G.hintT = G.round === 1 ? 9 : 0;
  parts.length = 0; texts.length = 0; fakes.length = 0; questions.length = 0;
  P.x = W / 2; P.y = H / 2; P.vx = 0; P.vy = 0; P.rot = 0; P.r = C.pR * SCL;
  M.x = W / 2; M.y = H / 2;
  // had do rohu
  S.x = W - 70; S.y = 70;
  S.heading = Math.atan2(H/2 - S.y, W/2 - S.x);
  S.count = 9; S.stun = 0; S.stunKind = '';
  S.mode = 'idle'; S.modeT = 0; S.lungeT = rnd(8, 14);
  S.orbit = 0; S.brake = 0; S.shake = 0;
  S.path = [{ x: S.x, y: S.y }];
  const back = S.heading + Math.PI;
  const need = Math.ceil((S.count + 3) * C.segSp * SCL / 4) + 8;
  for (let i = 1; i <= need; i++)
    S.path.push({ x: S.x + Math.cos(back) * i * 4, y: S.y + Math.sin(back) * i * 4 });
  makeBlots();
  computeSegs();
  spawnAutoFake();
  sfxStart();
}
function pauseGame(){ if (G.state === 'play') G.state = 'pause'; }
function resumeGame(){ if (G.state === 'pause') { G.state = 'play'; G.grace = Math.max(G.grace, 1); } }
function die(){
  G.state = 'dying'; G.dieT = 0;
  if (G.time > G.best) { G.best = G.time; G.newBest = true; saveBest(G.time); }
  sfxCrunch();
  for (let i = 0; i < 16; i++)
    parts.push({ x: P.x, y: P.y, vx: rnd(-130, 130), vy: rnd(-130, 130), age: 0, life: 0.8, color: RED, r: rnd(1.5, 4) * SCL });
}
function gradeOf(t){
  if (t < 15)  return { mark: '5',  txt: 'Sedni si. A zítra ať přijdou rodiče.' };
  if (t < 30)  return { mark: '4',  txt: 'Had se ani nezadýchal. V úterý doučování.' };
  if (t < 60)  return { mark: '3',  txt: 'Průměr. Přesně jako tvoje pololetí.' };
  if (t < 120) return { mark: '2',  txt: 'No vida, ono to jde, když se snažíš!' };
  if (t < 210) return { mark: '1',  txt: 'Výborně! Kdybys takhle sprintoval i na tělocviku…' };
  if (t < 330) return { mark: '1*', txt: 'Jednička s hvězdičkou! Tohle si vystavím na nástěnku.' };
  return { mark: 'POCHVALA ŘEDITELE ŠKOLY', txt: 'Ředitel ti jde potřást rukou. Had si podal výpověď.' };
}

// ===================== update =====================
function keyDir(){
  let x = 0, y = 0;
  if (keys.has('arrowleft') || keys.has('a')) x -= 1;
  if (keys.has('arrowright') || keys.has('d')) x += 1;
  if (keys.has('arrowup') || keys.has('w')) y -= 1;
  if (keys.has('arrowdown') || keys.has('s')) y += 1;
  if (!x && !y) return null;
  const l = hyp(x, y);
  return { x: x / l, y: y / l };
}

function updatePlayer(dt){
  const kd = keyDir();
  const acc = C.pAcc * SCL;
  let ax = 0, ay = 0;
  if (kd) { ax = kd.x * acc; ay = kd.y * acc; }
  else {
    const dx = M.x - P.x, dy = M.y - P.y, d = hyp(dx, dy);
    if (d > 3) {
      const f = acc * clamp(d / (80 * SCL), 0.15, 1);
      ax = dx / d * f; ay = dy / d * f;
    }
  }
  let drag = C.pDrag, am = 1;
  P.slow = inBlot(P.x, P.y);
  if (P.slow) { am = 0.55; drag *= 1.45; }
  P.vx += (ax * am - P.vx * drag) * dt;
  P.vy += (ay * am - P.vy * drag) * dt;
  P.x += P.vx * dt; P.y += P.vy * dt;
  if (P.x < P.r) { P.x = P.r; P.vx = Math.max(P.vx, 0); }
  if (P.x > W - P.r) { P.x = W - P.r; P.vx = Math.min(P.vx, 0); }
  if (P.y < P.r) { P.y = P.r; P.vy = Math.max(P.vy, 0); }
  if (P.y > H - P.r) { P.y = H - P.r; P.vy = Math.min(P.vy, 0); }
  P.rot += (P.vx + P.vy * 0.35) * dt / P.r;
}

function snakeSpeed(t){
  return (140 + 105 * Math.pow(Math.min(t / 60, 1), 0.9) + 0.16 * Math.max(0, t - 60)) * SCL;
}
function nextLungeIn(t){
  const base = lerp(10.5, 3.2, Math.min(t / 260, 1));
  return base * rnd(0.75, 1.25);
}

function computeSegs(){
  const sp = C.segSp * SCL;
  const out = [{ x: S.x, y: S.y }];
  let remain = sp;
  let prev = S.path[0];
  for (let i = 1; i < S.path.length && out.length < S.count; i++) {
    let p = S.path[i];
    let dx = p.x - prev.x, dy = p.y - prev.y;
    let segLen = hyp(dx, dy);
    while (segLen >= remain && out.length < S.count) {
      const t = remain / segLen;
      const nx = prev.x + dx * t, ny = prev.y + dy * t;
      out.push({ x: nx, y: ny });
      prev = { x: nx, y: ny };
      dx = p.x - prev.x; dy = p.y - prev.y;
      segLen = hyp(dx, dy);
      remain = sp;
    }
    if (out.length >= S.count) break;
    remain -= segLen;
    prev = p;
  }
  while (out.length < S.count) out.push({ x: out[out.length-1].x, y: out[out.length-1].y });
  S.segs = out;
}

function updateSnake(dt){
  const t = G.time;
  const spd = snakeSpeed(t);

  if (S.stun > 0) {
    S.stun -= dt;
    if (S.stun <= 0) S.stunKind = '';
    computeSegs();
    return;
  }

  // cíl: nejbližší lákadlo — falešné jablko, když je blíž než hráč
  const pd = hyp(P.x - S.x, P.y - S.y);
  let tx = P.x, ty = P.y, lure = null, best = pd;
  for (const f of fakes) {
    const d = hyp(f.x - S.x, f.y - S.y);
    if (d < best) { best = d; lure = f; tx = f.x; ty = f.y; }
  }
  if (!lure && t >= 60) { // nadbíhání
    const lead = Math.min(0.55, pd / spd);
    tx = clamp(P.x + P.vx * lead, 20, W - 20);
    ty = clamp(P.y + P.vy * lead, 20, H - 20);
  }
  const td = hyp(tx - S.x, ty - S.y);

  // výpady
  S.shake = 0;
  let moveSpd = spd, turning = true, turnMul = 1;
  if (S.mode === 'idle') {
    S.lungeT -= dt;
    if (S.lungeT <= 0) { S.mode = 'tele'; S.modeT = 0.5; sfxWarn(); }
  }
  if (S.mode === 'tele') {
    S.modeT -= dt;
    moveSpd = spd * 0.25; turnMul = 0.4; S.shake = 1;
    if (S.modeT <= 0) {
      S.mode = 'sprint'; S.modeT = 0.95;
      S.heading = Math.atan2(ty - S.y, tx - S.x);
    }
  } else if (S.mode === 'sprint') {
    S.modeT -= dt;
    moveSpd = spd * 1.7 * (1 + 0.3 * Math.min(t / 240, 1));
    turning = false;
    if (S.modeT <= 0) { S.mode = 'idle'; S.lungeT = nextLungeIn(t); }
  }
  if (S.brake > 0) { S.brake -= dt; moveSpd *= 0.5; }

  if (turning) {
    const des = Math.atan2(ty - S.y, tx - S.x);
    const dd = angDiff(S.heading, des);
    let tr = (560 * SCL) / Math.max(moveSpd, 40 * SCL);           // rychlejší = širší oblouk
    tr *= (1 + 1.6 * clamp(1 - td / (180 * SCL), 0, 1));           // blízko cíle ostřeji
    if (td < 95 * SCL) tr = Math.max(tr, moveSpd / Math.max(td * 0.48, 6)); // dotáhne se, žádné věčné kroužení
    tr *= turnMul;
    S.heading += clamp(dd, -tr * dt, tr * dt);
  }

  S.x += Math.cos(S.heading) * moveSpd * dt;
  S.y += Math.sin(S.heading) * moveSpd * dt;
  S.x = clamp(S.x, 16, W - 16);
  S.y = clamp(S.y, 16, H - 16);

  // poslední pojistka proti zacyklení: krátké přibrzdění
  if (td < 120 * SCL && S.mode === 'idle') S.orbit += dt; else S.orbit = Math.max(0, S.orbit - 2 * dt);
  if (S.orbit > 3) { S.brake = 0.45; S.orbit = 0; }

  // cesta těla
  const p0 = S.path[0];
  if (hyp(S.x - p0.x, S.y - p0.y) > 2) S.path.unshift({ x: S.x, y: S.y });
  const maxLen = (S.count + 3) * C.segSp * SCL;
  let acc = 0;
  for (let i = 1; i < S.path.length; i++) {
    acc += hyp(S.path[i].x - S.path[i-1].x, S.path[i].y - S.path[i-1].y);
    if (acc > maxLen) { S.path.length = i + 1; break; }
  }
  computeSegs();
}

function updateFakes(dt){
  let autos = 0;
  for (const f of fakes) if (f.auto) autos++;
  const late = G.time > 100;
  const need = autos < 1 ? 1 : (late && autos < 2 ? 2 : 0);
  if (need === 0) G.fakeTimer = -1;
  else if (G.fakeTimer < 0) G.fakeTimer = autos < 1 ? rnd(2, 3) : rnd(4.5, 7.5) * (G.time > 200 ? 0.7 : 1);
  else {
    G.fakeTimer -= dt;
    if (G.fakeTimer <= 0) { spawnAutoFake(); G.fakeTimer = -1; }
  }
}

function updateQuestions(dt){
  G.qTimer -= dt;
  if (G.qTimer <= 0) {
    if (questions.length < 2) spawnQuestion();
    G.qTimer = rnd(8, 12);
  }
  for (let i = questions.length - 1; i >= 0; i--) {
    questions[i].age += dt;
    if (questions[i].age >= questions[i].life) questions.splice(i, 1);
  }
}

function updateFx(dt){
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= (1 - 2.5 * dt); p.vy *= (1 - 2.5 * dt);
    if (p.age >= p.life) parts.splice(i, 1);
  }
  for (let i = texts.length - 1; i >= 0; i--) {
    texts[i].age += dt;
    if (texts[i].age >= texts[i].life) texts.splice(i, 1);
  }
}

function checkCollisions(){
  // had žere falešná jablka
  for (let i = fakes.length - 1; i >= 0; i--) {
    const f = fakes[i];
    if (hyp(f.x - S.x, f.y - S.y) < (C.headR + C.fakeR) * SCL) {
      fakes.splice(i, 1);
      if (f.bomb) {
        S.stun = 2.5; S.stunKind = 'bomb'; S.mode = 'idle'; S.shake = 0;
        addText(f.x, f.y - 24 * SCL, 'BUM!');
        sfxBoom();
        for (let k = 0; k < 14; k++)
          parts.push({ x: f.x, y: f.y, vx: rnd(-160, 160), vy: rnd(-160, 160), age: 0, life: 0.7, color: '#3a3a3a', r: rnd(1.5, 4) * SCL });
      } else {
        S.count = Math.min(64, S.count + 4);
        sfxChomp();
        for (let k = 0; k < 6; k++)
          parts.push({ x: f.x, y: f.y, vx: rnd(-70, 70), vy: rnd(-70, 70), age: 0, life: 0.5, color: PENCIL, r: rnd(1, 2.5) * SCL });
      }
    }
  }
  // hráč sbírá otazníky
  for (let i = questions.length - 1; i >= 0; i--) {
    const q = questions[i];
    if (hyp(q.x - P.x, q.y - P.y) < (C.qR * SCL + P.r)) {
      questions.splice(i, 1);
      applyQuestion(q);
    }
  }
  // smrt — celé tělo hada
  if (G.grace > 0) return;
  const segs = S.segs;
  for (let i = 0; i < segs.length; i++) {
    const r = (i === 0 ? C.headR : C.segR) * SCL;
    if (hyp(segs[i].x - P.x, segs[i].y - P.y) < (P.r + r) * 0.75) { die(); return; }
  }
}

function update(dt){
  G.time += dt;
  if (G.grace > 0) G.grace -= dt;
  if (G.cool > 0) G.cool = Math.max(0, G.cool - dt);
  if (G.coolShake > 0) G.coolShake -= dt;
  if (G.hintT > 0) G.hintT -= dt;
  updatePlayer(dt);
  updateSnake(dt);
  updateFakes(dt);
  updateQuestions(dt);
  updateFx(dt);
  checkCollisions();
}

// ===================== kreslení =====================
function drawBlots(){
  const ph = Math.floor(now * 2) % 3;   // klidná kresba — jen nepatrné chvění
  ctx.fillStyle = INK;
  ctx.globalAlpha = 0.93;
  for (const b of blots) {
    const n = b.pr.length;
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const k = i % n, a = k / n * TAU;
      const rr = b.r * b.pr[k] + jit(b.seed, k, ph, 1.2);
      const x = b.x + Math.cos(a) * rr, y = b.y + Math.sin(a) * rr;
      if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
    for (const d of b.drops) {
      ctx.beginPath(); ctx.arc(b.x + d.dx, b.y + d.dy, d.r, 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawFake(f){
  const r = C.fakeR * SCL;
  const pop = clamp((now - f.born) * 4, 0, 1);
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.scale(pop, pop);
  ctx.strokeStyle = PENCIL;
  ctx.lineWidth = 1.7;
  wob(0, 0, r, f.seed, 1.8, 11); ctx.stroke();
  ctx.lineWidth = 1;
  wob(1, 0.7, r * 0.9, f.seed + 13, 2, 11); ctx.stroke();
  ctx.globalAlpha = 0.45;
  ctx.beginPath();
  for (let i = -1; i <= 1; i++) { ctx.moveTo(-r*0.5 + i*4, r*0.55); ctx.lineTo(r*0.5 + i*4, -r*0.55); }
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.lineWidth = 1.7;
  ctx.beginPath(); ctx.moveTo(0, -r + 1); ctx.quadraticCurveTo(1, -r - 5, 4, -r - 8); ctx.stroke();
  if (f.bomb) {
    ctx.strokeStyle = '#5a5a5a';
    ctx.beginPath(); ctx.moveTo(4, -r - 8); ctx.quadraticCurveTo(10, -r - 12, 12, -r - 6); ctx.stroke();
    // jiskra
    ctx.strokeStyle = RED; ctx.lineWidth = 1.4;
    const sx = 12, sy = -r - 6, sr = 4 + (boil === 1 ? 1.6 : 0);
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
      const a = i / 4 * TAU + boil * 0.5;
      ctx.moveTo(sx + Math.cos(a) * 1.5, sy + Math.sin(a) * 1.5);
      ctx.lineTo(sx + Math.cos(a) * sr, sy + Math.sin(a) * sr);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function drawQuestion(q){
  const blink = q.life - q.age < 2 ? (Math.floor(now * 6) % 2 === 0 ? 0.3 : 1) : 1;
  const pop = clamp(q.age * 5, 0, 1);
  ctx.save();
  ctx.globalAlpha = blink * pop;
  ctx.translate(q.x + jit(q.seed, 1, boil, 1.6), q.y + jit(q.seed, 2, boil, 1.6));
  ctx.rotate(jit(q.seed, 3, boil, 0.05) + jit(q.seed, 8, 0, 0.12));
  ctx.fillStyle = BLUE;
  ctx.font = `bold ${Math.round(46 * SCL)}px ${FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('?', 0, 0);
  ctx.restore();
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

function drawSnake(){
  const segs = S.segs;
  if (!segs.length) return;
  const sr = C.segR * SCL;
  ctx.lineWidth = 2.2;
  for (let i = segs.length - 1; i >= 1; i--) {
    const s = segs[i];
    ctx.strokeStyle = BLUE;
    ctx.fillStyle = 'rgba(60,90,200,0.10)';
    wob(s.x, s.y, sr * (i === segs.length - 1 ? 0.75 : 1), S.seed + i * 7, 1.3, 10);
    ctx.fill(); ctx.stroke();
  }
  // hlava
  const hr = C.headR * SCL;
  let hx = S.x, hy = S.y;
  if (S.shake) { hx += jit(9, 1, Math.floor(now * 24), 3.2); hy += jit(9, 2, Math.floor(now * 24), 3.2); }
  ctx.save();
  ctx.translate(hx, hy);
  ctx.rotate(S.heading);
  ctx.strokeStyle = BLUE; ctx.fillStyle = 'rgba(60,90,200,0.16)';
  ctx.lineWidth = 2.6;
  wob(0, 0, hr, S.seed, 1.4, 12); ctx.fill(); ctx.stroke();
  // oči
  ctx.fillStyle = PAPER; ctx.lineWidth = 1.4;
  for (const sgn of [-1, 1]) {
    ctx.beginPath(); ctx.arc(hr * 0.35, sgn * hr * 0.42, hr * 0.3, 0, TAU);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(hr * 0.45, sgn * hr * 0.42, hr * 0.12, 0, TAU); ctx.fill();
    ctx.fillStyle = PAPER;
  }
  // jazyk
  if (S.mode === 'sprint' || (S.mode === 'idle' && Math.floor(now * 2) % 3 === 0)) {
    ctx.strokeStyle = RED; ctx.lineWidth = 1.6;
    const fl = hr * (0.9 + (boil === 1 ? 0.3 : 0));
    ctx.beginPath();
    ctx.moveTo(hr, 0); ctx.lineTo(hr + fl, 0);
    ctx.moveTo(hr + fl, 0); ctx.lineTo(hr + fl + 4, -3);
    ctx.moveTo(hr + fl, 0); ctx.lineTo(hr + fl + 4, 3);
    ctx.stroke();
  }
  ctx.restore();
  // sprint — čáry pohybu
  if (S.mode === 'sprint') {
    ctx.strokeStyle = 'rgba(40,67,174,0.4)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i < 3; i++) {
      const off = (i - 1) * 7 * SCL;
      const bx = hx - Math.cos(S.heading) * hr * 1.6 - Math.sin(S.heading) * off;
      const by = hy - Math.sin(S.heading) * hr * 1.6 + Math.cos(S.heading) * off;
      ctx.moveTo(bx, by);
      ctx.lineTo(bx - Math.cos(S.heading) * 15 * SCL, by - Math.sin(S.heading) * 15 * SCL);
    }
    ctx.stroke();
  }
  // telegraf výpadu
  if (S.mode === 'tele') {
    ctx.fillStyle = RED;
    ctx.font = `bold ${Math.round(21 * SCL)}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.fillText('!!', hx, hy - hr - 9 * SCL);
    ctx.textAlign = 'left';
  }
  // omráčení
  if (S.stun > 0) {
    if (S.stunKind === 'bomb') {
      ctx.strokeStyle = RED; ctx.lineWidth = 1.6;
      for (let i = 0; i < 3; i++) {
        const a = now * 4 + i / 3 * TAU;
        const x = S.x + Math.cos(a) * hr * 1.8, y = S.y + Math.sin(a) * hr * 1.1 - hr * 1.4;
        ctx.beginPath();
        for (let k = 0; k < 3; k++) {
          const aa = k / 3 * Math.PI + now * 3;
          ctx.moveTo(x - Math.cos(aa) * 4, y - Math.sin(aa) * 4);
          ctx.lineTo(x + Math.cos(aa) * 4, y + Math.sin(aa) * 4);
        }
        ctx.stroke();
      }
    } else {
      ctx.fillStyle = BLUE;
      ctx.font = `bold ${Math.round(17 * SCL)}px ${FONT}`;
      const zz = 'Zzz'.substring(0, 1 + Math.floor(now * 2) % 3);
      ctx.fillText(zz, S.x + hr, S.y - hr * 1.8);
    }
  }
}

function drawPlayerAt(x,y,rot,alpha){
  const r = P.r;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = RED;
  ctx.lineWidth = 2.5;
  wob(0, 0, r, 77, 1.6, 12);
  ctx.fillStyle = 'rgba(192,40,40,0.14)';
  ctx.fill(); ctx.stroke();
  ctx.lineWidth = 1.2;
  wob(0.8, 0.5, r * 0.93, 84, 1.9, 12); ctx.stroke();
  // stopka + lísteček
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, -r + 2); ctx.quadraticCurveTo(2, -r - 6, 5, -r - 8); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(5, -r - 8);
  ctx.quadraticCurveTo(12, -r - 12, 14, -r - 5);
  ctx.quadraticCurveTo(8, -r - 3, 5, -r - 8);
  ctx.stroke();
  // odlesk
  ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(-r * 0.35, -r * 0.3, r * 0.35, Math.PI * 1.1, Math.PI * 1.6);
  ctx.stroke();
  ctx.restore();
}

function drawPlayer(){
  const flash = G.grace > 0 ? (Math.floor(now * 8) % 2 === 0 ? 0.45 : 0.9) : 1;
  drawPlayerAt(P.x, P.y, P.rot, flash);
  if (G.grace > 0) {
    ctx.save();
    ctx.strokeStyle = 'rgba(192,40,40,0.55)';
    ctx.lineWidth = 1.6;
    ctx.setLineDash([6, 5]);
    ctx.beginPath(); ctx.arc(P.x, P.y, P.r + 8 * SCL, now * 2, now * 2 + TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
}

function drawFx(){
  for (const p of parts) {
    ctx.globalAlpha = 1 - p.age / p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (const t of texts) {
    const k = t.age / t.life;
    ctx.globalAlpha = 1 - k;
    ctx.fillStyle = t.color;
    ctx.font = `bold ${Math.round(t.size * SCL)}px ${FONT}`;
    ctx.fillText(t.txt, t.x, t.y - k * 30 * SCL);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

function drawPencilIcon(x,y,s){
  const ready = G.cool <= 0;
  const shake = G.coolShake > 0 ? jit(3, 1, Math.floor(now * 30), 2.5) : 0;
  ctx.save();
  ctx.translate(x + shake, y);
  // rámeček
  ctx.strokeStyle = ready ? RED : 'rgba(150,150,150,0.8)';
  ctx.lineWidth = 1.6;
  wavyLine(0, 0, s, 0, 51, 1, 4); ctx.stroke();
  wavyLine(s, 0, s, s, 52, 1, 4); ctx.stroke();
  wavyLine(s, s, 0, s, 53, 1, 4); ctx.stroke();
  wavyLine(0, s, 0, 0, 54, 1, 4); ctx.stroke();
  // tužka
  const a = ready ? 1 : 0.45;
  ctx.globalAlpha = a;
  ctx.strokeStyle = PENCIL; ctx.lineWidth = 3.4;
  ctx.beginPath(); ctx.moveTo(s * 0.22, s * 0.78); ctx.lineTo(s * 0.66, s * 0.34); ctx.stroke();
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(s * 0.66, s * 0.34); ctx.lineTo(s * 0.80, s * 0.20);
  ctx.lineTo(s * 0.72, s * 0.42); ctx.closePath(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(s * 0.15, s * 0.85); ctx.lineTo(s * 0.22, s * 0.78); ctx.stroke();
  ctx.globalAlpha = 1;
  // kroužek cooldownu
  if (!ready) {
    const k = 1 - G.cool / G.coolMax;
    ctx.strokeStyle = RED; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(s / 2, s / 2, s * 0.46, -Math.PI / 2, -Math.PI / 2 + k * TAU);
    ctx.stroke();
  }
  ctx.restore();
}

  ctx.strokeStyle = '#5a5a5a';

    const a2 = i / 4 * TAU + boil * 0.5;
    ctx.moveTo(9 + Math.cos(a2) * 1.2, -r - 4 + Math.sin(a2) * 1.2);
    ctx.lineTo(9 + Math.cos(a2) * 3.6, -r - 4 + Math.sin(a2) * 3.6);
  }
  ctx.stroke();
  ctx.restore();
}

function drawHUD(){
  const t = Math.floor(G.time);
  ctx.fillStyle = RED;
  ctx.textAlign = 'center';
  ctx.font = `bold ${Math.round(24 * Math.min(SCL, 1))}px ${FONT}`;
  ctx.fillText(`Čas: ${t} s`, W / 2 + jit(21, 1, boil, 0.8), 32);
  ctx.font = `${Math.round(14 * Math.min(SCL, 1))}px ${FONT}`;
  ctx.globalAlpha = 0.85;
  ctx.fillText(`zatím: ${gradeOf(G.time).mark}`, W / 2, 52);
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
  const s = Math.round(46 * Math.min(SCL, 1));
  drawPencilIcon(14, 14, s);
  if (G.bomb > 0) drawBombIcon(14 + s + 10, 14, s);
  if (G.hintT > 0 && G.time > 2.5) {
    ctx.fillStyle = 'rgba(130,136,154,0.9)';
    ctx.font = `${Math.round(13 * Math.min(SCL, 1))}px ${FONT}`;
    ctx.fillText('← klikni kamkoli = nakreslíš návnadu', 14, 14 + s + 20);
  }
}

function wrapText(txt, maxW){
  const words = txt.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function drawMenu(){
  // titulek
  ctx.save();
  ctx.translate(W / 2 + jit(1, 1, boil, 2), H * 0.13 + jit(1, 2, boil, 2));
  ctx.rotate(-0.02 + jit(1, 3, boil, 0.008));
  ctx.fillStyle = RED;
  const ts = Math.min(86 * SCL, W * 0.15);
  ctx.font = `bold ${Math.round(ts)}px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.fillText('SVAČINA', 0, 0);
  ctx.strokeStyle = RED; ctx.lineWidth = 2.2;
  wavyLine(-ts * 2.1, ts * 0.28, ts * 2.1, ts * 0.28, 11, 2.5, 12); ctx.stroke();
  ctx.lineWidth = 1.2;
  wavyLine(-ts * 2.0, ts * 0.36, ts * 2.0, ts * 0.36, 12, 2.5, 12); ctx.stroke();
  ctx.restore();
  // jablko a had po stranách titulku
  if (W > 600) {
    drawPlayerAt(W / 2 - Math.min(ts * 2.7, W * 0.38), H * 0.115, now * 0.7, 1);
    const sx = W / 2 + Math.min(ts * 2.7, W * 0.38), sy = H * 0.115;
    ctx.strokeStyle = BLUE; ctx.lineWidth = 2.2;
    ctx.beginPath();
    for (let i = 0; i <= 14; i++) {
      const t2 = i / 14;
      const x = sx - 34 + t2 * 68;
      const y = sy + Math.sin(t2 * TAU * 1.5 + now * 2) * 9 + jit(13, i, boil, 1);
      if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    }
    ctx.stroke();
    ctx.fillStyle = BLUE;
    ctx.beginPath(); ctx.arc(sx + 38, sy + Math.sin(TAU * 1.5 + now * 2) * 9, 6 * SCL, 0, TAU); ctx.fill();
  }
  ctx.textAlign = 'center';
  ctx.fillStyle = BLUE;
  ctx.font = `${Math.round(23 * SCL)}px ${FONT}`;
  ctx.fillText('Jsi svačina. Uteč hadovi.', W / 2, H * 0.21);
  ctx.fillStyle = RED;
  ctx.globalAlpha = 0.65 + 0.35 * Math.sin(now * 4);
  ctx.font = `bold ${Math.round(17 * SCL)}px ${FONT}`;
  ctx.fillText('Klikni, ťukni nebo zmáčkni MEZERNÍK — a utíkej!', W / 2, H * 0.265);
  ctx.globalAlpha = 1;
  if (G.best > 0) {
    ctx.fillStyle = 'rgba(192,40,40,0.85)';
    ctx.font = `${Math.round(15 * SCL)}px ${FONT}`;
    ctx.fillText(`Rekord třídy: ${Math.floor(G.best)} s (${gradeOf(G.best).mark})`, W / 2, H * 0.305);
  }

  // TAHÁK
  const lines = [
    ['TAHÁK  (schovej před učitelem!)', PENCIL, true],
    ['Tužka: klik nakreslí falešné jablko. Had mu neodolá', PENCIL, false],
    ['a po sežrání vyroste — delší tělo, delší zeď.', PENCIL, false],
    ['Otazník: GUMA smaže hadovi ocas · ZVONEK = přestávka', PENCIL, false],
    ['· BOMBA omráčí (tvá příští návnada) · KAŇKA přibude.', PENCIL, false],
    ['Kaňky brzdí jen tebe. Had po nich klouže jak po ledě.', PENCIL, false],
    ['Známky: 15 s → 5 · 30 s → 4 · 60 s → 3 · 120 s → 2', PENCIL, false],
    ['210 s → 1 · 330 s → 1* · dál → POCHVALA ŘEDITELE', PENCIL, false],
    ['Pochvalu ředitele prý ještě nikdo živý nedostal.', RED, false],
  ];
  const panelW = Math.min(W - 28, 560);
  ctx.font = `13px ${FONT}`;
  let maxW = 0;
  for (const l of lines) maxW = Math.max(maxW, ctx.measureText(l[0]).width);
  const fs = clamp(13 * (panelW - 36) / maxW, 10.5, 15);
  const lh = fs * 1.5;
  const panelH = lines.length * lh + 34;
  const px0 = W / 2 - panelW / 2, py0 = H * 0.35;
  ctx.save();
  ctx.translate(W / 2, py0 + panelH / 2);
  ctx.rotate(0.012);
  ctx.fillStyle = 'rgba(60,50,20,0.10)';
  ctx.fillRect(-panelW / 2 + 5, -panelH / 2 + 6, panelW, panelH);
  ctx.fillStyle = '#fdfaf1';
  ctx.fillRect(-panelW / 2, -panelH / 2, panelW, panelH);
  ctx.strokeStyle = PENCIL; ctx.lineWidth = 1.2;
  ctx.setLineDash([5, 4]);
  ctx.strokeRect(-panelW / 2 + 4, -panelH / 2 + 4, panelW - 8, panelH - 8);
  ctx.setLineDash([]);
  ctx.textAlign = 'left';
  let yy = -panelH / 2 + 24;
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    ctx.fillStyle = l[1];
    ctx.font = `${l[2] ? 'bold ' : ''}${Math.round(fs)}px ${FONT}`;
    ctx.fillText(l[0], -panelW / 2 + 18, yy + jit(70 + i, 1, boil, 0.5));
    yy += lh;
    if (i === 0) yy += 4;
  }
  ctx.restore();
  ctx.textAlign = 'left';
}

function drawPause(){
  ctx.fillStyle = 'rgba(251,247,236,0.78)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = RED;
  ctx.font = `bold ${Math.round(52 * SCL)}px ${FONT}`;
  ctx.fillText('PŘESTÁVKA', W / 2, H * 0.42);
  ctx.fillStyle = BLUE;
  ctx.font = `${Math.round(19 * SCL)}px ${FONT}`;
  ctx.fillText('Zvonilo. Klikni nebo zmáčkni klávesu a pokračuj v úprku.', W / 2, H * 0.50);
  ctx.textAlign = 'left';
}

function drawOver(){
  ctx.fillStyle = 'rgba(251,247,236,0.86)';
  ctx.fillRect(0, 0, W, H);
  const g = gradeOf(G.time);
  ctx.textAlign = 'center';
  ctx.fillStyle = BLUE;
  ctx.font = `${Math.round(20 * SCL)}px ${FONT}`;
  ctx.fillText('Křup. Svačina snědena. Hodnocení učitele:', W / 2, H * 0.22);
  // známka v kroužku
  const long = g.mark.length > 3;
  const ms = long ? Math.min(36 * SCL, W / (g.mark.length * 0.62)) : 108 * SCL;
  ctx.fillStyle = RED;
  ctx.font = `bold ${Math.round(ms)}px ${FONT}`;
  const my = H * 0.38;
  ctx.save();
  ctx.translate(W / 2 + jit(2, 1, boil, 1.5), my + jit(2, 2, boil, 1.5));
  ctx.rotate(-0.03);
  ctx.fillText(g.mark, 0, ms * 0.32);
  const tw = ctx.measureText(g.mark).width;
  ctx.strokeStyle = RED; ctx.lineWidth = 2.6;
  wobEllipse(0, 0, tw * 0.62 + 18 * SCL, ms * 0.62 + 10 * SCL, 6, 3, 22); ctx.stroke();
  ctx.lineWidth = 1.3;
  wobEllipse(2, 2, tw * 0.62 + 22 * SCL, ms * 0.62 + 14 * SCL, 9, 3, 22); ctx.stroke();
  ctx.restore();
  // komentář
  ctx.fillStyle = RED;
  ctx.font = `${Math.round(19 * SCL)}px ${FONT}`;
  const cw = Math.min(W - 60, 620);
  const cl = wrapText(g.txt, cw);
  let cy = H * 0.52;
  for (const l of cl) { ctx.fillText(l, W / 2, cy); cy += 26 * SCL; }
  // časy
  ctx.fillStyle = 'rgba(40,67,174,0.9)';
  ctx.font = `${Math.round(16 * SCL)}px ${FONT}`;
  ctx.fillText(`Vydržel jsi ${G.time.toFixed(1).replace('.', ',')} s.`, W / 2, cy + 12 * SCL);
  if (G.newBest) {
    ctx.fillStyle = RED;
    ctx.font = `bold ${Math.round(18 * SCL)}px ${FONT}`;
    ctx.fillText('NOVÝ REKORD TŘÍDY!', W / 2, cy + 38 * SCL);
  } else if (G.best > 0) {
    ctx.fillText(`Rekord třídy: ${Math.floor(G.best)} s.`, W / 2, cy + 38 * SCL);
  }
  ctx.fillStyle = RED;
  ctx.globalAlpha = 0.6 + 0.4 * Math.sin(now * 4);
  ctx.font = `bold ${Math.round(16 * SCL)}px ${FONT}`;
  ctx.fillText('Klikni nebo zmáčkni mezerník — jde se na opravu.', W / 2, H * 0.78);
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  if (paper) ctx.drawImage(paper, 0, 0, W, H);
  drawDecor();
  if (G.state === 'menu') { drawMenu(); return; }
  drawBlots();
  for (const q of questions) drawQuestion(q);
  for (const f of fakes) drawFake(f);
  drawSnake();
  if (G.state !== 'dying' && G.state !== 'over') drawPlayer();
  drawFx();
  if (G.state === 'play' || G.state === 'pause' || G.state === 'dying') drawHUD();
  if (G.state === 'pause') drawPause();
  if (G.state === 'over') drawOver();
}

// ===================== vstup =====================
let tapInfo = null;
cv.addEventListener('pointermove', (e) => { M.x = e.clientX; M.y = e.clientY; });
cv.addEventListener('pointerdown', (e) => {
  AU.init();
  M.x = e.clientX; M.y = e.clientY;
  tapInfo = { x: e.clientX, y: e.clientY, t: performance.now() };
});
cv.addEventListener('pointerup', (e) => {
  AU.init();
  const ti = tapInfo; tapInfo = null;
  if (G.state === 'menu') { startRound(); return; }
  if (G.state === 'pause') { resumeGame(); return; }
  if (G.state === 'over') { if (G.overT > 0.5) startRound(); return; }
  if (G.state === 'play' && ti) {
    const d = hyp(e.clientX - ti.x, e.clientY - ti.y);
    if (performance.now() - ti.t < 350 && d < 14) tryDrawFake(e.clientX, e.clientY);
  }
});
cv.addEventListener('pointercancel', () => { tapInfo = null; });
window.addEventListener('keydown', (e) => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  AU.init();
  const k = e.key.toLowerCase();
  keys.add(k);
  if (G.state === 'menu' && (k === ' ' || k === 'enter')) startRound();
  else if (G.state === 'pause') resumeGame();
  else if (G.state === 'over' && (k === ' ' || k === 'enter' || k === 'r') && G.overT > 0.5) startRound();
});
window.addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
window.addEventListener('blur', () => pauseGame());
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
cv.addEventListener('contextmenu', (e) => e.preventDefault());
window.addEventListener('resize', resize);

// ===================== smyčka =====================
let last = performance.now();
function frame(ts){
  requestAnimationFrame(frame);
  const dt = clamp((ts - last) / 1000, 0, 0.05);
  last = ts;
  now = ts / 1000;
  boil = Math.floor(now * 6) % 3;
  if (G.state === 'play') update(dt);
  else if (G.state === 'dying') {
    G.dieT += dt; updateFx(dt);
    if (G.dieT > 1.0) { G.state = 'over'; G.overT = 0; }
  }
  else if (G.state === 'over') { G.overT += dt; updateFx(dt); }
  draw();
}

resize();
M.x = W / 2; M.y = H / 2;
requestAnimationFrame(frame);

// ladicí háček pro testy (neovlivňuje hru)
window.SV = { G, P, S, fakes, questions, blots, startRound, M,
  step(dt, n){
    n = n || 1;
    for (let i = 0; i < n; i++) {
      now += dt; boil = Math.floor(now * 6) % 3;
      if (G.state === 'play') update(dt);
      else if (G.state === 'dying') { G.dieT += dt; updateFx(dt); if (G.dieT > 1) { G.state = 'over'; G.overT = 0; } }
      else if (G.state === 'over') G.overT += dt;
    }
  },
  draw };

})();
</script>
