<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SVAČINA — uteč hadovi</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #f6f2e4;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #hra {
    display: block;
    width: 100vw; height: 100vh;
    cursor: crosshair;
  }
</style>
</head>
<body>
<canvas id="hra"></canvas>
<script>
'use strict';
(function () {

  // ---------------------------------------------------------------
  // Základ: canvas, velikosti, DPR
  // ---------------------------------------------------------------
  const canvas = document.getElementById('hra');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  let isSmall = false;          // malý displej (mobil)
  let UI = 1;                   // měřítko UI

  const paperCanvas = document.createElement('canvas'); // předkreslený papír
  const paperCtx = paperCanvas.getContext('2d');

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    isSmall = Math.min(W, H) < 560;
    UI = isSmall ? 0.8 : 1;
    drawPaper();
    clampWorld();
  }

  // ---------------------------------------------------------------
  // Pomocné funkce
  // ---------------------------------------------------------------
  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function dist(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return Math.hypot(dx, dy); }
  function angDiff(a, b) { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }

  // "Boiling lines" — několik variant roztřesení, přepínají se v čase
  let boil = 0;
  function jr(seed) {
    const x = Math.sin(seed * 127.1 + boil * 74.7 + 13.7) * 43758.5453;
    return x - Math.floor(x) - 0.5;
  }

  // roztřesená lomená čára okolo kruhu
  function wobblyCircle(c, x, y, r, seed, amp, pts) {
    pts = pts || 12;
    c.beginPath();
    for (let i = 0; i <= pts; i++) {
      const k = i % pts;
      const a = (k / pts) * Math.PI * 2;
      const rr = r + jr(seed + k * 3.1) * amp;
      const px = x + Math.cos(a) * rr;
      const py = y + Math.sin(a) * rr;
      if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
    }
    c.closePath();
  }

  // roztřesená čára mezi dvěma body
  function wobblyLine(c, x1, y1, x2, y2, seed, amp, segs) {
    segs = segs || 6;
    c.beginPath();
    for (let i = 0; i <= segs; i++) {
      const t = i / segs;
      const nx = -(y2 - y1), ny = (x2 - x1);
      const L = Math.hypot(nx, ny) || 1;
      const off = (i === 0 || i === segs) ? 0 : jr(seed + i * 7.3) * amp;
      const px = x1 + (x2 - x1) * t + nx / L * off;
      const py = y1 + (y2 - y1) * t + ny / L * off;
      if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
    }
  }

  // ---------------------------------------------------------------
  // Zvuk — Web Audio, aktivace až po první interakci
  // ---------------------------------------------------------------
  let AC = null;
  function ensureAudio() {
    if (!AC) {
      try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
    }
    if (AC && AC.state === 'suspended') { AC.resume().catch(function () {}); }
  }
  function now() { return AC ? AC.currentTime : 0; }

  function tone(freq, t0, dur, type, vol, freqEnd) {
    if (!AC) return;
    const o = AC.createOscillator();
    const g = AC.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }

  function noiseBurst(t0, dur, vol, hp) {
    if (!AC) return;
    const n = Math.floor(AC.sampleRate * dur);
    const buf = AC.createBuffer(1, n, AC.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = AC.createBufferSource();
    src.buffer = buf;
    const f = AC.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = hp || 1200;
    const g = AC.createGain();
    g.gain.setValueAtTime(vol || 0.12, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(AC.destination);
    src.start(t0);
  }

  const snd = {
    pencil: function () { // škrábnutí tužky
      if (!AC) return; const t = now();
      noiseBurst(t, 0.09, 0.10, 2500);
      noiseBurst(t + 0.10, 0.12, 0.08, 2000);
    },
    warn: function () { // zavrtění před výpadem
      if (!AC) return; const t = now();
      tone(180, t, 0.12, 'sawtooth', 0.07, 140);
      tone(180, t + 0.15, 0.12, 'sawtooth', 0.07, 140);
      tone(180, t + 0.30, 0.12, 'sawtooth', 0.08, 130);
    },
    crunch: function () { // tlumené křupnutí na konci
      if (!AC) return; const t = now();
      noiseBurst(t, 0.15, 0.22, 400);
      tone(90, t, 0.25, 'triangle', 0.2, 45);
    },
    eat: function () { // had sežral falešné jablko
      if (!AC) return; const t = now();
      tone(220, t, 0.08, 'square', 0.05, 160);
      noiseBurst(t, 0.06, 0.06, 800);
    },
    guma: function () { // guma — vrzavé mazání
      if (!AC) return; const t = now();
      noiseBurst(t, 0.10, 0.09, 3000);
      tone(520, t, 0.10, 'sine', 0.08, 700);
      noiseBurst(t + 0.12, 0.10, 0.09, 3000);
      tone(640, t + 0.12, 0.10, 'sine', 0.08, 840);
    },
    zvonek: function () { // školní zvonek
      if (!AC) return; const t = now();
      tone(1320, t, 0.5, 'sine', 0.10);
      tone(1980, t, 0.35, 'sine', 0.05);
      tone(1320, t + 0.25, 0.45, 'sine', 0.08);
    },
    kanka: function () { // kaňka na brýle — bzučivý pokles
      if (!AC) return; const t = now();
      tone(300, t, 0.4, 'sawtooth', 0.09, 80);
      noiseBurst(t, 0.2, 0.05, 500);
    },
    otaznik: function () { // objevení otazníku
      if (!AC) return; const t = now();
      tone(660, t, 0.07, 'triangle', 0.05, 880);
    },
    start: function () {
      if (!AC) return; const t = now();
      tone(440, t, 0.09, 'triangle', 0.07, 520);
      tone(660, t + 0.1, 0.12, 'triangle', 0.07, 780);
    }
  };

  // ---------------------------------------------------------------
  // Herní stav
  // ---------------------------------------------------------------
  const ST_MENU = 0, ST_PLAY = 1, ST_PAUSE = 2, ST_OVER = 3;
  let state = ST_MENU;

  const player = {
    x: 0, y: 0, vx: 0, vy: 0, r: 13,
    rot: 0,          // otáčení kresby při koulení
    slowUntil: 0     // kaňka na brýle
  };

  const snake = {
    segs: [],        // [{x,y}], segs[0] = hlava
    heading: 0,
    speed: 150,
    spacing: 15,
    segR: 11,
    headR: 12.5,
    frozenUntil: 0,  // zvonek
    // výpady
    lungeState: 0,   // 0 klid, 1 telegraf, 2 sprint
    lungeTimer: 0,
    nextLungeIn: 10,
    lungeDirX: 1, lungeDirY: 0,
    // proti kroužení
    nearTimer: 0,
    brakeTimer: 0
  };

  let fakes = [];        // falešná jablka {x,y,seed,auto}
  let blots = [];        // kaňky {x,y,r,pts:[radii]}
  let qmark = null;      // otazník {x,y,life,seed}
  let qmarkIn = 8;       // za jak dlouho se objeví další

  let playTime = 0;      // čas přežití (skóre)
  let graceUntil = 0;    // ochranná lhůta
  let drawCooldown = 0;  // cooldown kreslení jablka
  const DRAW_CD = 4;     // sekundy
  let autoRespawnIn = 0; // časovač automatického jablka
  let extraFakeIn = 18;  // občas druhé automatické
  let floats = [];       // plovoucí nápisy {x,y,text,life,color}
  let shake = 0;         // zatřesení obrazu
  let pausedByBlur = false;
  let finalGrade = null; // {grade, comment}
  let bestTime = 0;
  let deathAnim = 0;     // animace konce

  // vstup
  const keys = {};
  let pointer = { x: 0, y: 0, has: false };
  let useKeys = false;
  let pdown = null;      // {x,y,t} pro rozpoznání ťuknutí

  // localStorage jen v try/catch
  function loadBest() {
    try {
      const v = window.localStorage.getItem('svacina_best');
      if (v !== null) bestTime = parseFloat(v) || 0;
    } catch (e) { /* bez rekordu */ }
  }
  function saveBest() {
    try { window.localStorage.setItem('svacina_best', String(bestTime)); } catch (e) { /* ok */ }
  }
  loadBest();

  // ---------------------------------------------------------------
  // Rozmístění světa
  // ---------------------------------------------------------------
  function placeBlots() {
    blots = [];
    const count = isSmall ? 2 : (4 + (Math.random() < 0.5 ? 1 : 0));
    const margin = Math.min(Math.min(W, H) * 0.18 + 40, W * 0.32, H * 0.32);
    let tries = 0;
    while (blots.length < count && tries < 900) {
      tries++;
      // po neúspěších postupně uvolňuj rozestupy, ať se kaňky vejdou i do malého okna
      const relax = tries < 300 ? 1 : (tries < 600 ? 0.55 : 0.25);
      const r = rand(34, 54) * (isSmall ? 0.8 : 1);
      const x = rand(margin, W - margin);
      const y = rand(margin, H - margin);
      // dál od středu (start hráče) a od sebe
      if (dist(x, y, W / 2, H / 2) < (130 * relax) + r) continue;
      let ok = true;
      for (const b of blots) {
        if (dist(x, y, b.x, b.y) < b.r + r + 150 * relax) { ok = false; break; }
      }
      if (!ok) continue;
      const pts = [];
      const n = 11;
      for (let i = 0; i < n; i++) pts.push(rand(0.68, 1.12));
      blots.push({ x: x, y: y, r: r, pts: pts, seed: rand(0, 100) });
    }
  }

  function spawnFake(x, y, auto) {
    fakes.push({ x: x, y: y, seed: rand(0, 1000), auto: !!auto, born: playTime });
  }

  function spawnAutoFake() {
    const head = snake.segs[0];
    const m = 60;
    for (let i = 0; i < 60; i++) {
      const x = rand(m, W - m), y = rand(m, H - m);
      if (head && dist(x, y, head.x, head.y) < 260) continue;
      if (dist(x, y, player.x, player.y) < 90) continue;
      spawnFake(x, y, true);
      return;
    }
    spawnFake(rand(m, W - m), rand(m, H - m), true);
  }

  function spawnQmark() {
    const m = 70;
    for (let i = 0; i < 60; i++) {
      const x = rand(m, W - m), y = rand(m, H - m);
      const head = snake.segs[0];
      if (head && dist(x, y, head.x, head.y) < 180) continue;
      if (dist(x, y, player.x, player.y) < 70) continue;
      let inBlot = false;
      for (const b of blots) if (dist(x, y, b.x, b.y) < b.r + 30) { inBlot = true; break; }
      if (inBlot) continue;
      qmark = { x: x, y: y, life: 8, seed: rand(0, 100) };
      snd.otaznik();
      return;
    }
  }

  function resetGame() {
    playTime = 0;
    player.x = W / 2; player.y = H / 2;
    player.vx = 0; player.vy = 0; player.rot = 0; player.slowUntil = 0;

    // had startuje v rohu nejdál od středu
    const cx = W * 0.12, cy = H * 0.12;
    snake.segs = [];
    const a0 = Math.atan2(H / 2 - cy, W / 2 - cx);
    for (let i = 0; i < 8; i++) {
      snake.segs.push({ x: cx - Math.cos(a0) * i * snake.spacing, y: cy - Math.sin(a0) * i * snake.spacing });
    }
    snake.heading = a0;
    snake.speed = 150;
    snake.frozenUntil = 0;
    snake.lungeState = 0;
    snake.lungeTimer = 0;
    snake.nextLungeIn = rand(8, 14);
    snake.nearTimer = 0;
    snake.brakeTimer = 0;

    fakes = [];
    placeBlots();
    spawnAutoFake();
    autoRespawnIn = 0;
    extraFakeIn = rand(15, 22);
    qmark = null;
    qmarkIn = rand(6, 10);
    drawCooldown = 0;
    floats = [];
    shake = 0;
    graceUntil = 2;   // relativně k playTime
    finalGrade = null;
    deathAnim = 0;
    pausedByBlur = false;
  }

  function clampWorld() {
    // po změně velikosti okna vrátit vše do hracího pole
    const m = 20;
    player.x = clamp(player.x, m, W - m);
    player.y = clamp(player.y, m, H - m);
    for (const s of snake.segs) { s.x = clamp(s.x, -40, W + 40); s.y = clamp(s.y, -40, H + 40); }
    for (const f of fakes) { f.x = clamp(f.x, m, W - m); f.y = clamp(f.y, m, H - m); }
    for (const b of blots) { b.x = clamp(b.x, b.r + 30, W - b.r - 30); b.y = clamp(b.y, b.r + 30, H - b.r - 30); }
    if (qmark) { qmark.x = clamp(qmark.x, m + 20, W - m - 20); qmark.y = clamp(qmark.y, m + 20, H - m - 20); }
  }

  // ---------------------------------------------------------------
  // Známkování
  // ---------------------------------------------------------------
  function gradeFor(t) {
    if (t < 15) return { g: '5', c: 'Pětka. Tohle si po škole zopakujeme.' };
    if (t < 30) return { g: '4', c: 'Čtyřka. Sotva jsi utekl z lavice.' };
    if (t < 60) return { g: '3', c: 'Trojka. Průměr, ale snaha byla vidět.' };
    if (t < 120) return { g: '2', c: 'Dvojka. Skoro výborně, jen tak dál!' };
    return { g: '1', c: 'Jednička! Had dnes zůstal o hladu. Výborně!' };
  }

  function endGame() {
    state = ST_OVER;
    deathAnim = 0;
    finalGrade = gradeFor(playTime);
    if (playTime > bestTime) { bestTime = playTime; saveBest(); }
    snd.crunch();
    shake = 1;
  }

  // ---------------------------------------------------------------
  // Aktualizace
  // ---------------------------------------------------------------
  function inBlot(x, y, pad) {
    for (const b of blots) {
      if (dist(x, y, b.x, b.y) < b.r * 0.92 + (pad || 0)) return true;
    }
    return false;
  }

  function keyDir() {
    let dx = 0, dy = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1;
    if (keys['ArrowRight'] || keys['KeyD']) dx += 1;
    if (keys['ArrowUp'] || keys['KeyW']) dy -= 1;
    if (keys['ArrowDown'] || keys['KeyS']) dy += 1;
    if (dx === 0 && dy === 0) return null;
    const L = Math.hypot(dx, dy);
    return { x: dx / L, y: dy / L };
  }

  function updatePlayer(dt) {
    const slowed = playTime < player.slowUntil;
    const inInk = inBlot(player.x, player.y, 0);
    let maxV = 320 * (slowed ? 0.55 : 1) * (inInk ? 0.38 : 1);
    let acc = 1050 * (slowed ? 0.6 : 1) * (inInk ? 0.45 : 1);

    const kd = keyDir();
    let ax = 0, ay = 0;
    if (kd && useKeys) {
      ax = kd.x * acc; ay = kd.y * acc;
    } else if (pointer.has) {
      const dx = pointer.x - player.x, dy = pointer.y - player.y;
      const d = Math.hypot(dx, dy);
      if (d > 2) {
        const f = clamp(d / 70, 0, 1); // u cíle brzdí
        ax = dx / d * acc * f;
        ay = dy / d * acc * f;
      }
    }
    player.vx += ax * dt;
    player.vy += ay * dt;
    // tření — mírné klouzání
    const drag = Math.pow(0.32, dt);
    player.vx *= drag; player.vy *= drag;
    const v = Math.hypot(player.vx, player.vy);
    if (v > maxV) { player.vx *= maxV / v; player.vy *= maxV / v; }
    player.x += player.vx * dt;
    player.y += player.vy * dt;
    // odraz od okrajů stránky
    const m = 18;
    if (player.x < m) { player.x = m; player.vx = Math.abs(player.vx) * 0.4; }
    if (player.x > W - m) { player.x = W - m; player.vx = -Math.abs(player.vx) * 0.4; }
    if (player.y < m) { player.y = m; player.vy = Math.abs(player.vy) * 0.4; }
    if (player.y > H - m) { player.y = H - m; player.vy = -Math.abs(player.vy) * 0.4; }
    // koulení = otáčení kresby
    player.rot += (Math.hypot(player.vx, player.vy) / player.r) * dt * Math.sign(player.vx || 1);
  }

  function snakeTarget() {
    const head = snake.segs[0];
    let tx = player.x, ty = player.y;
    let best = dist(head.x, head.y, player.x, player.y);
    for (const f of fakes) {
      const d = dist(head.x, head.y, f.x, f.y);
      if (d < best) { best = d; tx = f.x; ty = f.y; }
    }
    return { x: tx, y: ty, d: best };
  }

  function updateSnake(dt) {
    const head = snake.segs[0];
    if (playTime < snake.frozenUntil) return; // zvonek — had stojí

    // postupné zrychlování
    snake.speed = Math.min(140 + playTime * 0.8, 275);

    const tgt = snakeTarget();

    // --- výpady ---
    if (snake.lungeState === 0) {
      snake.nextLungeIn -= dt;
      if (snake.nextLungeIn <= 0) {
        snake.lungeState = 1;
        snake.lungeTimer = 0.5;
        snd.warn();
      }
    } else if (snake.lungeState === 1) {
      snake.lungeTimer -= dt;
      if (snake.lungeTimer <= 0) {
        snake.lungeState = 2;
        snake.lungeTimer = 1.0;
        const d = Math.max(1, tgt.d);
        snake.lungeDirX = (tgt.x - head.x) / d;
        snake.lungeDirY = (tgt.y - head.y) / d;
        snake.heading = Math.atan2(snake.lungeDirY, snake.lungeDirX);
      }
    } else if (snake.lungeState === 2) {
      snake.lungeTimer -= dt;
      if (snake.lungeTimer <= 0) {
        snake.lungeState = 0;
        snake.nextLungeIn = rand(8, 14);
      }
    }

    let sp = snake.speed;
    if (snake.lungeState === 2) {
      sp = clamp(snake.speed * 1.9, 380, 540);
      // sprint po přímce
      head.x += snake.lungeDirX * sp * dt;
      head.y += snake.lungeDirY * sp * dt;
      // náraz do okraje končí výpad
      if (head.x < 10 || head.x > W - 10 || head.y < 10 || head.y > H - 10) {
        head.x = clamp(head.x, 10, W - 10);
        head.y = clamp(head.y, 10, H - 10);
        snake.lungeState = 0;
        snake.nextLungeIn = rand(8, 14);
      }
    } else {
      // --- normální zatáčení k cíli ---
      const want = Math.atan2(tgt.y - head.y, tgt.x - head.x);
      const near = clamp(1 - tgt.d / 240, 0, 1);
      let turn = 2.3 + near * 8.5;             // blíž cíli = ostřejší zatáčka
      // proti věčnému kroužení: měřič blízkosti bez dosažení
      if (tgt.d < 170) snake.nearTimer += dt; else if (tgt.d > 240) snake.nearTimer = 0;
      if (snake.nearTimer > 3.2) {             // poslední záchrana
        snake.brakeTimer = 0.7;
        snake.nearTimer = 0;
      }
      if (snake.brakeTimer > 0) {
        snake.brakeTimer -= dt;
        sp *= 0.55;
        turn *= 1.6;
      }
      const d = angDiff(want, snake.heading);
      const maxTurn = turn * dt;
      snake.heading += clamp(d, -maxTurn, maxTurn);
      // telegraf výpadu: zavrtění
      let wig = 0;
      if (snake.lungeState === 1) wig = Math.sin(playTime * 55) * 0.35;
      head.x += Math.cos(snake.heading + wig) * sp * dt;
      head.y += Math.sin(snake.heading + wig) * sp * dt;
      // jemné odpuzení od okrajů
      const em = 26;
      if (head.x < em) head.x += (em - head.x) * 3 * dt;
      if (head.x > W - em) head.x -= (head.x - (W - em)) * 3 * dt;
      if (head.y < em) head.y += (em - head.y) * 3 * dt;
      if (head.y > H - em) head.y -= (head.y - (H - em)) * 3 * dt;
    }

    // řetěz článků
    for (let i = 1; i < snake.segs.length; i++) {
      const p = snake.segs[i - 1], s = snake.segs[i];
      const dx = s.x - p.x, dy = s.y - p.y;
      const L = Math.hypot(dx, dy) || 1;
      if (L > snake.spacing) {
        s.x = p.x + dx / L * snake.spacing;
        s.y = p.y + dy / L * snake.spacing;
      }
    }

    // žraní falešných jablek
    for (let i = fakes.length - 1; i >= 0; i--) {
      const f = fakes[i];
      if (dist(head.x, head.y, f.x, f.y) < snake.headR + 12) {
        fakes.splice(i, 1);
        snd.eat();
        snake.nearTimer = 0;
        // růst — každý článek má viditelnou příčinu
        const tail = snake.segs[snake.segs.length - 1];
        for (let k = 0; k < 4; k++) snake.segs.push({ x: tail.x, y: tail.y });
        floats.push({ x: head.x, y: head.y - 20, text: 'CHRAMST!', life: 1.1, color: '#2b4a9b' });
        if (f.auto && !fakes.some(function (q) { return q.auto; })) {
          autoRespawnIn = rand(2, 3);
        }
      }
    }
  }

  function updateWorld(dt) {
    // automatická falešná jablka — na papíře vždy aspoň jedno
    const autoCount = fakes.filter(function (f) { return f.auto; }).length;
    if (autoCount === 0) {
      if (autoRespawnIn > 0) {
        autoRespawnIn -= dt;
        if (autoRespawnIn <= 0) { spawnAutoFake(); snd.pencil(); }
      } else {
        autoRespawnIn = rand(2, 3);
      }
    }
    // občas druhé automatické (max 2)
    extraFakeIn -= dt;
    if (extraFakeIn <= 0) {
      if (autoCount < 2 && Math.random() < 0.6) { spawnAutoFake(); snd.pencil(); }
      extraFakeIn = rand(14, 22);
    }

    // cooldown kreslení
    if (drawCooldown > 0) drawCooldown = Math.max(0, drawCooldown - dt);

    // otazník
    if (!qmark) {
      qmarkIn -= dt;
      if (qmarkIn <= 0) { spawnQmark(); qmarkIn = rand(7, 12); }
    } else {
      qmark.life -= dt;
      if (qmark.life <= 0) qmark = null;
      else if (dist(player.x, player.y, qmark.x, qmark.y) < player.r + 20) {
        applyQmark();
        qmark = null;
      }
    }

    // plovoucí texty
    for (let i = floats.length - 1; i >= 0; i--) {
      floats[i].life -= dt;
      floats[i].y -= 24 * dt;
      if (floats[i].life <= 0) floats.splice(i, 1);
    }
    if (shake > 0) shake = Math.max(0, shake - dt * 2.4);
  }

  function applyQmark() {
    const r = Math.random();
    if (r < 0.4) {
      // GUMA — smazat několik posledních článků
      const rm = Math.min(6, Math.max(0, snake.segs.length - 6));
      snake.segs.length = snake.segs.length - rm;
      floats.push({ x: player.x, y: player.y - 26, text: 'GUMA!', life: 1.5, color: '#b32020' });
      snd.guma();
    } else if (r < 0.8) {
      // ZVONEK — přestávka, had stojí
      snake.frozenUntil = playTime + 2;
      floats.push({ x: player.x, y: player.y - 26, text: 'ZVONEK! Přestávka!', life: 1.5, color: '#b32020' });
      snd.zvonek();
    } else {
      // KAŇKA NA BRÝLE — postih
      player.slowUntil = playTime + 3.5;
      floats.push({ x: player.x, y: player.y - 26, text: 'KAŇKA NA BRÝLE!', life: 1.5, color: '#1b2a6b' });
      snd.kanka();
    }
  }

  function checkDeath() {
    if (playTime < graceUntil) return;
    // smrtící je celé tělo — kruhy s tolerancí ve prospěch hráče
    for (let i = 0; i < snake.segs.length; i++) {
      const s = snake.segs[i];
      const rr = (i === 0 ? snake.headR : snake.segR);
      if (dist(player.x, player.y, s.x, s.y) < (player.r + rr) * 0.72) {
        endGame();
        return;
      }
    }
  }

  // ---------------------------------------------------------------
  // Vstupy
  // ---------------------------------------------------------------
  function tryDrawFake(x, y) {
    if (drawCooldown > 0) {
      shakePencil = 0.4;
      return;
    }
    drawCooldown = DRAW_CD;
    spawnFake(clamp(x, 25, W - 25), clamp(y, 25, H - 25), false);
    snd.pencil();
  }
  let shakePencil = 0;

  function primaryAction(x, y) {
    // klik/ťuk podle stavu hry
    if (state === ST_MENU) {
      resetGame(); state = ST_PLAY; snd.start();
    } else if (state === ST_PAUSE) {
      state = ST_PLAY;
      graceUntil = Math.max(graceUntil, playTime + 0.6);
    } else if (state === ST_OVER) {
      if (deathAnim > 0.8) { resetGame(); state = ST_PLAY; snd.start(); }
    } else if (state === ST_PLAY) {
      tryDrawFake(x, y);
    }
  }

  canvas.addEventListener('pointerdown', function (e) {
    ensureAudio();
    e.preventDefault();
    const x = e.clientX, y = e.clientY;
    pointer.x = x; pointer.y = y; pointer.has = true;
    useKeys = false;
    pdown = { x: x, y: y, t: performance.now() };
  }, { passive: false });

  canvas.addEventListener('pointermove', function (e) {
    pointer.x = e.clientX; pointer.y = e.clientY; pointer.has = true;
    useKeys = false;
  });

  canvas.addEventListener('pointerup', function (e) {
    e.preventDefault();
    if (!pdown) return;
    const moved = dist(e.clientX, e.clientY, pdown.x, pdown.y);
    const dtms = performance.now() - pdown.t;
    pdown = null;
    if (moved < 14 && dtms < 350) {
      primaryAction(e.clientX, e.clientY);
    }
  }, { passive: false });

  canvas.addEventListener('pointercancel', function () { pdown = null; });

  window.addEventListener('keydown', function (e) {
    ensureAudio();
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].indexOf(e.code) >= 0) e.preventDefault();
    keys[e.code] = true;
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'KeyA', 'KeyD', 'KeyW', 'KeyS'].indexOf(e.code) >= 0) useKeys = true;
    if (e.code === 'Space' || e.code === 'Enter') {
      if (state === ST_MENU) { resetGame(); state = ST_PLAY; snd.start(); }
      else if (state === ST_PAUSE) { state = ST_PLAY; graceUntil = Math.max(graceUntil, playTime + 0.6); }
      else if (state === ST_OVER && deathAnim > 0.8) { resetGame(); state = ST_PLAY; snd.start(); }
    }
    if (e.code === 'KeyP' && state === ST_PLAY) state = ST_PAUSE;
  });

  window.addEventListener('keyup', function (e) { keys[e.code] = false; });

  window.addEventListener('blur', function () {
    if (state === ST_PLAY) { state = ST_PAUSE; pausedByBlur = true; }
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && state === ST_PLAY) { state = ST_PAUSE; pausedByBlur = true; }
  });

  window.addEventListener('resize', resize);

  // ---------------------------------------------------------------
  // Kreslení — papír
  // ---------------------------------------------------------------
  function drawPaper() {
    paperCanvas.width = Math.round(W * DPR);
    paperCanvas.height = Math.round(H * DPR);
    const c = paperCtx;
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    // podklad — použitý papír
    c.fillStyle = '#f9f5e8';
    c.fillRect(0, 0, W, H);
    // lehké zažloutnutí okrajů
    const g = c.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(160,130,60,0.10)');
    c.fillStyle = g;
    c.fillRect(0, 0, W, H);
    // čtverečky
    const step = isSmall ? 26 : 32;
    c.strokeStyle = 'rgba(120,160,200,0.35)';
    c.lineWidth = 1;
    c.beginPath();
    for (let x = step / 2; x < W; x += step) { c.moveTo(x, 0); c.lineTo(x, H); }
    for (let y = step / 2; y < H; y += step) { c.moveTo(0, y); c.lineTo(W, y); }
    c.stroke();
    // okraj stránky — červená linka vlevo
    const mx = isSmall ? 34 : 58;
    c.strokeStyle = 'rgba(200,60,60,0.55)';
    c.lineWidth = 1.6;
    c.beginPath();
    c.moveTo(mx, 0); c.lineTo(mx, H);
    c.stroke();
    // dírky pro kroužkovou vazbu
    c.fillStyle = 'rgba(120,110,90,0.25)';
    for (let y = 40; y < H; y += 120) {
      c.beginPath(); c.arc(12, y, 4.5, 0, Math.PI * 2); c.fill();
    }
  }

  // dekorace okrajů — kreslí se živě (boiling)
  function drawDoodles(c) {
    c.save();
    c.strokeStyle = 'rgba(110,110,115,0.42)';
    c.fillStyle = 'rgba(110,110,115,0.42)';
    c.lineWidth = 1.4;
    // piškvorky vpravo nahoře (pod poznámkami učitele) — jen když je místo
    if (W > 480) {
      const px = W - (isSmall ? 66 : 96), py = isSmall ? 52 : 62, s = isSmall ? 14 : 18;
      for (let i = 1; i < 3; i++) {
        wobblyLine(c, px + i * s, py, px + i * s, py + 3 * s, 11 + i, 1.4, 4); c.stroke();
        wobblyLine(c, px, py + i * s, px + 3 * s, py + i * s, 21 + i, 1.4, 4); c.stroke();
      }
      // pár křížků a koleček
      const xko = function (x, y) {
        wobblyLine(c, x - 5, y - 5, x + 5, y + 5, x * 0.13, 1.2, 3); c.stroke();
        wobblyLine(c, x + 5, y - 5, x - 5, y + 5, y * 0.17, 1.2, 3); c.stroke();
      };
      xko(px + s * 0.5, py + s * 0.5);
      xko(px + s * 1.5, py + s * 1.5);
      wobblyCircle(c, px + s * 2.5, py + s * 0.5, 5.5, 33, 1.2, 8); c.stroke();
      wobblyCircle(c, px + s * 0.5, py + s * 2.5, 5.5, 34, 1.2, 8); c.stroke();
    }

    // srdíčko vlevo dole (nad tužkou s cooldownem)
    const hx = isSmall ? 22 : 30, hy = H - (isSmall ? 104 : 130);
    c.save();
    c.translate(hx, hy);
    c.beginPath();
    const hs = isSmall ? 7 : 9;
    for (let i = 0; i <= 24; i++) {
      const t = (i / 24) * Math.PI * 2;
      const xx = hs * 1.05 * Math.pow(Math.sin(t), 3);
      const yy = -hs * (1.05 * Math.cos(t) - 0.42 * Math.cos(2 * t) - 0.2 * Math.cos(3 * t) - 0.06 * Math.cos(4 * t)) / 1.6;
      const ox = jr(40 + i) * 1.2, oy = jr(60 + i) * 1.2;
      if (i === 0) c.moveTo(xx + ox, yy + oy); else c.lineTo(xx + ox, yy + oy);
    }
    c.closePath();
    c.stroke();
    c.restore();

    // zaškrtaná slovíčka vpravo dole
    if (!isSmall) {
      const wx = W - 150, wy = H - 88;
      c.font = "13px 'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', cursive";
      c.fillText('der Apfel', wx, wy);
      wobblyLine(c, wx - 3, wy - 4, wx + 62, wy - 5, 71, 1.6, 5); c.stroke();
      c.fillText('die Schlange', wx, wy + 20);
      wobblyLine(c, wx - 3, wy + 16, wx + 84, wy + 15, 72, 1.6, 5); c.stroke();
      c.fillText('die Pause', wx, wy + 40);
    }

    // malá dekorativní kaňka u okraje (tužková, ne herní)
    const kx = isSmall ? 20 : 34, ky = isSmall ? 60 : 110;
    c.beginPath();
    for (let i = 0; i <= 10; i++) {
      const a = (i / 10) * Math.PI * 2;
      const rr = 5 + jr(80 + (i % 10)) * 2.5;
      const xx = kx + Math.cos(a) * rr, yy = ky + Math.sin(a) * rr * 0.8;
      if (i === 0) c.moveTo(xx, yy); else c.lineTo(xx, yy);
    }
    c.closePath();
    c.fill();
    c.restore();
  }

  // ---------------------------------------------------------------
  // Kreslení — herní objekty
  // ---------------------------------------------------------------
  function drawInkBlots(c) {
    for (const b of blots) {
      c.save();
      c.translate(b.x, b.y);
      // sytě modročerný inkoust
      c.fillStyle = 'rgba(18,22,52,0.88)';
      c.beginPath();
      const n = b.pts.length;
      for (let i = 0; i <= n; i++) {
        const k = i % n;
        const a = (k / n) * Math.PI * 2;
        const rr = b.r * b.pts[k] + jr(b.seed + k * 5.7) * 3;
        const xx = Math.cos(a) * rr, yy = Math.sin(a) * rr;
        if (i === 0) c.moveTo(xx, yy); else c.lineTo(xx, yy);
      }
      c.closePath();
      c.fill();
      // kapičky okolo
      for (let i = 0; i < 3; i++) {
        const a = b.seed + i * 2.2;
        const dx = Math.cos(a * 3.3) * (b.r + 12 + i * 7);
        const dy = Math.sin(a * 2.1) * (b.r + 9 + i * 5);
        c.beginPath();
        c.arc(dx, dy, 2.5 + (i % 2), 0, Math.PI * 2);
        c.fill();
      }
      // lesklé oko kaňky
      c.fillStyle = 'rgba(190,200,240,0.18)';
      c.beginPath();
      c.ellipse(-b.r * 0.25, -b.r * 0.3, b.r * 0.28, b.r * 0.16, -0.6, 0, Math.PI * 2);
      c.fill();
      c.restore();
    }
  }

  function drawApple(c, x, y, r, rot, red, seed) {
    c.save();
    c.translate(x, y);
    c.rotate(rot || 0);
    c.lineWidth = red ? 2.4 : 2;
    if (red) {
      c.strokeStyle = '#c81e1e';
      c.fillStyle = 'rgba(230,60,60,0.16)';
    } else {
      c.strokeStyle = 'rgba(105,105,110,0.85)'; // tužka
      c.fillStyle = 'rgba(140,140,145,0.10)';
    }
    // tělo jablka — dvě laloky
    wobblyCircle(c, 0, 0, r, seed, red ? 1.6 : 2.4, 14);
    c.fill();
    c.stroke();
    // druhý tah — ruční kresba má dvojité čáry
    wobblyCircle(c, 0.8, 0.6, r * 0.96, seed + 50, red ? 1.8 : 2.8, 14);
    c.stroke();
    // důlek + stopka
    c.beginPath();
    c.moveTo(-2 + jr(seed + 3), -r + 1);
    c.quadraticCurveTo(1, -r - 6, 3 + jr(seed + 4) * 2, -r - 9);
    c.stroke();
    // lísteček
    if (red) {
      c.strokeStyle = '#1d7a37';
      c.beginPath();
      c.moveTo(3, -r - 6);
      c.quadraticCurveTo(10 + jr(seed + 5) * 2, -r - 12, 13, -r - 5);
      c.quadraticCurveTo(8, -r - 3, 3, -r - 6);
      c.stroke();
    } else {
      // u tužkového jablka šrafování
      c.beginPath();
      for (let i = -2; i <= 2; i++) {
        c.moveTo(i * 4 - 3, -r * 0.4 + jr(seed + i) * 2);
        c.lineTo(i * 4 + 3, r * 0.5 + jr(seed + i + 9) * 2);
      }
      c.globalAlpha = 0.35;
      c.stroke();
      c.globalAlpha = 1;
    }
    c.restore();
  }

  function drawPlayer(c) {
    // ochranná lhůta — přerušovaný kroužek
    if (state === ST_PLAY && playTime < graceUntil) {
      c.save();
      c.strokeStyle = 'rgba(200,30,30,' + (0.35 + 0.3 * Math.sin(playTime * 12)) + ')';
      c.lineWidth = 1.6;
      c.setLineDash([6, 5]);
      c.beginPath();
      c.arc(player.x, player.y, player.r + 9, 0, Math.PI * 2);
      c.stroke();
      c.restore();
    }
    // zpomalení kaňkou — brýle se šmouhou
    const slowed = playTime < player.slowUntil;
    drawApple(c, player.x, player.y, player.r, player.rot, true, 7);
    if (slowed) {
      c.save();
      c.fillStyle = 'rgba(20,26,60,0.4)';
      c.beginPath();
      c.arc(player.x, player.y, player.r * 0.75, 0, Math.PI * 2);
      c.fill();
      c.restore();
    }
  }

  function drawSnake(c) {
    const t = playTime;
    // tělo odzadu
    for (let i = snake.segs.length - 1; i >= 1; i--) {
      const s = snake.segs[i];
      c.lineWidth = 2;
      c.strokeStyle = '#2b4a9b';
      c.fillStyle = 'rgba(70,110,200,0.14)';
      wobblyCircle(c, s.x, s.y, snake.segR * (0.85 + 0.15 * Math.sin(i * 0.9)), i * 13.7, 1.6, 10);
      c.fill();
      c.stroke();
    }
    // hlava
    const h = snake.segs[0];
    const wig = snake.lungeState === 1 ? Math.sin(t * 55) * 3 : 0;
    c.save();
    c.translate(h.x + jr(1) * 0.5, h.y + wig * 0.4);
    c.rotate(snake.heading);
    c.lineWidth = 2.4;
    c.strokeStyle = snake.lungeState === 1 ? '#8a1d97' : '#2b4a9b';
    c.fillStyle = 'rgba(70,110,200,0.22)';
    wobblyCircle(c, 0, 0, snake.headR + 1.5, 999, 1.8, 12);
    c.fill();
    c.stroke();
    // oči
    c.fillStyle = '#1b2a6b';
    c.beginPath(); c.arc(4, -5, 2.2, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(4, 5, 2.2, 0, Math.PI * 2); c.fill();
    // jazyk
    const flick = Math.sin(t * 10) > 0.2 ? 1 : 0;
    if (flick) {
      c.strokeStyle = '#c81e1e';
      c.lineWidth = 1.6;
      c.beginPath();
      c.moveTo(snake.headR + 1, 0);
      c.lineTo(snake.headR + 9, -0.5);
      c.moveTo(snake.headR + 9, -0.5);
      c.lineTo(snake.headR + 13, -4);
      c.moveTo(snake.headR + 9, -0.5);
      c.lineTo(snake.headR + 13, 3);
      c.stroke();
    }
    c.restore();
    // zmrzlý had (zvonek) — zzz
    if (t < snake.frozenUntil) {
      c.save();
      c.fillStyle = '#b32020';
      c.font = (16 * UI) + "px 'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', cursive";
      c.fillText('zzz', h.x + 14, h.y - 14 - Math.sin(t * 4) * 3);
      c.restore();
    }
  }

  function drawQmark(c) {
    if (!qmark) return;
    // blikání před zmizením
    if (qmark.life < 2 && Math.floor(qmark.life * 6) % 2 === 0) return;
    c.save();
    c.translate(qmark.x, qmark.y);
    c.rotate(jr(qmark.seed) * 0.12);
    c.fillStyle = '#2b4a9b';
    c.strokeStyle = '#2b4a9b';
    const fs = 44 * UI;
    c.font = 'bold ' + fs + "px 'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', cursive";
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText('?', jr(qmark.seed + 1) * 2, jr(qmark.seed + 2) * 2);
    // kroužek okolo
    c.lineWidth = 1.8;
    wobblyCircle(c, 0, 2, fs * 0.62, qmark.seed + 9, 2.2, 14);
    c.stroke();
    c.restore();
  }

  function drawFakes(c) {
    for (const f of fakes) {
      drawApple(c, f.x, f.y, 12, jr(f.seed) * 0.1, false, f.seed);
    }
  }

  function drawFloats(c) {
    c.save();
    c.textAlign = 'center';
    for (const fl of floats) {
      c.globalAlpha = clamp(fl.life, 0, 1);
      c.fillStyle = fl.color;
      c.font = 'bold ' + (15 * UI + 3) + "px 'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', cursive";
      c.fillText(fl.text, fl.x, fl.y);
    }
    c.restore();
  }

  // ---------------------------------------------------------------
  // Kreslení — UI
  // ---------------------------------------------------------------
  function fontTeacher(px) {
    return 'bold ' + px + "px 'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', cursive";
  }

  function drawHUD(c) {
    c.save();
    c.fillStyle = '#b32020';
    c.textAlign = 'right';
    c.font = fontTeacher(isSmall ? 16 : 20);
    c.fillText('Čas: ' + Math.floor(playTime) + ' s', W - 14, isSmall ? 24 : 30);
    if (bestTime > 0) {
      c.font = fontTeacher(isSmall ? 11 : 13);
      c.globalAlpha = 0.75;
      c.fillText('Rekord: ' + Math.floor(bestTime) + ' s', W - 14, (isSmall ? 24 : 30) + (isSmall ? 16 : 19));
      c.globalAlpha = 1;
    }
    c.restore();

    // tužka s cooldownem — vlevo dole
    const px = isSmall ? 44 : 64, py = H - (isSmall ? 44 : 58);
    const R = isSmall ? 20 : 25;
    c.save();
    if (shakePencil > 0) {
      shakePencil = Math.max(0, shakePencil - 0.03);
      c.translate(px + Math.sin(shakePencil * 90) * 3, py);
    } else {
      c.translate(px, py);
    }
    // kroužek průběhu
    const prog = 1 - drawCooldown / DRAW_CD;
    c.lineWidth = 3.4;
    c.strokeStyle = 'rgba(120,120,125,0.3)';
    c.beginPath(); c.arc(0, 0, R, 0, Math.PI * 2); c.stroke();
    c.strokeStyle = prog >= 1 ? '#1d7a37' : '#b32020';
    c.beginPath(); c.arc(0, 0, R, -Math.PI / 2, -Math.PI / 2 + prog * Math.PI * 2); c.stroke();
    // tužka
    c.save();
    c.rotate(-0.7 + jr(5) * 0.05);
    c.lineWidth = 2;
    c.strokeStyle = '#6a6a6f';
    c.fillStyle = 'rgba(230,190,90,0.8)';
    c.beginPath();
    c.rect(-3.5, -R * 0.55, 7, R * 0.85);
    c.fill(); c.stroke();
    c.fillStyle = '#e8d9b0';
    c.beginPath();
    c.moveTo(-3.5, R * 0.3); c.lineTo(0, R * 0.62); c.lineTo(3.5, R * 0.3);
    c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#333';
    c.beginPath();
    c.moveTo(-1.2, R * 0.5); c.lineTo(0, R * 0.62); c.lineTo(1.2, R * 0.5);
    c.closePath(); c.fill();
    c.restore();
    // připraveno?
    if (prog >= 1) {
      c.fillStyle = '#1d7a37';
      c.font = fontTeacher(isSmall ? 10 : 12);
      c.textAlign = 'center';
      c.fillText('kresli!', 0, R + (isSmall ? 13 : 16));
    }
    c.restore();
  }

  function drawCenterText(c, lines) {
    c.save();
    c.textAlign = 'center';
    let y = H / 2 - (lines.length * 20);
    for (const ln of lines) {
      c.fillStyle = ln.color || '#b32020';
      c.font = fontTeacher(ln.size || 18);
      c.fillText(ln.text, W / 2 + (ln.dx || 0), y + (ln.dy || 0));
      y += (ln.size || 18) * 1.7;
    }
    c.restore();
  }

  function drawMenu(c) {
    c.save();
    c.textAlign = 'center';
    // nadpis
    const ts = isSmall ? 52 : 84;
    c.fillStyle = '#c81e1e';
    c.font = fontTeacher(ts);
    c.save();
    c.translate(W / 2, H * 0.3);
    c.rotate(-0.03 + jr(2) * 0.01);
    c.fillText('SVAČINA', 0, 0);
    // podtržení dvojitou čarou
    c.strokeStyle = '#c81e1e';
    c.lineWidth = 2.4;
    wobblyLine(c, -ts * 2.1, ts * 0.25, ts * 2.1, ts * 0.28, 91, 3, 8); c.stroke();
    wobblyLine(c, -ts * 2.05, ts * 0.34, ts * 2.0, ts * 0.36, 92, 3, 8); c.stroke();
    c.restore();

    c.fillStyle = '#2b4a9b';
    c.font = fontTeacher(isSmall ? 18 : 24);
    c.fillText('Jsi svačina. Uteč hadovi.', W / 2, H * 0.42);

    c.fillStyle = '#555';
    c.font = fontTeacher(isSmall ? 12 : 15);
    const cy = H * 0.52;
    const lh = isSmall ? 22 : 27;
    c.fillText('Myš nebo prst tě vede — jablko se koulí se setrvačností.', W / 2, cy);
    c.fillText('Kliknutím nakreslíš falešné jablko a hada napálíš.', W / 2, cy + lh);
    c.fillText('Otazníky pomáhají… většinou. Kaňkám se vyhni.', W / 2, cy + lh * 2);
    c.fillText('Šipky i WASD fungují taky.', W / 2, cy + lh * 3);

    const blink = Math.sin(performance.now() / 300) > -0.2;
    if (blink) {
      c.fillStyle = '#b32020';
      c.font = fontTeacher(isSmall ? 16 : 20);
      c.fillText('Klikni (nebo zmáčkni mezerník) a utíkej!', W / 2, H * 0.52 + lh * 4.6);
    }
    c.restore();

    // ukázkové jablko jako dekorace — jen kde je dost místa, mimo texty
    if (!isSmall && H > 520) drawApple(c, W * 0.14, H * 0.8, 16, performance.now() / 900, true, 42);
  }

  function drawPause(c) {
    c.save();
    c.fillStyle = 'rgba(249,245,232,0.82)';
    c.fillRect(0, 0, W, H);
    c.restore();
    drawCenterText(c, [
      { text: 'PŘESTÁVKA', size: isSmall ? 34 : 46, color: '#b32020' },
      { text: pausedByBlur ? 'Hra se pozastavila — okno ztratilo pozornost.' : 'Hra je pozastavená.', size: isSmall ? 13 : 16, color: '#555' },
      { text: 'Klikni nebo zmáčkni mezerník pro pokračování.', size: isSmall ? 14 : 18, color: '#2b4a9b' }
    ]);
  }

  function drawOver(c) {
    // ztlumit scénu
    c.save();
    c.fillStyle = 'rgba(249,245,232,' + clamp(deathAnim * 1.2, 0, 0.86) + ')';
    c.fillRect(0, 0, W, H);
    c.restore();
    if (deathAnim < 0.35) return;

    const g = finalGrade;
    c.save();
    c.textAlign = 'center';

    c.fillStyle = '#2b4a9b';
    c.font = fontTeacher(isSmall ? 22 : 30);
    c.fillText('CHRAMST! Sežráno.', W / 2, H * 0.24);

    c.fillStyle = '#555';
    c.font = fontTeacher(isSmall ? 14 : 18);
    c.fillText('Přežil jsi ' + playTime.toFixed(1) + ' s', W / 2, H * 0.31);

    // známka — červeně zakroužkovaná
    const gy = H * 0.47;
    const gr = isSmall ? 44 : 58;
    c.fillStyle = '#c81e1e';
    c.font = fontTeacher(isSmall ? 64 : 88);
    c.save();
    c.translate(W / 2, gy);
    c.rotate(-0.05 + jr(3) * 0.02);
    c.textBaseline = 'middle';
    c.fillText(g.g, 0, 4);
    c.restore();
    c.strokeStyle = '#c81e1e';
    c.lineWidth = 3;
    wobblyCircle(c, W / 2, gy, gr, 300, 4, 16); c.stroke();
    wobblyCircle(c, W / 2 + 2, gy + 1, gr + 3, 301, 4.5, 16); c.stroke();

    // komentář učitele
    c.fillStyle = '#b32020';
    c.font = fontTeacher(isSmall ? 14 : 19);
    c.save();
    c.translate(W / 2, H * 0.62);
    c.rotate(-0.015);
    c.fillText(g.c, 0, 0);
    c.restore();

    // rekord
    c.fillStyle = '#555';
    c.font = fontTeacher(isSmall ? 13 : 16);
    const isNew = Math.abs(playTime - bestTime) < 0.05 && playTime > 0;
    c.fillText('Nejlepší čas: ' + bestTime.toFixed(1) + ' s' + (isNew ? '  — nový rekord!' : ''), W / 2, H * 0.69);

    if (deathAnim > 0.8) {
      const blink = Math.sin(performance.now() / 300) > -0.2;
      if (blink) {
        c.fillStyle = '#2b4a9b';
        c.font = fontTeacher(isSmall ? 15 : 19);
        c.fillText('Klikni pro novou hru', W / 2, H * 0.78);
      }
    }
    c.restore();
  }

  // ---------------------------------------------------------------
  // Hlavní smyčka
  // ---------------------------------------------------------------
  let lastT = performance.now();

  function frame(tms) {
    requestAnimationFrame(frame);
    let dt = (tms - lastT) / 1000;
    lastT = tms;
    if (dt > 0.1) dt = 0.1; // po záseku neskákat
    boil = Math.floor(tms / 140) % 3;

    // pojistka: kdyby událost resize nepřišla, všimni si změny sám
    if (window.innerWidth !== W || window.innerHeight !== H) resize();

    if (state === ST_PLAY) {
      playTime += dt;
      updatePlayer(dt);
      updateSnake(dt);
      updateWorld(dt);
      checkDeath();
    } else if (state === ST_OVER) {
      deathAnim = Math.min(1, deathAnim + dt * 1.4);
    }

    // vykreslení
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (shake > 0) {
      ctx.translate(jr(500) * shake * 8, jr(501) * shake * 8);
    }
    ctx.drawImage(paperCanvas, 0, 0, W, H);
    drawDoodles(ctx);

    if (state === ST_MENU) {
      drawMenu(ctx);
    } else {
      drawInkBlots(ctx);
      drawFakes(ctx);
      drawQmark(ctx);
      drawSnake(ctx);
      drawPlayer(ctx);
      drawFloats(ctx);
      drawHUD(ctx);
      if (state === ST_PAUSE) drawPause(ctx);
      if (state === ST_OVER) drawOver(ctx);
    }
  }

  // ---------------------------------------------------------------
  // Start
  // ---------------------------------------------------------------
  resize();
  resetGame();     // svět připravený i pod menu
  state = ST_MENU;
  requestAnimationFrame(frame);

  // ladicí přístup (neškodí, konzole zůstává čistá)
  window.__svacina = {
    get state() { return state; },
    set state(v) { state = v; },
    player: player, snake: snake,
    get fakes() { return fakes; },
    get blots() { return blots; },
    get playTime() { return playTime; },
    get qmark() { return qmark; },
    resetGame: resetGame,
    startGame: function () { resetGame(); state = ST_PLAY; },
    setPointer: function (x, y) { pointer.x = x; pointer.y = y; pointer.has = true; useKeys = false; }
  };

})();
</script>
</body>
</html>
