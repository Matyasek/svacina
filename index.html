<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SVAČINA — uteč hadovi</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden; height: 100%;
    background: #f6f2e4;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; position: fixed; inset: 0; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
(function(){

/* ============================================================
   SVAČINA — Snake naruby. Jsi jablko, had tě chce sežrat.
   Vše v jednom souboru, jen canvas 2D + Web Audio.
   ============================================================ */

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

var FONT = '"Segoe Print","Bradley Hand","Chalkboard SE","Comic Sans MS",cursive';
var COL = {
  paper:  '#fdfaef',
  grid:   'rgba(126,170,210,0.45)',
  margin: 'rgba(224,110,110,0.75)',
  red:    '#c8202f',
  blue:   '#1d3fae',
  pencil: '#7d7d80',
  pencil2:'#98989c',
  ink:    '#141e56'
};

var W = 0, H = 0, DPR = 1;
var SMALL = false;          // malý displej -> méně kaněk, menší UI
var now = 0;                // herní čas aktuálního kola (s)
var wallNow = 0;            // reálný čas pro animace mimo hru (s)
var boil = 0;               // 0..2, přepínání variant čmáranic
var boilSlow = 0;           // pomalejší boiling pro velké plochy

/* ---------- deterministický šum pro roztřesené čáry ---------- */
function hash1(n){
  var s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return s - Math.floor(s);
}
function jit(seed, amp){
  // deterministicky roztřese podle seedu a aktuální boil fáze
  return (hash1(seed * 7.13 + boil * 91.7) - 0.5) * 2 * amp;
}
function jitS(seed, amp){ // pomalá varianta (kaňky)
  return (hash1(seed * 5.77 + boilSlow * 53.3) - 0.5) * 2 * amp;
}

/* ---------- kreslicí pomocníci: propiska / tužka ---------- */
function sketchLine(x1, y1, x2, y2, seed, amp){
  amp = (amp === undefined) ? 1.4 : amp;
  var n = 4;
  ctx.beginPath();
  ctx.moveTo(x1 + jit(seed, amp), y1 + jit(seed + 1, amp));
  for (var i = 1; i <= n; i++){
    var t = i / n;
    var x = x1 + (x2 - x1) * t;
    var y = y1 + (y2 - y1) * t;
    var a = (i === n) ? amp * 0.6 : amp;
    ctx.lineTo(x + jit(seed + i * 2, a), y + jit(seed + i * 2 + 1, a));
  }
  ctx.stroke();
}
function sketchCircle(x, y, r, seed, amp, fill){
  amp = (amp === undefined) ? Math.max(1, r * 0.09) : amp;
  var n = 12;
  ctx.beginPath();
  for (var i = 0; i <= n; i++){
    var a = (i / n) * Math.PI * 2;
    var rr = r + jit(seed + (i % n), amp);
    var px = x + Math.cos(a) * rr;
    var py = y + Math.sin(a) * rr;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  if (fill) ctx.fill();
  ctx.stroke();
}
function sketchEllipse(x, y, rx, ry, rot, seed, amp){
  amp = (amp === undefined) ? 2 : amp;
  var n = 14;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot || 0);
  ctx.beginPath();
  for (var i = 0; i <= n; i++){
    var a = (i / n) * Math.PI * 2;
    var px = Math.cos(a) * (rx + jit(seed + i, amp));
    var py = Math.sin(a) * (ry + jit(seed + i + 40, amp));
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.stroke();
  ctx.restore();
}
function penText(txt, x, y, size, color, align, rot, seed){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate((rot || 0) + jit((seed || 1) + 500, 0.012));
  ctx.font = size + 'px ' + FONT;
  ctx.fillStyle = color;
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(txt, jit((seed || 1) + 600, 1), jit((seed || 1) + 601, 1));
  ctx.restore();
}

/* ============================================================
   ZVUK — syntetický, Web Audio, aktivace až po interakci
   ============================================================ */
var AC = null;
var noiseBuf = null;
function ensureAudio(){
  if (!AC){
    try {
      var Ctor = window.AudioContext || window.webkitAudioContext;
      if (Ctor) AC = new Ctor();
      if (AC){
        noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
        var d = noiseBuf.getChannelData(0);
        for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended'){
    AC.resume().catch(function(){});
  }
}
function sNoise(dur, freq, q, gain, type){
  if (!AC || !noiseBuf) return;
  try {
    var src = AC.createBufferSource(); src.buffer = noiseBuf;
    var f = AC.createBiquadFilter();
    f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1;
    var g = AC.createGain();
    var t = AC.currentTime;
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(AC.destination);
    src.start(t); src.stop(t + dur + 0.02);
  } catch (e) {}
}
function sTone(freq, freqEnd, dur, gain, type){
  if (!AC) return;
  try {
    var o = AC.createOscillator();
    o.type = type || 'sine';
    var g = AC.createGain();
    var t = AC.currentTime;
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, freqEnd), t + dur);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
var snd = {
  scratch: function(){ sNoise(0.18, 2100, 1.2, 0.25); sNoise(0.12, 3600, 2, 0.12); },
  warn: function(){ sTone(190, 150, 0.12, 0.10, 'square'); setTimeout(function(){ sTone(190, 150, 0.12, 0.10, 'square'); }, 140); setTimeout(function(){ sTone(220, 170, 0.14, 0.12, 'square'); }, 300); },
  crunch: function(){ sNoise(0.22, 520, 0.8, 0.5, 'lowpass'); sTone(160, 55, 0.3, 0.28); },
  eatFake: function(){ sNoise(0.1, 900, 1, 0.2, 'lowpass'); sTone(240, 120, 0.14, 0.12); },
  eraser: function(){ sNoise(0.28, 1300, 0.9, 0.3); sTone(700, 1400, 0.22, 0.08, 'triangle'); },
  bell: function(){ sTone(1320, 1300, 0.7, 0.22); sTone(1980, 1950, 0.5, 0.10); },
  glasses: function(){ sTone(420, 150, 0.55, 0.2, 'sawtooth'); },
  blot: function(){ sTone(130, 70, 0.2, 0.25); setTimeout(function(){ sTone(110, 60, 0.25, 0.25); }, 160); },
  qspawn: function(){ sTone(880, 1100, 0.1, 0.06, 'triangle'); },
  start: function(){ sTone(520, 780, 0.15, 0.1, 'triangle'); }
};

/* ============================================================
   STAV HRY
   ============================================================ */
var STATE_MENU = 0, STATE_PLAY = 1, STATE_PAUSE = 2, STATE_OVER = 3;
var state = STATE_MENU;
var overAt = 0;          // wallNow smrti (blokuje okamžitý restart)

var bestTime = 0;
function loadBest(){
  try { bestTime = parseFloat(localStorage.getItem('svacina_best')) || 0; }
  catch (e) { bestTime = 0; }
}
function saveBest(v){
  try { localStorage.setItem('svacina_best', String(v)); } catch (e) {}
}
loadBest();

/* hráč — jablko */
var player = { x: 0, y: 0, vx: 0, vy: 0, rot: 0, r: 14.5, slowUntil: 0 };
var target = { x: 0, y: 0 };
var keys = {};
var graceUntil = 0;      // ochranná lhůta

/* had */
var snake = {
  x: 0, y: 0, ang: 0,
  segs: [],              // [{x,y}]
  pendingGrow: 0,
  growTimer: 0,
  lunge: 'idle',         // idle | tele | sprint
  lungeT: 0,             // čas do konce fáze
  lungeDirX: 1, lungeDirY: 0,
  nextLungeAt: 0,
  frozenUntil: 0,        // zvonek
  stuckTime: 0,          // anti-orbit
  brakeUntil: 0
};
var SEG_SPACING = 13, SEG_R = 8.5, HEAD_R = 11;

/* svět */
var fakes = [];          // {x,y,auto,seed}
var fakeRespawnAt = -1;  // čas, kdy nakreslit nové auto jablko (-1 = nic nečeká)
var drawCooldownUntil = 0;
var DRAW_COOLDOWN = 6;
var blots = [];          // {x,y,r,shape:[..],seed}
var qmark = null;        // {x,y,bornAt,dieAt,seed}
var nextQAt = 0;
var floaters = [];       // {txt,x,y,bornAt,color}
var deathFx = 0;         // wallNow času smrti pro efekt

var finalTime = 0;

/* okraje hřiště */
var MARGIN_L = 52, MARGIN_T = 12, MARGIN_R = 12, MARGIN_B = 12;

function playW(){ return W - MARGIN_L - MARGIN_R; }
function playH(){ return H - MARGIN_T - MARGIN_B; }

function rand(a, b){ return a + Math.random() * (b - a); }
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function dist(ax, ay, bx, by){ var dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); }

/* ============================================================
   RESIZE + papír
   ============================================================ */
var paperCache = null;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  SMALL = Math.min(W, H) < 620;
  MARGIN_L = SMALL ? 34 : 52;
  buildPaper();
  clampEntities();
}
function buildPaper(){
  paperCache = document.createElement('canvas');
  paperCache.width = Math.round(W * DPR);
  paperCache.height = Math.round(H * DPR);
  var p = paperCache.getContext('2d');
  p.setTransform(DPR, 0, 0, DPR, 0, 0);
  p.fillStyle = COL.paper;
  p.fillRect(0, 0, W, H);
  // čtverečky
  var cell = SMALL ? 22 : 26;
  p.strokeStyle = COL.grid;
  p.lineWidth = 0.7;
  p.beginPath();
  for (var x = cell; x < W; x += cell){ p.moveTo(x + 0.5, 0); p.lineTo(x + 0.5, H); }
  for (var y = cell; y < H; y += cell){ p.moveTo(0, y + 0.5); p.lineTo(W, y + 0.5); }
  p.stroke();
  // okrajová linka
  p.strokeStyle = COL.margin;
  p.lineWidth = 1.6;
  p.beginPath();
  p.moveTo(MARGIN_L - 8, 0); p.lineTo(MARGIN_L - 8, H);
  p.stroke();
  // jemné ztmavení rohů — použitý sešit
  var g = p.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(90,70,30,0.10)');
  p.fillStyle = g;
  p.fillRect(0, 0, W, H);
}
function clampEntities(){
  player.x = clamp(player.x, MARGIN_L + player.r, W - MARGIN_R - player.r);
  player.y = clamp(player.y, MARGIN_T + player.r, H - MARGIN_B - player.r);
  snake.x = clamp(snake.x, MARGIN_L, W - MARGIN_R);
  snake.y = clamp(snake.y, MARGIN_T, H - MARGIN_B);
  var i;
  for (i = 0; i < fakes.length; i++){
    fakes[i].x = clamp(fakes[i].x, MARGIN_L + 20, W - MARGIN_R - 20);
    fakes[i].y = clamp(fakes[i].y, MARGIN_T + 20, H - MARGIN_B - 20);
  }
  for (i = 0; i < blots.length; i++){
    blots[i].x = clamp(blots[i].x, MARGIN_L + blots[i].r, W - MARGIN_R - blots[i].r);
    blots[i].y = clamp(blots[i].y, MARGIN_T + blots[i].r, H - MARGIN_B - blots[i].r);
  }
  if (qmark){
    qmark.x = clamp(qmark.x, MARGIN_L + 30, W - MARGIN_R - 30);
    qmark.y = clamp(qmark.y, MARGIN_T + 40, H - MARGIN_B - 30);
  }
  target.x = clamp(target.x, 0, W);
  target.y = clamp(target.y, 0, H);
}
window.addEventListener('resize', resize);

/* ============================================================
   START KOLA
   ============================================================ */
function makeBlotShape(){
  var pts = [];
  var n = 9;
  for (var i = 0; i < n; i++) pts.push(0.72 + Math.random() * 0.5);
  return pts;
}
function placeBlots(){
  blots = [];
  var count = SMALL ? 2 : (4 + (Math.random() < 0.5 ? 1 : 0));
  var margin = Math.min(140, Math.min(playW(), playH()) * 0.18);
  var scale = clamp(Math.min(playW(), playH()) / 760, 0.7, 1.25);
  var tries = 0;
  while (blots.length < count && tries < 300){
    tries++;
    var r = rand(38, 58) * scale * (SMALL ? 0.85 : 1);
    var x = rand(MARGIN_L + margin + r, W - MARGIN_R - margin - r);
    var y = rand(MARGIN_T + margin + r, H - MARGIN_B - margin - r);
    if (!(x > MARGIN_L + margin + r)) continue;
    var ok = dist(x, y, player.x, player.y) > 170;
    for (var i = 0; i < blots.length && ok; i++){
      if (dist(x, y, blots[i].x, blots[i].y) < blots[i].r + r + 130) ok = false;
    }
    if (ok) blots.push({ x: x, y: y, r: r, shape: makeBlotShape(), seed: Math.random() * 1000 });
  }
}
function addExtraBlot(){
  var tries = 0;
  while (tries < 200){
    tries++;
    var r = rand(36, 52) * clamp(Math.min(playW(), playH()) / 760, 0.7, 1.25);
    var x = rand(MARGIN_L + 80 + r, W - MARGIN_R - 80 - r);
    var y = rand(MARGIN_T + 80 + r, H - MARGIN_B - 80 - r);
    var ok = dist(x, y, player.x, player.y) > 140;
    for (var i = 0; i < blots.length && ok; i++){
      if (dist(x, y, blots[i].x, blots[i].y) < blots[i].r + r + 90) ok = false;
    }
    if (ok){ blots.push({ x: x, y: y, r: r, shape: makeBlotShape(), seed: Math.random() * 1000 }); return; }
  }
}
function spawnAutoFake(){
  var tries = 0;
  while (tries < 200){
    tries++;
    var x = rand(MARGIN_L + 50, W - MARGIN_R - 50);
    var y = rand(MARGIN_T + 50, H - MARGIN_B - 50);
    if (dist(x, y, snake.x, snake.y) < Math.min(320, playW() * 0.35)) continue;
    if (dist(x, y, player.x, player.y) < 90) continue;
    fakes.push({ x: x, y: y, auto: true, seed: Math.random() * 1000 });
    return;
  }
  fakes.push({ x: MARGIN_L + 60, y: MARGIN_T + 60, auto: true, seed: Math.random() * 1000 });
}
function resetGame(){
  now = 0;
  finalTime = 0;
  player.x = MARGIN_L + playW() * 0.30;
  player.y = MARGIN_T + playH() * 0.62;
  player.vx = 0; player.vy = 0; player.rot = 0; player.slowUntil = 0;
  target.x = player.x; target.y = player.y;
  keys = {};

  snake.x = MARGIN_L + playW() * 0.85;
  snake.y = MARGIN_T + playH() * 0.15;
  snake.ang = Math.PI * 0.75;
  snake.segs = [];
  for (var i = 0; i < 12; i++){
    snake.segs.push({
      x: snake.x - Math.cos(snake.ang) * SEG_SPACING * (i + 1),
      y: snake.y - Math.sin(snake.ang) * SEG_SPACING * (i + 1)
    });
  }
  snake.pendingGrow = 0; snake.growTimer = 0;
  snake.lunge = 'idle'; snake.lungeT = 0;
  snake.nextLungeAt = rand(8, 14);
  snake.frozenUntil = 0; snake.stuckTime = 0; snake.brakeUntil = 0;

  fakes = [];
  fakeRespawnAt = -1;
  spawnAutoFake();
  drawCooldownUntil = 0;
  placeBlots();
  qmark = null;
  nextQAt = rand(6, 10);
  floaters = [];
  graceUntil = 2;
  state = STATE_PLAY;
  snd.start();
}

/* ============================================================
   OBTÍŽNOST
   ============================================================ */
function snakeBaseSpeed(t){
  if (t < 60) return 150 + t * (115 / 60);        // 150 -> 265 (hráč max 250)
  if (t < 120) return 265 + (t - 60) * 0.5;        // -> 295
  return 295 + (t - 120) * 0.45;                   // bez stropu
}
function lungeInterval(t){
  var d = clamp(t / 210, 0, 1);
  return rand(1, 1.6) * (8 - d * 5.6) + (1 - d) * 3; // ~8-14 s zkraje, ~2-4 s pozdě
}
function lungeSpeedMult(t){
  return 1.7 + clamp(t / 240, 0, 1) * 0.45;
}
var PLAYER_MAX = 250;
var PLAYER_STEER = 4.2;

/* ============================================================
   UPDATE
   ============================================================ */
function inBlot(x, y, extra){
  for (var i = 0; i < blots.length; i++){
    if (dist(x, y, blots[i].x, blots[i].y) < blots[i].r * 0.92 + (extra || 0)) return true;
  }
  return false;
}

function keyboardDir(){
  var dx = 0, dy = 0;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) dx -= 1;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += 1;
  if (keys['ArrowUp'] || keys['w'] || keys['W']) dy -= 1;
  if (keys['ArrowDown'] || keys['s'] || keys['S']) dy += 1;
  if (dx === 0 && dy === 0) return null;
  var l = Math.sqrt(dx * dx + dy * dy);
  return { x: dx / l, y: dy / l };
}

function updatePlayer(dt){
  var slowMul = 1;
  if (now < player.slowUntil) slowMul *= 0.55;                 // kaňka na brýle
  if (inBlot(player.x, player.y, 0)) slowMul *= 0.42;          // inkoustová kaňka
  var maxV = PLAYER_MAX * slowMul;

  var kd = keyboardDir();
  var desX, desY;
  if (kd){
    desX = kd.x * maxV; desY = kd.y * maxV;
  } else {
    var dx = target.x - player.x, dy = target.y - player.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d < 1){ desX = 0; desY = 0; }
    else {
      var sp = Math.min(maxV, d * 3.2);   // dojezd k cíli
      desX = dx / d * sp; desY = dy / d * sp;
    }
  }
  // setrvačné řízení: klouže, zrychluje, brzdí
  var k = PLAYER_STEER * slowMul;
  player.vx += (desX - player.vx) * Math.min(1, k * dt);
  player.vy += (desY - player.vy) * Math.min(1, k * dt);

  player.x += player.vx * dt;
  player.y += player.vy * dt;

  // měkké stěny
  var minX = MARGIN_L + player.r, maxX = W - MARGIN_R - player.r;
  var minY = MARGIN_T + player.r, maxY = H - MARGIN_B - player.r;
  if (player.x < minX){ player.x = minX; if (player.vx < 0) player.vx *= -0.25; }
  if (player.x > maxX){ player.x = maxX; if (player.vx > 0) player.vx *= -0.25; }
  if (player.y < minY){ player.y = minY; if (player.vy < 0) player.vy *= -0.25; }
  if (player.y > maxY){ player.y = maxY; if (player.vy > 0) player.vy *= -0.25; }

  // rotace kutálení
  var speed = Math.sqrt(player.vx * player.vx + player.vy * player.vy);
  var dir = (Math.abs(player.vx) > Math.abs(player.vy)) ? (player.vx >= 0 ? 1 : -1) : (player.vy >= 0 ? 1 : -1);
  player.rot += (speed / player.r) * dt * dir * 0.7;
}

function snakeTargetPoint(){
  // nejbližší lákadlo: hráč, nebo falešné jablko
  var bx = player.x, by = player.y;
  var bd = dist(snake.x, snake.y, bx, by);
  var isPlayer = true;
  for (var i = 0; i < fakes.length; i++){
    var d = dist(snake.x, snake.y, fakes[i].x, fakes[i].y);
    if (d < bd){ bd = d; bx = fakes[i].x; by = fakes[i].y; isPlayer = false; }
  }
  // nadbíhání: od 60 s míří tam, kam se jablko kutálí
  if (isPlayer && now > 60){
    var blend = clamp((now - 60) / 10, 0, 1);
    var sp = snakeBaseSpeed(now);
    var lead = Math.min(0.55, bd / Math.max(1, sp));
    bx += player.vx * lead * blend;
    by += player.vy * lead * blend;
    bx = clamp(bx, MARGIN_L, W - MARGIN_R);
    by = clamp(by, MARGIN_T, H - MARGIN_B);
  }
  return { x: bx, y: by, d: bd, isPlayer: isPlayer };
}

function updateSnake(dt){
  var frozen = now < snake.frozenUntil;
  var tp = snakeTargetPoint();
  var speed = snakeBaseSpeed(now);

  if (!frozen){
    // výpady
    if (snake.lunge === 'idle'){
      if (now >= snake.nextLungeAt && tp.d < Math.max(W, H)){
        snake.lunge = 'tele';
        snake.lungeT = 0.5;
        snd.warn();
      }
    } else if (snake.lunge === 'tele'){
      snake.lungeT -= dt;
      if (snake.lungeT <= 0){
        snake.lunge = 'sprint';
        snake.lungeT = 0.95;
        var dx = tp.x - snake.x, dy = tp.y - snake.y;
        var d = Math.max(1, Math.sqrt(dx * dx + dy * dy));
        snake.lungeDirX = dx / d; snake.lungeDirY = dy / d;
        snake.ang = Math.atan2(dy, dx);
      }
    } else if (snake.lunge === 'sprint'){
      snake.lungeT -= dt;
      if (snake.lungeT <= 0){
        snake.lunge = 'idle';
        snake.nextLungeAt = now + lungeInterval(now);
      }
    }

    if (snake.lunge === 'sprint'){
      // sprint po přímce, bez zatáčení
      var sv = speed * lungeSpeedMult(now);
      snake.x += snake.lungeDirX * sv * dt;
      snake.y += snake.lungeDirY * sv * dt;
      // náraz do stěny sprint ukončí
      if (snake.x < MARGIN_L || snake.x > W - MARGIN_R || snake.y < MARGIN_T || snake.y > H - MARGIN_B){
        snake.x = clamp(snake.x, MARGIN_L, W - MARGIN_R);
        snake.y = clamp(snake.y, MARGIN_T, H - MARGIN_B);
        snake.lunge = 'idle';
        snake.nextLungeAt = now + lungeInterval(now);
      }
    } else {
      // plynulé zatáčení k cíli; rychlost = plná (blízkost hada je nebezpečí)
      var v = speed;
      if (snake.lunge === 'tele') v = speed * 0.35;  // zavrtění na místě
      if (now < snake.brakeUntil) v = speed * 0.55;  // poslední záchrana proti kroužení

      var wantAng = Math.atan2(tp.y - snake.y, tp.x - snake.x);
      var da = wantAng - snake.ang;
      while (da > Math.PI) da -= Math.PI * 2;
      while (da < -Math.PI) da += Math.PI * 2;

      // poloměr zatáčky: daleko široký (roste s rychlostí), blízko ostrý
      var d = tp.d;
      var Rfar = 85 + v * 0.30;
      var Rnear = Math.max(11, d * 0.34);
      var mixT = clamp((d - 60) / 240, 0, 1);
      var R = Rnear + (Rfar - Rnear) * mixT;
      var maxTurn = (v / R) * dt;
      if (Math.abs(da) < maxTurn) snake.ang = wantAng;
      else snake.ang += (da > 0 ? 1 : -1) * maxTurn;

      snake.x += Math.cos(snake.ang) * v * dt;
      snake.y += Math.sin(snake.ang) * v * dt;
      snake.x = clamp(snake.x, MARGIN_L, W - MARGIN_R);
      snake.y = clamp(snake.y, MARGIN_T, H - MARGIN_B);

      // anti-orbit hlídka: dlouho blízko cíle a nic -> krátce přibrzdi
      if (d < 110 && snake.lunge === 'idle'){
        snake.stuckTime += dt;
        if (snake.stuckTime > 3){
          snake.brakeUntil = now + 0.6;
          snake.stuckTime = 0;
        }
      } else {
        snake.stuckTime = Math.max(0, snake.stuckTime - dt * 2);
      }
    }
  } else {
    snake.lunge = 'idle';
  }

  // řetěz článků
  var px = snake.x, py = snake.y;
  for (var i = 0; i < snake.segs.length; i++){
    var s = snake.segs[i];
    var dx = px - s.x, dy = py - s.y;
    var d2 = Math.sqrt(dx * dx + dy * dy);
    if (d2 > SEG_SPACING){
      var move = d2 - SEG_SPACING;
      s.x += dx / d2 * move;
      s.y += dy / d2 * move;
    }
    px = s.x; py = s.y;
  }

  // růst po článku (viditelná příčina = žrádlo)
  if (snake.pendingGrow > 0){
    snake.growTimer -= dt;
    if (snake.growTimer <= 0){
      var last = snake.segs[snake.segs.length - 1];
      snake.segs.push({ x: last.x, y: last.y });
      snake.pendingGrow--;
      snake.growTimer = 0.09;
    }
  }

  // žraní falešných jablek
  for (var j = fakes.length - 1; j >= 0; j--){
    if (dist(snake.x, snake.y, fakes[j].x, fakes[j].y) < HEAD_R + 12){
      var wasAuto = fakes[j].auto;
      fakes.splice(j, 1);
      snake.pendingGrow += 4;
      snd.eatFake();
      addFloater('Chramst!', snake.x, snake.y - 24, COL.blue);
      if (wasAuto && fakeRespawnAt < 0){
        var fast = now > 120;
        fakeRespawnAt = now + (fast ? rand(1.2, 1.8) : rand(2, 3));
      }
    }
  }
  // automatická falešná jablka: vždy aspoň jedno (nejvýš dvě auto)
  var autoCount = 0;
  for (var k2 = 0; k2 < fakes.length; k2++) if (fakes[k2].auto) autoCount++;
  var wantAuto = now > 100 ? 2 : 1;
  if (autoCount < wantAuto){
    if (fakeRespawnAt < 0) fakeRespawnAt = now + (now > 120 ? rand(1.2, 1.8) : rand(2, 3));
    if (now >= fakeRespawnAt){
      spawnAutoFake();
      snd.scratch();
      fakeRespawnAt = -1;
    }
  } else {
    fakeRespawnAt = -1;
  }
}

function checkCollisions(){
  if (now < graceUntil) return;
  // celé tělo hada je smrtící; tolerance ve prospěch hráče
  var tol = 0.72;
  if (dist(player.x, player.y, snake.x, snake.y) < (player.r + HEAD_R) * tol){ die(); return; }
  for (var i = 0; i < snake.segs.length; i++){
    var s = snake.segs[i];
    if (dist(player.x, player.y, s.x, s.y) < (player.r + SEG_R) * tol){ die(); return; }
  }
}

function die(){
  finalTime = now;
  state = STATE_OVER;
  overAt = wallNow;
  deathFx = wallNow;
  snd.crunch();
  if (finalTime > bestTime){
    bestTime = finalTime;
    saveBest(bestTime);
  }
}

function addFloater(txt, x, y, color){
  floaters.push({ txt: txt, x: x, y: y, bornAt: now, color: color || COL.red });
}

function updateQmark(dt){
  if (!qmark && now >= nextQAt){
    var tries = 0;
    while (tries < 150){
      tries++;
      var x = rand(MARGIN_L + 60, W - MARGIN_R - 60);
      var y = rand(MARGIN_T + 70, H - MARGIN_B - 60);
      if (dist(x, y, snake.x, snake.y) < 230) continue;
      if (inBlot(x, y, 20)) continue;
      qmark = { x: x, y: y, bornAt: now, dieAt: now + 7, seed: Math.random() * 1000 };
      snd.qspawn();
      break;
    }
    if (!qmark) nextQAt = now + 3;
  }
  if (qmark){
    if (now > qmark.dieAt){
      qmark = null;
      nextQAt = now + rand(9, 15);
    } else if (dist(player.x, player.y, qmark.x, qmark.y) < player.r + 22){
      applyQuestion(qmark.x, qmark.y);
      qmark = null;
      nextQAt = now + rand(9, 15);
    }
  }
}
function applyQuestion(x, y){
  var r = Math.random();
  if (r < 0.35){
    // GUMA — smaž hadovi ocas
    var n = Math.min(6, Math.max(0, snake.segs.length - 6));
    snake.segs.length = snake.segs.length - n;
    snake.pendingGrow = 0;
    addFloater('GUMA!', x, y - 28, COL.red);
    snd.eraser();
  } else if (r < 0.70){
    // ZVONEK — přestávka
    snake.frozenUntil = now + 2;
    addFloater('ZVONEK! Přestávka!', x, y - 28, COL.red);
    snd.bell();
  } else if (r < 0.85){
    player.slowUntil = now + 4;
    addFloater('Kaňka na brýle…', x, y - 28, COL.ink);
    snd.glasses();
  } else {
    addExtraBlot();
    addFloater('Nová kaňka!', x, y - 28, COL.ink);
    snd.blot();
  }
}

function update(dt){
  now += dt;
  updatePlayer(dt);
  updateSnake(dt);
  updateQmark(dt);
  checkCollisions();
  for (var i = floaters.length - 1; i >= 0; i--){
    if (now - floaters[i].bornAt > 1.4) floaters.splice(i, 1);
  }
}

function drawBlots(){
  ctx.fillStyle = COL.ink;
  for (var i = 0; i < blots.length; i++){
    var b = blots[i];
    ctx.beginPath();
    var n = b.shape.length;
    for (var j = 0; j <= n; j++){
      var k = j % n;
      var a = (k / n) * Math.PI * 2;
      var rr = b.r * b.shape[k] + jitS(b.seed + k, 1.6);  // klidný okraj
      var x = b.x + Math.cos(a) * rr;
      var y = b.y + Math.sin(a) * rr;
      if (j === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.globalAlpha = 0.9;
    ctx.fill();
    ctx.globalAlpha = 1;
    // kapičky okolo
    ctx.beginPath();
    ctx.arc(b.x + b.r * 0.9, b.y - b.r * 0.75, 3.5, 0, Math.PI * 2);
    ctx.arc(b.x - b.r * 0.85, b.y + b.r * 0.8, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawApple(x, y, r, rot, ghost){

  ctx.beginPath();

  ctx.beginPath();
  ctx.arc(-r * 0.35, -r * 0.3, r * 0.45, Math.PI * 1.05, Math.PI * 1.55);
  ctx.stroke();
  ctx.restore();
}

function drawPlayer(){
  // ochranná lhůta: čárkovaný kroužek
  if (now < graceUntil && state === STATE_PLAY){
    ctx.save();
    ctx.strokeStyle = COL.red;
    ctx.globalAlpha = 0.6;
    ctx.setLineDash([6, 6]);
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r + 9 + Math.sin(wallNow * 8) * 2, 0, Math.PI * 2);

  ctx.strokeStyle = COL.pencil;
  ctx.lineWidth = 1.6;
  sketchLine(tx, ty, tx + tw, ty, 720, 2);
  sketchLine(tx + tw, ty, tx + tw, ty + th, 721, 2);
  sketchLine(tx + tw, ty + th, tx, ty + th, 722, 2);
  sketchLine(tx, ty + th, tx, ty, 723, 2);

  var fs = SMALL ? 12.5 : 15;
  var lh = SMALL ? 24 : 28;
  var yy = ty + (SMALL ? 22 : 26);
  penText('TAHÁK (neukazovat učiteli!)', tx + tw / 2, yy, fs + 3, COL.pencil, 'center', 0, 730); yy += lh + 2;
  penText('✎ Klik / ťuk = nakreslíš falešné jablko. Had skočí na blbost.', tx + 14, yy, fs, COL.pencil, 'left', 0, 731); yy += lh;
  penText('? Otazník: guma ✓, zvonek ✓ — kaňka na brýle ✗, nová kaňka ✗', tx + 14, yy, fs, COL.pencil, 'left', 0, 732); yy += lh;
  penText('Kaňky brzdí jen tebe. Had po nich klouže jak po žákovské.', tx + 14, yy, fs, COL.pencil, 'left', 0, 733); yy += lh;
  penText('Had je za minutu rychlejší než ty — kličkuj, nesprintuj.', tx + 14, yy, fs, COL.pencil, 'left', 0, 734); yy += lh;
  penText('Známky: 15 s = 5 · 60 s = 3 · 120 s = 2 · 210 s = 1', tx + 14, yy, fs, COL.red, 'left', 0, 735); yy += lh;
  penText('330 s = pochvala ředitele školy (legenda)', tx + 14, yy, fs, COL.red, 'left', 0, 736);
  ctx.restore();

  // jak začít
  var by = ty + th + (SMALL ? 34 : 46);
  var blink = 0.65 + 0.35 * Math.sin(wallNow * 3);
  ctx.globalAlpha = blink;
  penText(SMALL ? 'Ťukni a utíkej!' : 'Klikni nebo zmáčkni MEZERNÍK a utíkej!', cx, by, SMALL ? 18 : 23, COL.blue, 'center', -0.01, 740);
  ctx.globalAlpha = 1;
  penText('Myš / prst = kam se kutálet · klik = tužka · šipky i WASD jedou', cx, by + (SMALL ? 26 : 32), SMALL ? 12 : 14, COL.pencil, 'center', 0, 741);
  if (bestTime > 0){
    penText('Rekord třídy: ' + Math.floor(bestTime) + ' s', cx, by + (SMALL ? 48 : 60), SMALL ? 14 : 17, COL.red, 'center', -0.02, 742);
  }
  ctx.restore();
}

function gradeFor(t){
  if (t < 15) return { g: '5', c: 'Pětka. Sedni si. A přines žákovskou, tohle si rodiče přečtou.' };
  if (t < 30) return { g: '4', c: 'Čtyřka. Tomu říkáš útěk? Já tomu říkám čekání na oběd.' };
  if (t < 60) return { g: '3', c: 'Trojka. Průměr. Jako celá tahle třída po prázdninách.' };
  if (t < 120) return { g: '2', c: 'Dvojka. Vida, ono to jde, když se nekoukáš z okna.' };
  if (t < 210) return { g: '1', c: 'Jednička! Kdo ti to napsal? …No dobře. Sedni si, génie.' };
  if (t < 330) return { g: '1*', c: 'Jednička s hvězdičkou! Tohle jde na nástěvku vedle ředitelny.' };
  return { g: 'POCHVALA ŘEDITELE', c: 'POCHVALA ŘEDITELE ŠKOLY. Had podal žádost o přeložení na jinou školu.' };
}

function wrapText(txt, x, y, maxW, lh, size, color){
  ctx.font = size + 'px ' + FONT;
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  var words = txt.split(' ');
  var line = '';
  var yy = y;
  for (var i = 0; i < words.length; i++){
    var test = line ? line + ' ' + words[i] : words[i];
    if (ctx.measureText(test).width > maxW && line){
      ctx.fillText(line, x, yy);
      line = words[i];
      yy += lh;
    } else line = test;
  }
  if (line) ctx.fillText(line, x, yy);
  return yy + lh;
}

function drawOver(){
  var cx = W / 2;
  var gr = gradeFor(finalTime);
  var top = H * (SMALL ? 0.10 : 0.14);

  // sežráno
  penText('SEŽRÁNO!', cx, top, SMALL ? 34 : 46, COL.blue, 'center', -0.02, 801);
  penText('Přežito: ' + Math.floor(finalTime) + ' s', cx, top + (SMALL ? 44 : 58), SMALL ? 18 : 24, COL.red, 'center', 0.01, 802);

  // známka v červeném kroužku
  var gy = top + (SMALL ? 120 : 150);
  var big = gr.g.length <= 2;
  ctx.save();
  ctx.translate(cx, gy);
  ctx.rotate(-0.05 + jit(803, 0.01));
  ctx.font = 'bold ' + (big ? (SMALL ? 64 : 84) : (SMALL ? 17 : 24)) + 'px ' + FONT;
  ctx.fillStyle = COL.red;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(gr.g, jit(804, 2), jit(805, 2));
  ctx.strokeStyle = COL.red;
  ctx.lineWidth = 2.6;
  var ew = big ? (SMALL ? 52 : 68) : (SMALL ? 128 : 175);
  sketchEllipse(0, 0, ew, big ? (SMALL ? 44 : 56) : (SMALL ? 30 : 40), 0.06, 806, 3);
  ctx.lineWidth = 1.4;
  sketchEllipse(1, 2, ew * 1.06, (big ? (SMALL ? 44 : 56) : (SMALL ? 30 : 40)) * 1.1, 0.03, 807, 3);
  ctx.restore();

  // komentář učitele
  var cy = gy + (SMALL ? 76 : 96);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-0.012);
  ctx.translate(-cx, -cy);
  cy = wrapText(gr.c, cx, cy, Math.min(W - 44, 560), SMALL ? 22 : 27, SMALL ? 15 : 19, COL.red);
  ctx.restore();

  var ry = cy + (SMALL ? 16 : 26);
  if (bestTime > 0){
    var isNew = Math.floor(finalTime) >= Math.floor(bestTime) && finalTime >= bestTime;
    penText((isNew ? 'NOVÝ REKORD: ' : 'Rekord: ') + Math.floor(bestTime) + ' s', cx, ry, SMALL ? 15 : 18, isNew ? COL.blue : COL.pencil, 'center', 0.01, 810);
    ry += SMALL ? 28 : 34;
  }
  if (wallNow - overAt > 0.7){
    var blink = 0.65 + 0.35 * Math.sin(wallNow * 3);
    ctx.globalAlpha = blink;
    penText('Klikni nebo zmáčkni MEZERNÍK — oprava známky!', cx, ry + 8, SMALL ? 15 : 19, COL.blue, 'center', -0.01, 811);
    ctx.globalAlpha = 1;
  }
}

function drawPause(){
  ctx.fillStyle = 'rgba(253,250,239,0.72)';
  ctx.fillRect(0, 0, W, H);
  penText('PŘESTÁVKA', W / 2, H * 0.42, SMALL ? 30 : 42, COL.blue, 'center', -0.02, 901);
  penText('Zvonilo? Klikni a zpátky do lavice.', W / 2, H * 0.42 + (SMALL ? 42 : 56), SMALL ? 15 : 20, COL.red, 'center', 0.01, 902);
  penText('Čas: ' + Math.floor(now) + ' s', W / 2, H * 0.42 + (SMALL ? 70 : 92), SMALL ? 13 : 16, COL.pencil, 'center', 0, 903);
}

function draw(){
  boil = Math.floor(wallNow * 6) % 3;
  boilSlow = Math.floor(wallNow * 2) % 3;
  ctx.clearRect(0, 0, W, H);
  if (paperCache) ctx.drawImage(paperCache, 0, 0, W, H);
  drawDecor();

  if (state === STATE_MENU){
    drawMenu();
    return;
  }

  drawBlots();
  for (var i = 0; i < fakes.length; i++) drawFake(fakes[i]);
  drawQmark();
  drawSnake();
  drawPlayer();
  drawFloaters();
  drawHUD();

  if (state === STATE_PAUSE) drawPause();
  if (state === STATE_OVER){
    // ztlumený podklad + vysvědčení
    ctx.fillStyle = 'rgba(253,250,239,0.82)';
    ctx.fillRect(0, 0, W, H);
    // krátký "křup" efekt
    if (wallNow - deathFx < 0.25){
      ctx.fillStyle = 'rgba(200,32,47,0.15)';
      ctx.fillRect(0, 0, W, H);
    }
    drawOver();
  }
}

/* ============================================================
   VSTUPY
   ============================================================ */
function toCanvasXY(e){
  var r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function tryDrawFake(x, y){
  if (state !== STATE_PLAY) return;
  if (now < drawCooldownUntil) return;
  x = clamp(x, MARGIN_L + 16, W - MARGIN_R - 16);
  y = clamp(y, MARGIN_T + 16, H - MARGIN_B - 16);
  // limit současně nakreslených hráčem
  var drawn = 0;
  for (var i = 0; i < fakes.length; i++) if (!fakes[i].auto) drawn++;
  if (drawn >= 3) return;
  fakes.push({ x: x, y: y, auto: false, seed: Math.random() * 1000 });
  drawCooldownUntil = now + DRAW_COOLDOWN;
  snd.scratch();
}
function primaryAction(x, y){
  // klik/ťuk podle stavu
  if (state === STATE_MENU){
    resetGame();
  } else if (state === STATE_PAUSE){
    state = STATE_PLAY;
  } else if (state === STATE_OVER){
    if (wallNow - overAt > 0.7) resetGame();
  } else if (state === STATE_PLAY){
    tryDrawFake(x, y);
  }
}

canvas.addEventListener('mousemove', function(e){
  var p = toCanvasXY(e);
  target.x = p.x; target.y = p.y;
});
canvas.addEventListener('mousedown', function(e){
  ensureAudio();
  var p = toCanvasXY(e);
  target.x = p.x; target.y = p.y;
  primaryAction(p.x, p.y);
});

var touchStart = null;
canvas.addEventListener('touchstart', function(e){
  e.preventDefault();
  ensureAudio();
  var t = e.changedTouches[0];
  var r = canvas.getBoundingClientRect();
  var x = t.clientX - r.left, y = t.clientY - r.top;
  touchStart = { x: x, y: y, t: wallNow };
  if (state !== STATE_PLAY){
    primaryAction(x, y);
  } else {
    target.x = x; target.y = y;
  }
}, { passive: false });
canvas.addEventListener('touchmove', function(e){
  e.preventDefault();
  var t = e.changedTouches[0];
  var r = canvas.getBoundingClientRect();
  target.x = t.clientX - r.left; target.y = t.clientY - r.top;
}, { passive: false });
canvas.addEventListener('touchend', function(e){
  e.preventDefault();
  if (!touchStart) return;
  var t = e.changedTouches[0];
  var r = canvas.getBoundingClientRect();
  var x = t.clientX - r.left, y = t.clientY - r.top;
  var moved = dist(x, y, touchStart.x, touchStart.y);
  var dur = wallNow - touchStart.t;
  if (state === STATE_PLAY && dur < 0.28 && moved < 16){
    tryDrawFake(x, y);   // krátký ťuk = tužka
  }
  touchStart = null;
}, { passive: false });

window.addEventListener('keydown', function(e){
  ensureAudio();
  if (e.key === ' ' || e.key === 'Spacebar'){
    e.preventDefault();
    if (state === STATE_MENU) resetGame();
    else if (state === STATE_PAUSE) state = STATE_PLAY;
    else if (state === STATE_OVER && wallNow - overAt > 0.7) resetGame();
    return;
  }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowDown') e.preventDefault();
  keys[e.key] = true;
  if (state === STATE_PAUSE) state = STATE_PLAY;
});
window.addEventListener('keyup', function(e){
  keys[e.key] = false;
});

/* pauza při ztrátě fokusu */
function pauseIfPlaying(){
  if (state === STATE_PLAY){
    state = STATE_PAUSE;
    keys = {};
  }
}
window.addEventListener('blur', pauseIfPlaying);
document.addEventListener('visibilitychange', function(){
  if (document.hidden) pauseIfPlaying();
});

/* ============================================================
   SMYČKA
   ============================================================ */
var lastT = 0;
function frame(ts){
  var t = ts / 1000;
  var dt = lastT ? (t - lastT) : 0.016;
  lastT = t;
  if (dt > 0.05) dt = 0.05;  // po pauze / laggy frame žádné skoky
  wallNow += dt;
  if (state === STATE_PLAY) update(dt);
  draw();
  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);

/* testovací háček (neškodný, jen čtení/řízení pro autotesty) */
window.__svacina = {
  get state(){ return state; },
  get now(){ return now; },
  get player(){ return player; },
  get snake(){ return snake; },
  get fakes(){ return fakes; },
  get blots(){ return blots; },
  get target(){ return target; },
  get bestTime(){ return bestTime; },
  get qmark(){ return qmark; },
  start: resetGame,
  setTarget: function(x, y){ target.x = x; target.y = y; },
  step: function(dt){ if (state === STATE_PLAY) update(dt); },
  cheat: function(o){
    if (o && o.now !== undefined) now = o.now;
    if (o && o.grace !== undefined) graceUntil = o.grace;
  },
  kill: die
};

})();
</script>
