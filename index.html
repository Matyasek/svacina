<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SVAČINA</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#f6f3e8; }
  #c { display:block; width:100vw; height:100vh; touch-action:none; cursor:crosshair; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
(function(){

/* ============================== zaklad ============================== */

var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");
var W = 0, H = 0, DPR = 1;

var FONT = '"Segoe Print","Bradley Hand","Marker Felt","Comic Sans MS",cursive';

var CFG = {
  playerR: 13,
  accel: 980,
  fric: 2.4,          // exponencialni tlumeni
  maxSpeed: 335,
  blotSlow: 0.42,     // nasobek max rychlosti v kance
  glassesSlow: 0.5,   // nasobek pri kance na bryle
  glassesDur: 3.5,

  segR: 10,
  headR: 12.5,
  spacing: 15,
  startLen: 10,
  minLen: 5,
  snakeBase: 104,
  snakeAccel: 1.5,
  snakeMax: 272,

  grace: 2.0,
  lungeMin: 8, lungeMax: 14,
  teleDur: 0.5,
  sprintDur: 1.0,
  sprintMul: 2.05,

  fakeAutoMin: 8, fakeAutoMax: 12,
  fakeAutoMax2: 2,      // max automatickych na plose
  fakeLife: 26,
  fakeGrow: 4,
  drawCd: 4.0,

  markMin: 9, markMax: 16,
  markLife: 7,

  eraseCount: 5,
  bellDur: 2.0
};

/* deterministicky sum pro "boiling lines" */
var boil = 0;
function jr(seed){
  var x = Math.sin(seed * 127.1 + boil * 311.7 + 0.5) * 43758.5453;
  return x - Math.floor(x);
}
function rnd(a, b){ return a + Math.random() * (b - a); }
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function dist(ax, ay, bx, by){ var dx = ax - bx, dy = ay - by; return Math.sqrt(dx*dx + dy*dy); }
function angNorm(a){ while(a > Math.PI) a -= Math.PI*2; while(a < -Math.PI) a += Math.PI*2; return a; }

/* ============================== zvuk ============================== */

var AC = null, master = null, audioReady = false;
function initAudio(){
  if(audioReady) return;
  try{
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if(!Ctor) return;
    AC = new Ctor();
    master = AC.createGain();
    master.gain.value = 0.5;
    master.connect(AC.destination);
    audioReady = true;
  }catch(e){ AC = null; audioReady = false; }
}
function ac(){
  if(!audioReady || !AC) return null;
  if(AC.state === "suspended"){ try{ AC.resume(); }catch(e){} }
  return AC;
}
function tone(freq, dur, type, vol, slideTo, when){
  var a = ac(); if(!a) return;
  try{
    var t0 = a.currentTime + (when || 0);
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t0);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(slideTo, 1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }catch(e){}
}
function noiseBurst(dur, vol, f0, f1, type, when){
  var a = ac(); if(!a) return;
  try{
    var t0 = a.currentTime + (when || 0);
    var len = Math.max(1, Math.floor(a.sampleRate * dur));
    var buf = a.createBuffer(1, len, a.sampleRate);
    var d = buf.getChannelData(0);
    for(var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    var src = a.createBufferSource(); src.buffer = buf;
    var f = a.createBiquadFilter();
    f.type = type || "bandpass";
    f.frequency.setValueAtTime(f0, t0);
    if(f1) f.frequency.exponentialRampToValueAtTime(Math.max(f1, 20), t0 + dur);
    f.Q.value = 1.2;
    var g = a.createGain();
    g.gain.setValueAtTime(vol || 0.2, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0); src.stop(t0 + dur + 0.05);
  }catch(e){}
}
function sScratch(){ noiseBurst(0.13, 0.3, 2200, 900); noiseBurst(0.09, 0.2, 1500, 700, "bandpass", 0.09); }
function sWarn(){ tone(150, 0.09, "square", 0.16); tone(150, 0.09, "square", 0.16, 0, 0.13); tone(190, 0.12, "square", 0.18, 0, 0.26); }
function sBell(){ tone(1318, 0.7, "sine", 0.22); tone(1760, 0.5, "sine", 0.12, 0, 0.02); tone(659, 0.35, "triangle", 0.1); }
function sErase(){ noiseBurst(0.16, 0.3, 700, 350, "lowpass"); noiseBurst(0.14, 0.25, 650, 300, "lowpass", 0.14); }
function sBlot(){ tone(320, 0.5, "sawtooth", 0.2, 85); tone(160, 0.5, "triangle", 0.14, 60, 0.05); }
function sCrunch(){ noiseBurst(0.2, 0.5, 500, 120, "lowpass"); tone(95, 0.3, "square", 0.25, 38); }
function sChomp(){ noiseBurst(0.08, 0.25, 900, 300, "lowpass"); tone(120, 0.1, "square", 0.12, 70); }

/* ============================== stav hry ============================== */

var G = {
  state: "menu",       // menu | play | pause | over
  t: 0,
  grace: 0,
  best: 0,
  newBest: false,
  overCd: 0,
  player: null,
  snake: null,
  fakes: [],
  blots: [],
  marks: [],
  floats: [],
  fakeTimer: 0,
  markTimer: 0,
  drawCd: 0,
  glasses: 0,
  overTime: 0,
  shake: 0
};

function loadBest(){
  try{
    var v = window.localStorage.getItem("svacina_best");
    if(v !== null){ var n = parseFloat(v); if(isFinite(n) && n > 0) G.best = n; }
  }catch(e){}
}
function saveBest(){
  try{ window.localStorage.setItem("svacina_best", String(G.best)); }catch(e){}
}

function resetGame(){
  G.t = 0;
  G.grace = CFG.grace;
  G.newBest = false;
  G.glasses = 0;
  G.shake = 0;
  G.fakes = [];
  G.marks = [];
  G.floats = [];
  G.fakeTimer = rnd(CFG.fakeAutoMin, CFG.fakeAutoMax) * 0.5;
  G.markTimer = rnd(6, 10);
  G.drawCd = 0;

  var px = W * 0.5, py = H * 0.62;
  G.player = {
    x: px, y: py, vx: 0, vy: 0, rot: 0,
    tx: px, ty: py, hasTarget: false
  };

  // had startuje v rohu nejdal od hrace
  var corners = [[70,70],[W-70,70],[70,H-70],[W-70,H-70]];
  var bi = 0, bd = -1;
  for(var i = 0; i < 4; i++){
    var d = dist(corners[i][0], corners[i][1], px, py);
    if(d > bd){ bd = d; bi = i; }
  }
  var hx = corners[bi][0], hy = corners[bi][1];
  var heading = Math.atan2(py - hy, px - hx);
  var snake = {
    x: hx, y: hy, heading: heading,
    segs: [], path: [], pathLen: 0,
    lungeT: rnd(CFG.lungeMin, CFG.lungeMax),
    phase: "none", phaseT: 0,
    freeze: 0, brake: 0, closeT: 0,
    targetX: px, targetY: py, targetIsFake: false
  };
  // predvyplnit cestu dozadu, aby telo bylo videt hned
  var backA = heading + Math.PI;
  var need = CFG.spacing * (CFG.startLen + 3);
  var steps = Math.ceil(need / 4);
  for(var s = 0; s <= steps; s++){
    snake.path.push({ x: hx + Math.cos(backA) * s * 4, y: hy + Math.sin(backA) * s * 4 });
    if(s > 0) snake.pathLen += 4;
  }
  for(var k = 0; k < CFG.startLen; k++) snake.segs.push({ x: hx, y: hy });
  G.snake = snake;
  updateSegments();

  makeBlots();
}

function makeBlots(){
  G.blots = [];
  var count = 2 + Math.floor(Math.random() * 3); // 2-4
  var margin = Math.min(140, Math.min(W, H) * 0.18);
  var gap = 190;
  var tries = 0;
  while(G.blots.length < count && tries < 900){
    tries++;
    if(tries % 150 === 0) gap = Math.max(50, gap - 45); // kdyz se nedari, uvolnit rozestupy
    var r = rnd(42, 68);
    if(W - 2 * (margin + r) < 20 || H - 2 * (margin + r) < 20) r = 40;
    var x = rnd(margin + r, Math.max(margin + r + 1, W - margin - r));
    var y = rnd(margin + r, Math.max(margin + r + 1, H - margin - r));
    if(!(isFinite(x) && isFinite(y))) break;
    var ok = true;
    for(var i = 0; i < G.blots.length; i++){
      if(dist(x, y, G.blots[i].x, G.blots[i].y) < r + G.blots[i].r + gap){ ok = false; break; }
    }
    if(ok && G.player && dist(x, y, G.player.x, G.player.y) < r + 140) ok = false;
    if(ok && G.snake && dist(x, y, G.snake.x, G.snake.y) < r + 120) ok = false;
    if(ok){
      var blob = { x: x, y: y, r: r, seed: Math.random() * 1000, pts: [] };
      var n = 14;
      for(var p = 0; p < n; p++){
        blob.pts.push(0.72 + Math.random() * 0.42);
      }
      G.blots.push(blob);
    }
  }
}

/* ============================== update ============================== */

function inBlot(x, y){
  for(var i = 0; i < G.blots.length; i++){
    var b = G.blots[i];
    if(dist(x, y, b.x, b.y) < b.r * 0.92) return true;
  }
  return false;
}

var keys = {};
var keySteering = false;

function updatePlayer(dt){
  var p = G.player;
  var ax = 0, ay = 0;
  var kx = 0, ky = 0;
  if(keys["ArrowLeft"] || keys["KeyA"]) kx -= 1;
  if(keys["ArrowRight"] || keys["KeyD"]) kx += 1;
  if(keys["ArrowUp"] || keys["KeyW"]) ky -= 1;
  if(keys["ArrowDown"] || keys["KeyS"]) ky += 1;

  if(kx !== 0 || ky !== 0){
    keySteering = true;
    var kl = Math.sqrt(kx*kx + ky*ky);
    ax = kx / kl; ay = ky / kl;
  } else if(!keySteering && p.hasTarget){
    var dx = p.tx - p.x, dy = p.ty - p.y;
    var d = Math.sqrt(dx*dx + dy*dy);
    if(d > 3){
      var m = clamp(d / 70, 0.15, 1);
      ax = dx / d * m; ay = dy / d * m;
    }
  }

  var slowed = inBlot(p.x, p.y);
  var acc = CFG.accel * (slowed ? 0.55 : 1) * (G.glasses > 0 ? 0.7 : 1);
  p.vx += ax * acc * dt;
  p.vy += ay * acc * dt;

  var fr = CFG.fric + (slowed ? 5.5 : 0) + (G.glasses > 0 ? 1.6 : 0);
  var damp = Math.exp(-fr * dt);
  p.vx *= damp; p.vy *= damp;

  var vmax = CFG.maxSpeed;
  if(slowed) vmax *= CFG.blotSlow;
  if(G.glasses > 0) vmax *= CFG.glassesSlow;
  var sp = Math.sqrt(p.vx*p.vx + p.vy*p.vy);
  if(sp > vmax){ p.vx *= vmax / sp; p.vy *= vmax / sp; sp = vmax; }

  p.x += p.vx * dt;
  p.y += p.vy * dt;

  var R = CFG.playerR + 2;
  if(p.x < R){ p.x = R; p.vx = Math.abs(p.vx) * 0.35; }
  if(p.x > W - R){ p.x = W - R; p.vx = -Math.abs(p.vx) * 0.35; }
  if(p.y < R){ p.y = R; p.vy = Math.abs(p.vy) * 0.35; }
  if(p.y > H - R){ p.y = H - R; p.vy = -Math.abs(p.vy) * 0.35; }

  var dir = (Math.abs(p.vx) >= Math.abs(p.vy) ? (p.vx >= 0 ? 1 : -1) : (p.vy >= 0 ? 1 : -1));
  p.rot += sp / CFG.playerR * dt * dir;

  if(G.glasses > 0) G.glasses -= dt;
}

function snakeSpeed(){
  return Math.min(CFG.snakeBase + G.t * CFG.snakeAccel, CFG.snakeMax);
}

function updateSnake(dt){
  var s = G.snake, p = G.player;

  if(s.freeze > 0){
    s.freeze -= dt;
    return; // stoji uplne (zvonek = prestavka)
  }

  // vyber cile: hrac, nebo blizsi falesne jablko
  var bx = p.x, by = p.y, isFake = false, bestFake = -1;
  var bd = dist(s.x, s.y, p.x, p.y);
  for(var i = 0; i < G.fakes.length; i++){
    var f = G.fakes[i];
    var d = dist(s.x, s.y, f.x, f.y);
    if(d < bd){ bd = d; bx = f.x; by = f.y; isFake = true; bestFake = i; }
  }
  s.targetX = bx; s.targetY = by; s.targetIsFake = isFake;

  // vypadovy automat
  if(s.phase === "none"){
    s.lungeT -= dt;
    if(s.lungeT <= 0 && G.grace <= 0){
      s.phase = "tele"; s.phaseT = CFG.teleDur; sWarn();
    }
  } else if(s.phase === "tele"){
    s.phaseT -= dt;
    if(s.phaseT <= 0){
      s.phase = "sprint"; s.phaseT = CFG.sprintDur;
      s.heading = Math.atan2(by - s.y, bx - s.x);
    }
  } else if(s.phase === "sprint"){
    s.phaseT -= dt;
    if(s.phaseT <= 0){ s.phase = "none"; s.lungeT = rnd(CFG.lungeMin, CFG.lungeMax); }
  }

  var speed = snakeSpeed();
  if(s.phase === "sprint"){
    speed *= CFG.sprintMul;
    // pri sprintu se nezataci
  } else {
    if(s.phase === "tele") speed *= 0.85;
    var des = Math.atan2(by - s.y, bx - s.x);
    var da = angNorm(des - s.heading);
    // blizko cile zataci ostreji: polomer zatacky <= 0.42 * vzdalenost
    var tr = Math.max(2.4, speed / (0.42 * Math.max(bd, 26)));
    tr = Math.min(tr, 15);
    // posledni zachrana proti krouzeni
    if(bd < 170){
      s.closeT += dt;
      if(s.closeT > 3){ s.brake = 0.6; s.closeT = 1.2; }
    } else {
      s.closeT = 0;
    }
    if(s.brake > 0){ s.brake -= dt; speed *= 0.72; tr *= 1.7; }
    s.heading += clamp(da, -tr * dt, tr * dt);
  }

  // odrazit hlavu od okraju (aby had neodjel z papiru)
  var mvx = Math.cos(s.heading) * speed * dt;
  var mvy = Math.sin(s.heading) * speed * dt;
  var nx = s.x + mvx, ny = s.y + mvy;
  var m = 14;
  if(nx < m || nx > W - m || ny < m || ny > H - m){
    nx = clamp(nx, m, W - m);
    ny = clamp(ny, m, H - m);
    if(s.phase === "sprint"){ s.phase = "none"; s.lungeT = rnd(CFG.lungeMin, CFG.lungeMax); }
    s.heading = Math.atan2(by - ny, bx - nx);
  }
  var moved = dist(s.x, s.y, nx, ny);
  s.x = nx; s.y = ny;

  // zapis do cesty
  if(s.path.length === 0){
    s.path.unshift({ x: s.x, y: s.y });
  } else {
    var hd = dist(s.x, s.y, s.path[0].x, s.path[0].y);
    if(hd >= 2){
      s.path.unshift({ x: s.x, y: s.y });
      s.pathLen += hd;
    }
  }
  var need = CFG.spacing * (s.segs.length + 2) + 40;
  while(s.path.length > 2 && s.pathLen > need){
    var last = s.path[s.path.length - 1];
    var prev = s.path[s.path.length - 2];
    var dd = dist(last.x, last.y, prev.x, prev.y);
    if(s.pathLen - dd < need) break;
    s.path.pop();
    s.pathLen -= dd;
  }

  updateSegments();

  // snezeni falesneho jablka
  for(var j = G.fakes.length - 1; j >= 0; j--){
    var fa = G.fakes[j];
    if(dist(s.x, s.y, fa.x, fa.y) < CFG.headR + 13){
      G.fakes.splice(j, 1);
      var tail = s.segs.length ? s.segs[s.segs.length - 1] : { x: s.x, y: s.y };
      for(var g = 0; g < CFG.fakeGrow; g++) s.segs.push({ x: tail.x, y: tail.y });
      sChomp();
      addFloat(fa.x, fa.y, "chramst!", "#2b4fa8");
      s.closeT = 0;
    }
  }

  // kolize s hracem — cele telo je smrtici
  if(G.grace <= 0){
    var killD = (CFG.playerR + CFG.segR) * 0.72;
    if(dist(s.x, s.y, p.x, p.y) < (CFG.playerR + CFG.headR) * 0.74){ die(); return; }
    for(var q = 0; q < s.segs.length; q++){
      var sg = s.segs[q];
      if(dist(sg.x, sg.y, p.x, p.y) < killD){ die(); return; }
    }
  }
}

function updateSegments(){
  var s = G.snake;
  var pth = s.path;
  if(pth.length < 2){
    for(var i0 = 0; i0 < s.segs.length; i0++){ s.segs[i0].x = s.x; s.segs[i0].y = s.y; }
    return;
  }
  var k = 0, acc = 0;
  var segLen = dist(pth[0].x, pth[0].y, pth[1].x, pth[1].y);
  for(var i = 0; i < s.segs.length; i++){
    var target = (i + 1) * CFG.spacing;
    while(k < pth.length - 2 && acc + segLen < target){
      acc += segLen;
      k++;
      segLen = dist(pth[k].x, pth[k].y, pth[k+1].x, pth[k+1].y);
    }
    var r = segLen > 0.0001 ? clamp((target - acc) / segLen, 0, 1) : 0;
    s.segs[i].x = pth[k].x + (pth[k+1].x - pth[k].x) * r;
    s.segs[i].y = pth[k].y + (pth[k+1].y - pth[k].y) * r;
  }
}

function spawnFake(x, y, drawn){
  G.fakes.push({ x: x, y: y, t: 0, seed: Math.random() * 1000, drawn: !!drawn });
}

function autoFakeSpot(){
  // nahodne misto dal od hada i hrace
  for(var t = 0; t < 40; t++){
    var x = rnd(60, W - 60), y = rnd(60, H - 60);
    if(dist(x, y, G.snake.x, G.snake.y) < 130) continue;
    if(dist(x, y, G.player.x, G.player.y) < 90) continue;
    return { x: x, y: y };
  }
  return { x: W * 0.5, y: H * 0.5 };
}

function updateFakes(dt){
  G.fakeTimer -= dt;
  var autoCount = 0;
  for(var i = 0; i < G.fakes.length; i++) if(!G.fakes[i].drawn) autoCount++;
  if(G.fakeTimer <= 0){
    if(autoCount < CFG.fakeAutoMax2){
      var spot = autoFakeSpot();
      spawnFake(spot.x, spot.y, false);
      sScratch();
    }
    G.fakeTimer = rnd(CFG.fakeAutoMin, CFG.fakeAutoMax);
  }
  for(var j = G.fakes.length - 1; j >= 0; j--){
    G.fakes[j].t += dt;
    if(G.fakes[j].t > CFG.fakeLife) G.fakes.splice(j, 1);
  }
  if(G.drawCd > 0) G.drawCd -= dt;
}

function updateMarks(dt){
  G.markTimer -= dt;
  if(G.markTimer <= 0){
    if(G.marks.length < 2){
      for(var t = 0; t < 40; t++){
        var x = rnd(80, W - 80), y = rnd(90, H - 80);
        if(dist(x, y, G.snake.x, G.snake.y) < 120) continue;
        var okB = true;
        for(var b = 0; b < G.blots.length; b++){
          if(dist(x, y, G.blots[b].x, G.blots[b].y) < G.blots[b].r + 40){ okB = false; break; }
        }
        if(!okB) continue;
        G.marks.push({ x: x, y: y, t: 0, seed: Math.random() * 1000 });
        break;
      }
    }
    G.markTimer = rnd(CFG.markMin, CFG.markMax);
  }
  var p = G.player;
  for(var i = G.marks.length - 1; i >= 0; i--){
    var mk = G.marks[i];
    mk.t += dt;
    if(mk.t > CFG.markLife){ G.marks.splice(i, 1); continue; }
    if(dist(mk.x, mk.y, p.x, p.y) < CFG.playerR + 21){
      G.marks.splice(i, 1);
      var roll = Math.random();
      if(roll < 0.4){
        // GUMA
        var s = G.snake;
        var n = Math.min(CFG.eraseCount, Math.max(0, s.segs.length - CFG.minLen));
        if(n > 0) s.segs.splice(s.segs.length - n, n);
        sErase();
        addFloat(p.x, p.y - 26, "GUMA! Had je kratší.", "#b02020");
      } else if(roll < 0.8){
        // ZVONEK
        G.snake.freeze = CFG.bellDur;
        sBell();
        addFloat(p.x, p.y - 26, "ZVONEK! Přestávka.", "#b02020");
      } else {
        // KANKA NA BRYLE
        G.glasses = CFG.glassesDur;
        sBlot();
        addFloat(p.x, p.y - 26, "KAŇKA NA BRÝLE!", "#1a2a55");
      }
    }
  }
}

function addFloat(x, y, txt, color){
  G.floats.push({ x: x, y: y, txt: txt, color: color, t: 0 });
}
function updateFloats(dt){
  for(var i = G.floats.length - 1; i >= 0; i--){
    var f = G.floats[i];
    f.t += dt; f.y -= 22 * dt;
    if(f.t > 1.4) G.floats.splice(i, 1);
  }
}

function die(){
  G.state = "over";
  G.overTime = G.t;
  G.overCd = 0.5;
  G.shake = 0.4;
  sCrunch();
  if(G.overTime > G.best){
    G.best = G.overTime;
    G.newBest = true;
    saveBest();
  }
}

function gradeFor(t){
  if(t < 15) return { n: 5, txt: "Sežrán před zvoněním. Sedni si, pětka!" };
  if(t < 30) return { n: 4, txt: "Slabé. Příště víc kličkuj a kresli jablka." };
  if(t < 60) return { n: 3, txt: "Průměr. Had měl skoro hotovo." };
  if(t < 120) return { n: 2, txt: "Velmi dobré. Skoro jsi mu utekl." };
  return { n: 1, txt: "Výborně! Hada jsi úplně vyškolil." };
}

function update(dt){
  G.t += dt;
  if(G.grace > 0) G.grace -= dt;
  if(G.shake > 0) G.shake -= dt;
  updatePlayer(dt);
  updateSnake(dt);
  if(G.state !== "play") return;
  updateFakes(dt);
  updateMarks(dt);
  updateFloats(dt);
}

/* ============================== pozadi (sesit) ============================== */

var bgCanvases = [];
function buildBackground(){
  bgCanvases = [];
  for(var v = 0; v < 3; v++){
    var oc = document.createElement("canvas");
    oc.width = Math.max(1, Math.floor(W * DPR));
    oc.height = Math.max(1, Math.floor(H * DPR));
    var o = oc.getContext("2d");
    o.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawPaper(o, v * 137.3);
    bgCanvases.push(oc);
  }
}

function drawPaper(o, seed){
  function pr(n){ var x = Math.sin((seed + n) * 91.7 + 13.1) * 24634.63; return x - Math.floor(x); }
  o.fillStyle = "#fbf9ef";
  o.fillRect(0, 0, W, H);
  // ctverecky
  var cell = 34;
  o.strokeStyle = "rgba(120,160,210,0.35)";
  o.lineWidth = 1;
  o.beginPath();
  for(var x = cell; x < W; x += cell){ o.moveTo(x + 0.5, 0); o.lineTo(x + 0.5, H); }
  for(var y = cell; y < H; y += cell){ o.moveTo(0, y + 0.5); o.lineTo(W, y + 0.5); }
  o.stroke();
  // okraj stranky (cervena linka)
  var mx = Math.min(56, W * 0.1);
  o.strokeStyle = "rgba(200,60,60,0.55)";
  o.lineWidth = 2;
  o.beginPath();
  o.moveTo(mx + pr(1) * 2, 0);
  o.lineTo(mx + pr(2) * 2, H);
  o.stroke();
  // lehke zaslé okraje papiru
  o.strokeStyle = "rgba(120,110,90,0.25)";
  o.lineWidth = 3;
  o.strokeRect(1.5, 1.5, W - 3, H - 3);

  // dekorace: tuzkove cmaranice na okrajich
  var pencil = "rgba(110,110,115,0.5)";
  o.strokeStyle = pencil;
  o.lineWidth = 1.6;
  o.lineCap = "round";

  function wob(x1, y1, x2, y2, n, amp){
    o.beginPath();
    for(var i = 0; i <= n; i++){
      var t = i / n;
      var px = x1 + (x2 - x1) * t + (pr(x1 + y2 + i) - 0.5) * amp;
      var py = y1 + (y2 - y1) * t + (pr(y1 + x2 + i * 3) - 0.5) * amp;
      if(i === 0) o.moveTo(px, py); else o.lineTo(px, py);
    }
    o.stroke();
  }

  if(W > 480 && H > 480){
    // piskvorky vpravo dole
    var gx = W - 118, gy = H - 118, gs = 26;
    wob(gx + gs, gy, gx + gs, gy + gs * 3, 6, 2.5);
    wob(gx + gs * 2, gy, gx + gs * 2, gy + gs * 3, 6, 2.5);
    wob(gx, gy + gs, gx + gs * 3, gy + gs, 6, 2.5);
    wob(gx, gy + gs * 2, gx + gs * 3, gy + gs * 2, 6, 2.5);
    // par znaku
    wob(gx + 5, gy + 5, gx + gs - 5, gy + gs - 5, 3, 1.5);
    wob(gx + gs - 5, gy + 5, gx + 5, gy + gs - 5, 3, 1.5);
    o.beginPath(); o.arc(gx + gs * 1.5, gy + gs * 1.5, 8 + pr(7), 0, Math.PI * 1.95); o.stroke();
    wob(gx + gs * 2 + 5, gy + gs + 5, gx + gs * 3 - 5, gy + gs * 2 - 5, 3, 1.5);
    wob(gx + gs * 3 - 5, gy + gs + 5, gx + gs * 2 + 5, gy + gs * 2 - 5, 3, 1.5);

    // srdicko vpravo nahore
    var hx = W - 74, hy = 84;
    o.beginPath();
    o.moveTo(hx, hy + 10);
    o.bezierCurveTo(hx - 16, hy - 8, hx - 5, hy - 18, hx, hy - 6);
    o.bezierCurveTo(hx + 5, hy - 18, hx + 16, hy - 8, hx, hy + 10);
    o.stroke();

    // zaskrtana slovicka vlevo dole (v okraji)
    o.font = '13px ' + FONT;
    o.fillStyle = "rgba(110,110,115,0.55)";
    var words = ["the snake", "die Schlange", "hadisko"];
    for(var wi = 0; wi < words.length; wi++){
      var wy2 = H - 150 + wi * 24;
      if(mx > 40){
        o.save();
        o.translate(8, wy2);
        o.rotate(-0.03 + pr(wi) * 0.05);
        o.fillText(words[wi], 0, 0);
        o.restore();
        if(wi < 2) wob(6, wy2 - 4, 6 + 44, wy2 - 5, 4, 2);
      }
    }

    // mala dekoracni kanka u okraje (svetla, tuzkova — NE herni)
    o.fillStyle = "rgba(120,120,125,0.30)";
    o.beginPath();
    o.arc(W - 40, H * 0.45, 7 + pr(21) * 3, 0, Math.PI * 2);
    o.fill();
    o.beginPath();
    o.arc(W - 30, H * 0.45 + 9, 3, 0, Math.PI * 2);
    o.fill();
  }
}

/* ============================== kresleni ============================== */

function wobblyCircle(c, x, y, r, seed, amp, closeIt){
  var n = Math.max(8, Math.floor(r * 0.9));
  c.beginPath();
  for(var i = 0; i <= n; i++){
    var a = i / n * Math.PI * 2;
    var rr = r + (jr(seed + i * 7.13) - 0.5) * amp * 2;
    var px = x + Math.cos(a) * rr;
    var py = y + Math.sin(a) * rr;
    if(i === 0) c.moveTo(px, py); else c.lineTo(px, py);
  }
  if(closeIt !== false) c.closePath();
}

function wobblyLine(c, x1, y1, x2, y2, seed, amp, n){
  n = n || 6;
  c.beginPath();
  var dx = x2 - x1, dy = y2 - y1;
  var len = Math.sqrt(dx*dx + dy*dy) || 1;
  var nxp = -dy / len, nyp = dx / len;
  for(var i = 0; i <= n; i++){
    var t = i / n;
    var off = (jr(seed + i * 3.7) - 0.5) * amp * 2 * (i === 0 || i === n ? 0.3 : 1);
    var px = x1 + dx * t + nxp * off;
    var py = y1 + dy * t + nyp * off;
    if(i === 0) c.moveTo(px, py); else c.lineTo(px, py);
  }
  c.stroke();
}

function drawPlayer(c){
  var p = G.player;
  c.save();
  c.translate(p.x, p.y);

  // ochranna lhuta — carkovany kruh
  if(G.grace > 0 && G.state === "play"){
    c.save();
    c.strokeStyle = "rgba(200,50,50," + (0.35 + 0.3 * Math.sin(G.t * 10)) + ")";
    c.lineWidth = 2;
    c.setLineDash([6, 6]);
    c.beginPath();
    c.arc(0, 0, CFG.playerR + 9, G.t * 2, G.t * 2 + Math.PI * 2);
    c.stroke();
    c.restore();
  }

  // zpomaleni (bryle) — modre skvrnky okolo
  if(G.glasses > 0){
    c.fillStyle = "rgba(26,42,85,0.5)";
    for(var b = 0; b < 3; b++){
      var a = G.t * 3 + b * 2.1;
      c.beginPath();
      c.arc(Math.cos(a) * 20, Math.sin(a) * 20, 3, 0, Math.PI * 2);
      c.fill();
    }
  }

  c.rotate(p.rot);
  var red = "#c0392b";
  c.strokeStyle = red;
  c.lineWidth = 2.6;
  c.lineCap = "round";
  wobblyCircle(c, 0, 0, CFG.playerR, 11.7, 1.4);
  c.stroke();
  // druhy tah (propiska prejeta dvakrat)
  c.lineWidth = 1.2;
  c.globalAlpha = 0.6;
  wobblyCircle(c, 0, 0, CFG.playerR - 1.5, 31.9, 1.6);
  c.stroke();
  c.globalAlpha = 1;
  // vnitrni srafovani, aby bylo videt otaceni
  c.lineWidth = 1.6;
  wobblyLine(c, -CFG.playerR * 0.55, -CFG.playerR * 0.3, CFG.playerR * 0.4, CFG.playerR * 0.5, 5.2, 1, 4);
  wobblyLine(c, -CFG.playerR * 0.3, CFG.playerR * 0.45, CFG.playerR * 0.15, -CFG.playerR * 0.4, 9.4, 1, 4);
  // stopka a listek
  c.lineWidth = 2.4;
  c.strokeStyle = "#7a4a20";
  wobblyLine(c, 0, -CFG.playerR + 1, 2, -CFG.playerR - 7, 3.3, 0.8, 3);
  c.strokeStyle = "#3f7a33";
  c.beginPath();
  c.ellipse(6, -CFG.playerR - 6, 5, 2.6, 0.5 + (jr(77) - 0.5) * 0.2, 0, Math.PI * 2);
  c.stroke();
  c.restore();
}

function drawSnake(c){
  var s = G.snake;
  var blue = "#2b4fa8";
  var alpha = (G.grace > 0 && G.state === "play") ? 0.45 : 1;
  c.save();
  c.globalAlpha = alpha;
  c.lineCap = "round";

  // telo od ocasu k hlave
  for(var i = s.segs.length - 1; i >= 0; i--){
    var sg = s.segs[i];
    var r = CFG.segR * (1 - i / (s.segs.length + 6) * 0.35);
    c.strokeStyle = blue;
    c.lineWidth = 2.2;
    wobblyCircle(c, sg.x, sg.y, r, 100 + i * 13.7, 1.3);
    c.stroke();
  }

  // hlava (pri telegrafovani se zavrti)
  var hx = s.x, hy = s.y;
  if(s.phase === "tele"){
    var wig = Math.sin(G.t * 42) * 3.2;
    hx += Math.cos(s.heading + Math.PI / 2) * wig;
    hy += Math.sin(s.heading + Math.PI / 2) * wig;
  }
  c.strokeStyle = s.phase === "sprint" ? "#173a8f" : blue;
  c.lineWidth = 2.8;
  wobblyCircle(c, hx, hy, CFG.headR, 55.1, 1.4);
  c.stroke();

  // oci
  var ea = s.heading;
  var ex = Math.cos(ea), ey = Math.sin(ea);
  var px2 = -ey, py2 = ex;
  c.fillStyle = "#fbf9ef";
  c.strokeStyle = blue;
  c.lineWidth = 1.4;
  for(var e = -1; e <= 1; e += 2){
    var ox = hx + ex * 4 + px2 * 5 * e;
    var oy = hy + ey * 4 + py2 * 5 * e;
    c.beginPath(); c.arc(ox, oy, 3.4, 0, Math.PI * 2); c.fill(); c.stroke();
    c.fillStyle = "#1a2a55";
    c.beginPath(); c.arc(ox + ex * 1.4, oy + ey * 1.4, 1.5, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#fbf9ef";
  }
  // jazyk
  if(Math.floor(G.t * 2.5) % 2 === 0 || s.phase !== "none"){
    c.strokeStyle = "#b02020";
    c.lineWidth = 1.6;
    var tx = hx + ex * (CFG.headR + 1), ty = hy + ey * (CFG.headR + 1);
    var tx2 = tx + ex * 9, ty2 = ty + ey * 9;
    wobblyLine(c, tx, ty, tx2, ty2, 8.8, 0.8, 3);
    c.beginPath();
    c.moveTo(tx2, ty2);
    c.lineTo(tx2 + (ex * 4 - ey * 3), ty2 + (ey * 4 + ex * 3));
    c.moveTo(tx2, ty2);
    c.lineTo(tx2 + (ex * 4 + ey * 3), ty2 + (ey * 4 - ex * 3));
    c.stroke();
  }
  // zvonek: zzz nad hlavou
  if(s.freeze > 0){
    c.fillStyle = blue;
    c.font = '16px ' + FONT;
    c.fillText("zzz", hx + 10, hy - 16);
  }
  c.restore();
}

function drawFake(c, f){
  var g = "#8a8a90"; // tuzka
  c.save();
  var fade = 1;
  if(f.t < 0.25) fade = f.t / 0.25;
  if(CFG.fakeLife - f.t < 2) fade = Math.max(0, (CFG.fakeLife - f.t) / 2);
  c.globalAlpha = 0.85 * fade;
  c.strokeStyle = g;
  c.lineCap = "round";
  c.lineWidth = 2;
  wobblyCircle(c, f.x, f.y, 12, f.seed, 1.8);
  c.stroke();
  c.lineWidth = 1.1;
  c.globalAlpha = 0.55 * fade;
  wobblyCircle(c, f.x, f.y, 10.5, f.seed + 40, 2.2);
  c.stroke();
  // srafovani tuzkou
  c.globalAlpha = 0.4 * fade;
  for(var i = 0; i < 4; i++){
    var off = -8 + i * 5;
    wobblyLine(c, f.x + off - 3, f.y + 8, f.x + off + 5, f.y - 8, f.seed + i * 3, 1, 3);
  }
  // stopka
  c.globalAlpha = 0.8 * fade;
  c.lineWidth = 1.8;
  wobblyLine(c, f.x, f.y - 11, f.x + 3, f.y - 18, f.seed + 99, 1, 3);
  c.restore();
}

function drawMark(c, mk){
  c.save();
  var fade = 1;
  if(mk.t < 0.3) fade = mk.t / 0.3;
  var left = CFG.markLife - mk.t;
  if(left < 2) fade = (Math.floor(mk.t * 6) % 2 === 0) ? 0.9 : 0.3; // blika pred zmizenim
  c.globalAlpha = fade;
  c.translate(mk.x, mk.y);
  c.rotate((jr(mk.seed) - 0.5) * 0.15);
  c.fillStyle = "#2b4fa8";
  c.font = 'bold 56px ' + FONT;
  c.textAlign = "center";
  c.textBaseline = "middle";
  var jx = (jr(mk.seed + 3) - 0.5) * 2;
  var jy = (jr(mk.seed + 5) - 0.5) * 2;
  c.fillText("?", jx, jy);
  c.restore();
}

function drawBlot(c, b){
  c.save();
  c.fillStyle = "#141c3f";
  c.beginPath();
  var n = b.pts.length;
  for(var i = 0; i <= n; i++){
    var idx = i % n;
    var a = i / n * Math.PI * 2;
    var rr = b.r * b.pts[idx] + (jr(b.seed + idx * 5.1) - 0.5) * 3;
    var px = b.x + Math.cos(a) * rr;
    var py = b.y + Math.sin(a) * rr;
    if(i === 0) c.moveTo(px, py); else c.lineTo(px, py);
  }
  c.closePath();
  c.fill();
  // odlesky a kapicky
  c.fillStyle = "rgba(70,90,160,0.5)";
  c.beginPath(); c.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.16, 0, Math.PI * 2); c.fill();
  c.fillStyle = "#141c3f";
  c.beginPath(); c.arc(b.x + b.r * 0.95, b.y + b.r * 0.5, 4, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(b.x - b.r * 0.8, b.y + b.r * 0.85, 3, 0, Math.PI * 2); c.fill();
  c.restore();
}

function drawHUD(c){
  var red = "#b02020";
  c.save();
  c.fillStyle = red;
  c.textAlign = "left";
  c.textBaseline = "top";
  var small = Math.min(W, H) < 500;
  var fs = small ? 17 : 22;
  c.font = fs + "px " + FONT;
  c.save();
  c.translate(Math.min(66, W * 0.12), 10);
  c.rotate(-0.02 + (jr(500) - 0.5) * 0.01);
  c.fillText("Čas: " + Math.floor(G.t) + " s", 0, 0);
  if(G.best > 0){
    c.font = (fs - 5) + "px " + FONT;
    c.fillText("Rekord: " + Math.floor(G.best) + " s", 0, fs + 6);
  }
  c.restore();

  // tuzka s cooldownem (vpravo nahore)
  var cx = W - (small ? 34 : 46), cy = (small ? 34 : 46), R = small ? 20 : 26;
  c.lineWidth = 2;
  var ready = G.drawCd <= 0;
  c.strokeStyle = ready ? red : "rgba(140,140,145,0.8)";
  c.beginPath();
  if(ready){
    c.arc(cx, cy, R, 0, Math.PI * 2);
  } else {
    var frac = 1 - clamp(G.drawCd / CFG.drawCd, 0, 1);
    c.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac);
  }
  c.stroke();
  // tuzka uvnitr
  c.save();
  c.translate(cx, cy);
  c.rotate(-0.7);
  c.strokeStyle = "#6e6e73";
  c.lineWidth = 2;
  c.beginPath();
  c.moveTo(-8, -3); c.lineTo(6, -3); c.lineTo(11, 0); c.lineTo(6, 3); c.lineTo(-8, 3); c.closePath();
  c.stroke();
  c.beginPath(); c.moveTo(6, -3); c.lineTo(6, 3); c.stroke();
  c.restore();
  if(ready){
    c.fillStyle = red;
    c.font = (small ? 10 : 12) + "px " + FONT;
    c.textAlign = "center";
    c.fillText("klik!", cx, cy + R + 4);
  }
  c.restore();
}

function drawFloats(c){
  c.save();
  c.textAlign = "center";
  c.textBaseline = "bottom";
  for(var i = 0; i < G.floats.length; i++){
    var f = G.floats[i];
    var a = clamp(1.2 - f.t, 0, 1);
    c.globalAlpha = a;
    c.fillStyle = f.color;
    c.font = "bold 18px " + FONT;
    c.fillText(f.txt, f.x, f.y);
  }
  c.restore();
}

function paperWash(c, a){
  c.fillStyle = "rgba(251,249,239," + a + ")";
  c.fillRect(0, 0, W, H);
}

function centerText(c, txt, y, size, color, bold, rot){
  c.save();
  c.translate(W / 2, y);
  c.rotate(rot || 0);
  c.fillStyle = color;
  c.font = (bold ? "bold " : "") + size + "px " + FONT;
  c.textAlign = "center";
  c.textBaseline = "middle";
  c.fillText(txt, (jr(txt.length * 3.1) - 0.5) * 2, (jr(txt.length * 7.7) - 0.5) * 2);
  c.restore();
}

function drawPause(c){

  var u = clamp(Math.min(W, H) / 620, 0.55, 1.25);

function drawOver(c){

  var u = clamp(Math.min(W, H) / 620, 0.55, 1.25);
  var gr = gradeFor(G.overTime);
  centerText(c, "CHRAMST! Sežral tě.", H * 0.2, 34 * u, "#2b4fa8", true, -0.02);
  centerText(c, "Přežil jsi " + Math.floor(G.overTime) + " s", H * 0.3, 24 * u, "#444", false, 0);

  var gy = H * 0.47;

  c.stroke();
  c.lineWidth = 1.6;
  c.globalAlpha = 0.7;
  wobblyCircle(c, W / 2 + 3, gy - 2, 70 * u, 19.2, 5);
  c.stroke();
  c.globalAlpha = 1;

  centerText(c, "„" + gr.txt + "“", H * 0.63, 20 * u, "#b02020", false, -0.01);

  else if(G.best > 0) centerText(c, "Rekord: " + Math.floor(G.best) + " s", H * 0.7, 18 * u, "#666", false, 0);
  if(G.overCd <= 0){
    var blink = Math.floor(performance.now() / 600) % 2 === 0;
    if(blink) centerText(c, "Klikni pro novou hodinu.", H * 0.8, 22 * u, "#b02020", true, 0.01);
  }
}

function render(){
  boil = Math.floor(performance.now() / 150);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  var shx = 0, shy = 0;
  if(G.shake > 0){
    shx = (Math.random() - 0.5) * 8 * G.shake;
    shy = (Math.random() - 0.5) * 8 * G.shake;
  }
  ctx.translate(shx, shy);

  var bg = bgCanvases[boil % bgCanvases.length];
  if(bg) ctx.drawImage(bg, 0, 0, W, H);
  else { ctx.fillStyle = "#fbf9ef"; ctx.fillRect(0, 0, W, H); }

  if(G.state !== "menu"){
    for(var b = 0; b < G.blots.length; b++) drawBlot(ctx, G.blots[b]);
    for(var f = 0; f < G.fakes.length; f++) drawFake(ctx, G.fakes[f]);
    for(var m = 0; m < G.marks.length; m++) drawMark(ctx, G.marks[m]);
    drawSnake(ctx);
    drawPlayer(ctx);
    drawFloats(ctx);
    drawHUD(ctx);
  }

  if(G.state === "menu") drawMenu(ctx);
  else if(G.state === "pause") drawPause(ctx);
  else if(G.state === "over") drawOver(ctx);
}

/* ============================== smycka ============================== */

var lastTs = 0;
function loop(ts){
  var dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if(dt > 0.05) dt = 0.05;
  if(dt < 0) dt = 0;
  if(G.state === "play") update(dt);
  if(G.state === "over" && G.overCd > 0) G.overCd -= dt;
  if(G.shake > 0 && G.state !== "play") G.shake -= dt;
  render();
  requestAnimationFrame(loop);
}

/* ============================== vstup ============================== */

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.max(1, Math.floor(W * DPR));
  canvas.height = Math.max(1, Math.floor(H * DPR));
  buildBackground();
  // udrzet objekty v novem okne
  if(G.player){
    G.player.x = clamp(G.player.x, 20, W - 20);
    G.player.y = clamp(G.player.y, 20, H - 20);
    G.player.tx = clamp(G.player.tx, 0, W);
    G.player.ty = clamp(G.player.ty, 0, H);
  }
  if(G.snake){
    G.snake.x = clamp(G.snake.x, 14, W - 14);
    G.snake.y = clamp(G.snake.y, 14, H - 14);
  }
  for(var i = 0; i < G.blots.length; i++){
    G.blots[i].x = clamp(G.blots[i].x, G.blots[i].r, W - G.blots[i].r);
    G.blots[i].y = clamp(G.blots[i].y, G.blots[i].r, H - G.blots[i].r);
  }
  for(var f = 0; f < G.fakes.length; f++){
    G.fakes[f].x = clamp(G.fakes[f].x, 20, W - 20);
    G.fakes[f].y = clamp(G.fakes[f].y, 20, H - 20);
  }
  for(var m = 0; m < G.marks.length; m++){
    G.marks[m].x = clamp(G.marks[m].x, 30, W - 30);
    G.marks[m].y = clamp(G.marks[m].y, 30, H - 30);
  }
}
window.addEventListener("resize", resize);

function startGame(){
  resetGame();
  G.state = "play";
}

function tryDrawFake(x, y){
  if(G.drawCd > 0) return;
  G.drawCd = CFG.drawCd;
  spawnFake(clamp(x, 16, W - 16), clamp(y, 16, H - 16), true);
  sScratch();
}

/* pointer: pohyb = cil, kratky tap/klik = nakreslit jablko */
var pdTime = 0, pdX = 0, pdY = 0, skipTap = false;

function stateAdvance(){
  // klik/klavesa v ne-hernich stavech
  if(G.state === "menu"){ startGame(); return true; }
  if(G.state === "pause"){
    G.state = "play";
    G.grace = Math.max(G.grace, 0.8);
    return true;
  }
  if(G.state === "over"){
    if(G.overCd <= 0){ startGame(); }
    return true;
  }
  return false;
}

canvas.addEventListener("pointerdown", function(e){
  initAudio();
  e.preventDefault();
  pdTime = performance.now(); pdX = e.clientX; pdY = e.clientY;
  skipTap = false;
  if(G.state !== "play"){
    skipTap = true;
    stateAdvance();
    return;
  }
  keySteering = false;
  G.player.tx = e.clientX; G.player.ty = e.clientY; G.player.hasTarget = true;
});

canvas.addEventListener("pointermove", function(e){
  if(!G.player) return;
  keySteering = false;
  G.player.tx = e.clientX; G.player.ty = e.clientY; G.player.hasTarget = true;
});

canvas.addEventListener("pointerup", function(e){
  e.preventDefault();
  if(G.state !== "play" || skipTap) return;
  var dt = performance.now() - pdTime;
  var moved = dist(e.clientX, e.clientY, pdX, pdY);
  if(dt < 350 && moved < 14){
    tryDrawFake(e.clientX, e.clientY);
  }
});

canvas.addEventListener("pointercancel", function(){ skipTap = true; });

window.addEventListener("keydown", function(e){
  initAudio();
  var code = e.code;
  if(code === "ArrowLeft" || code === "ArrowRight" || code === "ArrowUp" || code === "ArrowDown" || code === "Space"){
    e.preventDefault();
  }
  if(G.state !== "play"){
    if(!e.repeat) stateAdvance();
    return;
  }
  keys[code] = true;
});
window.addEventListener("keyup", function(e){
  keys[e.code] = false;
});

function pauseGame(){
  if(G.state === "play"){
    G.state = "pause";
    keys = {};
  }
}
window.addEventListener("blur", pauseGame);
document.addEventListener("visibilitychange", function(){
  if(document.hidden) pauseGame();
});

/* ============================== start ============================== */

loadBest();
resize();
resetGame();
G.state = "menu";
requestAnimationFrame(function(ts){ lastTs = ts; requestAnimationFrame(loop); });

/* maly hak pro automaticke testy (nic neloguje) */
window.__SV = {
  G: G, CFG: CFG,
  step: function(dt){ update(dt); if(G.state === "over" && G.overCd > 0) G.overCd -= dt; },
  start: startGame,
  reset: resetGame,
  drawFake: tryDrawFake
};

})();
</script>
